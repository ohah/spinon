<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spinon C06.2 spacing percentage oracle</title>
  <style>
    * { box-sizing: content-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    #root { width: 320px; height: 800px; }
    .margin-cb, .padding-cb { display: flex; flex-direction: column; width: 200px; height: 120px; }
    .boxed-cb { display: flex; flex-direction: column; box-sizing: border-box; width: 260px; height: 180px; padding: 30px; }
    .box-probe { flex: 0 0 auto; width: 20px; height: 10px; }
    #m-box-basis { margin: 10%; }
    #p-box-basis { padding: 10%; }
    .margin-probe { flex: 0 0 auto; width: 20px; height: 20px; }
    #m-physical { margin: 10%; }
    #m-negative { margin: -5%; }
    #m-zero { margin: 0%; }
    #m-fraction { margin: 33.333%; }
    #m-over100 { margin: 125%; }
    #m-four { margin: 1% 2% 3% 4%; }
    #m-two { margin: 10% 5%; }
    #m-three { margin: 10% 5% 2%; }
    #m-override { margin: 10%; }
    #m-invalid-auto { margin: auto; }
    #variables { display: flex; flex-direction: column; width: 200px; height: 120px; --space: 12.5%; --negative: -10%; }
    #m-var, #m-var-negative, #p-var, #p-var-negative { flex: 0 0 auto; }
    #m-var { width: 20px; height: 20px; margin: var(--space); }
    #m-var-negative { width: 20px; height: 20px; margin-left: 4px; margin-left: var(--negative); }
    #logical-ltr, #logical-rtl { display: flex; width: 200px; height: 120px; }
    #logical-ltr { direction: ltr; }
    #logical-rtl { direction: rtl; }
    .logical-probe { flex: 0 0 auto; width: 20px; height: 20px; margin-block: 10% 20%; margin-inline: 15% 25%; }
    #p-physical, #p-fraction, #p-over100, #p-invalid-negative { flex: 0 0 auto; }
    #p-physical { width: 20px; height: 10px; padding: 10%; }
    #p-zero { flex: 0 0 auto; width: 20px; height: 10px; padding: 0%; }
    #p-fraction { width: 20px; height: 10px; padding: 33.333%; }
    #p-over100 { width: 20px; height: 10px; padding: 125%; }
    #p-invalid-negative { width: 20px; height: 10px; padding: 8px; padding-left: -10%; }
    #p-four { width: 20px; height: 10px; padding: 1% 2% 3% 4%; }
    #p-logical-ltr, #p-logical-rtl { display: flex; width: 200px; height: 120px; }
    #p-logical-ltr { direction: ltr; }
    #p-logical-rtl { direction: rtl; }
    .logical-padding { flex: 0 0 auto; width: 20px; height: 10px; padding-block: 10% 20%; padding-inline: 15% 25%; }
    #p-var { width: 20px; height: 10px; padding: var(--space); }
    #p-var-negative { width: 20px; height: 10px; padding-left: 8px; padding-left: var(--negative); }
    .gap-cb { display: flex; box-sizing: border-box; width: 260px; height: 180px; padding: 30px; }
    .gap-child { flex: 0 0 20px; height: 10px; }
    #g-row { column-gap: 10%; row-gap: 25%; }
    #g-column { flex-direction: column; column-gap: 10%; row-gap: 25%; }
    #g-shorthand { gap: 25% 10%; }
    #g-one-value { gap: 10%; }
    #g-zero { column-gap: 0%; }
    #g-over100 { column-gap: 150%; }
    #g-negative { column-gap: 8px; column-gap: -10%; }
    #g-normal { gap: normal; }
    #g-var { --space: 12.5%; column-gap: var(--space); }
    #g-var-negative { --negative: -10%; column-gap: 8px; column-gap: var(--negative); }
    #g-auto-column { display: flex; flex-direction: column; width: 100px; row-gap: 10%; }
    #g-auto-column > .gap-child { flex-basis: 10px; }
    #g-auto-width-row { display: flex; height: 40px; column-gap: 10%; }
    #g-stretch-parent { display: flex; width: 200px; height: 120px; }
    #g-stretched-column { display: flex; flex-direction: column; width: 100px; height: auto; row-gap: 10%; }
    #g-stretched-column > .gap-child { flex-basis: 10px; }
    #g-auto-row-inline { display: inline-flex; column-gap: 10%; }
  </style>
</head>
<body>
  <div id="root">
    <div id="margin-cb" class="margin-cb">
      <div id="m-physical" class="margin-probe"></div>
      <div id="m-negative" class="margin-probe"></div>
      <div id="m-zero" class="margin-probe"></div>
      <div id="m-fraction" class="margin-probe"></div>
      <div id="m-over100" class="margin-probe"></div>
      <div id="m-four" class="margin-probe"></div>
      <div id="m-two" class="margin-probe"></div>
      <div id="m-three" class="margin-probe"></div>
      <div id="m-override" class="margin-probe" style="margin-left: 4%"></div>
      <div id="m-invalid-auto" class="margin-probe"></div>
    </div>
    <div id="variables">
      <div id="m-var" class="margin-probe"></div>
      <div id="m-var-negative" class="margin-probe"></div>
      <div id="p-var"></div>
      <div id="p-var-negative"></div>
    </div>
    <div id="logical-ltr"><div id="m-logical-ltr" class="logical-probe"></div></div>
    <div id="logical-rtl"><div id="m-logical-rtl" class="logical-probe"></div></div>
    <div id="p-logical-ltr"><div id="p-logical-ltr-child" class="logical-padding"></div></div>
    <div id="p-logical-rtl"><div id="p-logical-rtl-child" class="logical-padding"></div></div>
    <div id="padding-cb" class="padding-cb">
      <div id="p-physical"></div>
      <div id="p-zero"></div>
      <div id="p-fraction"></div>
      <div id="p-over100"></div>
      <div id="p-invalid-negative"></div>
      <div id="p-four"></div>
    </div>
    <div id="box-cb" class="boxed-cb">
      <div id="m-box-basis" class="box-probe"></div>
      <div id="p-box-basis" class="box-probe"></div>
    </div>
    <div id="g-row" class="gap-cb"><div id="g-row-a" class="gap-child"></div><div id="g-row-b" class="gap-child"></div></div>
    <div id="g-column" class="gap-cb"><div id="g-column-a" class="gap-child"></div><div id="g-column-b" class="gap-child"></div></div>
    <div id="g-shorthand" class="gap-cb" style="column-gap: 5%"><div id="g-shorthand-a" class="gap-child"></div><div id="g-shorthand-b" class="gap-child"></div></div>
    <div id="g-one-value" class="gap-cb"><div id="g-one-value-a" class="gap-child"></div><div id="g-one-value-b" class="gap-child"></div></div>
    <div id="g-zero" class="gap-cb"><div id="g-zero-a" class="gap-child"></div><div id="g-zero-b" class="gap-child"></div></div>
    <div id="g-over100" class="gap-cb"><div id="g-over100-a" class="gap-child"></div><div id="g-over100-b" class="gap-child"></div></div>
    <div id="g-negative" class="gap-cb"><div id="g-negative-a" class="gap-child"></div><div id="g-negative-b" class="gap-child"></div></div>
    <div id="g-normal" class="gap-cb"><div id="g-normal-a" class="gap-child"></div><div id="g-normal-b" class="gap-child"></div></div>
    <div id="g-var" class="gap-cb"><div id="g-var-a" class="gap-child"></div><div id="g-var-b" class="gap-child"></div></div>
    <div id="g-var-negative" class="gap-cb"><div id="g-var-negative-a" class="gap-child"></div><div id="g-var-negative-b" class="gap-child"></div></div>
    <div id="g-auto-column"><div id="g-auto-column-a" class="gap-child"></div><div id="g-auto-column-b" class="gap-child"></div></div>
    <div id="g-auto-width-row"><div id="g-auto-width-row-a" class="gap-child"></div><div id="g-auto-width-row-b" class="gap-child"></div></div>
    <div id="g-stretch-parent"><div id="g-stretched-column"><div id="g-stretched-column-a" class="gap-child"></div><div id="g-stretched-column-b" class="gap-child"></div></div></div>
    <div id="g-auto-row-inline"><div id="g-auto-row-inline-a" class="gap-child"></div><div id="g-auto-row-inline-b" class="gap-child"></div></div>
  </div>
</body>
</html>
