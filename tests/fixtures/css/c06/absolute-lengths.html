<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spinon C06.3 absolute length units oracle</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    #root { display: flex; flex-direction: column; width: 300px; height: 100px; row-gap: 2px; }
    .probe { display: flex; flex: 0 0 8px; flex-direction: row; width: 280px; height: 8px; }
    .measure { flex: 0 0 auto; }
    .basis { flex: 0 0 48px; }
    #probe-px { margin-left: 6px; padding-left: 3px; column-gap: 3px; }
    #probe-negative { margin-left: -4.5pt; padding-left: 8px; column-gap: 0; }
    #probe-variable { margin-left: 6px; padding-left: 3px; column-gap: 3px; }
    #probe-in { margin-left: 0.0625in; padding-left: 0.03125in; column-gap: 0.03125in; }
    #probe-cm { margin-left: 0.15875cm; padding-left: 0.079375cm; column-gap: 0.079375cm; }
    #probe-mm { margin-left: 1.5875mm; padding-left: 0.79375mm; column-gap: 0.79375mm; }
    #probe-q { margin-left: 6.35Q; padding-left: 3.175Q; column-gap: 3.175Q; }
    #probe-pt { margin-left: 4.5pt; padding-left: 2.25pt; column-gap: 2.25pt; }
    #probe-pc { margin-left: 0.375pc; padding-left: 0.1875pc; column-gap: 0.1875pc; }
    #px-a { width: 96px; height: 6px; background-color: #3366ff; }
    #px-b { flex-basis: 48px; height: 6px; background-color: #22aa66; }
    #negative-a { width: 1in; height: 6px; background-color: #ff9933; }
    #variable-a { --physical-length: 2.54cm; width: var(--physical-length); height: 6px; background-color: #cc55aa; }
    #in-a { width: 1in; height: 0.0625in; background-color: #3366ff; }
    #in-b { flex-basis: 0.5in; height: 0.0625in; background-color: #22aa66; }
    #cm-a { width: 2.54cm; height: 0.15875cm; background-color: #3366ff; }
    #cm-b { flex-basis: 1.27cm; height: 0.15875cm; background-color: #22aa66; }
    #mm-a { width: 25.4mm; height: 1.5875mm; background-color: #3366ff; }
    #mm-b { flex-basis: 12.7mm; height: 1.5875mm; background-color: #22aa66; }
    #q-a { width: 101.6Q; height: 6.35Q; background-color: #3366ff; }
    #q-b { flex-basis: 50.8Q; height: 6.35Q; background-color: #22aa66; }
    #pt-a { width: 72pt; height: 4.5pt; background-color: #3366ff; }
    #pt-b { flex-basis: 36pt; height: 4.5pt; background-color: #22aa66; }
    #pc-a { width: 6pc; height: 0.375pc; background-color: #3366ff; }
    #pc-b { flex-basis: 3pc; height: 0.375pc; background-color: #22aa66; }
  </style>
</head>
<body>
  <div id="root">
    <div id="probe-px" class="probe"><div id="px-a" class="measure"></div><div id="px-b" class="basis"></div></div>
    <div id="probe-negative" class="probe"><div id="negative-a" class="measure"></div></div>
    <div id="probe-variable" class="probe"><div id="variable-a" class="measure"></div></div>
    <div id="probe-in" class="probe"><div id="in-a" class="measure"></div><div id="in-b" class="basis"></div></div>
    <div id="probe-cm" class="probe"><div id="cm-a" class="measure"></div><div id="cm-b" class="basis"></div></div>
    <div id="probe-mm" class="probe"><div id="mm-a" class="measure"></div><div id="mm-b" class="basis"></div></div>
    <div id="probe-q" class="probe"><div id="q-a" class="measure"></div><div id="q-b" class="basis"></div></div>
    <div id="probe-pt" class="probe"><div id="pt-a" class="measure"></div><div id="pt-b" class="basis"></div></div>
    <div id="probe-pc" class="probe"><div id="pc-a" class="measure"></div><div id="pc-b" class="basis"></div></div>
  </div>
</body>
</html>
