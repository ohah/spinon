<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>C18.2 PNG alpha source-over 픽셀 기준</title>
    <style>
      html, body { width: 80px; height: 40px; margin: 0; padding: 0; background: #112233; }
      #root { position: relative; width: 80px; height: 40px; background: #112233; }
      #alpha-image { position: absolute; left: 8px; top: 12px; display: block; }
    </style>
  </head>
  <body>
    <div id="root"><img id="alpha-image" src="../../resources/c18-2-alpha-source-over.png"></div>
    <script>
      window.read_c18_2_oracle = () => {
        const image = document.getElementById('alpha-image');
        const rect = image.getBoundingClientRect();
        return {
          browser: navigator.userAgent,
          viewport: { width: innerWidth, height: innerHeight, dpr: devicePixelRatio },
          image: {
            loaded: image.complete && image.naturalWidth > 0,
            natural: { width: image.naturalWidth, height: image.naturalHeight },
            frame: { x: rect.x, y: rect.y, width: rect.width, height: rect.height },
            background: getComputedStyle(document.getElementById('root')).backgroundColor,
          },
        };
      };
    </script>
  </body>
</html>
