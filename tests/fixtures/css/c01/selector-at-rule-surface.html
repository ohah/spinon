<!doctype html>
<html lang="ko" data-c01-node="document-root">
  <head data-c01-node="head">

    <meta name="viewport" content="width=device-width, initial-scale=1" data-c01-node="meta-viewport">
    <title data-c01-node="title">C01.4 Chromium CSS oracle fixture</title>
  </head>
  <body data-c01-node="body">
    <main class="container" data-c01-node="main">
      <h2 data-c01-node="heading">인접 형제 기준</h2>

        <span class="fallback" lang="en" data-c01-node="nested-fallback">대체 선택자</span>

      <label data-c01-node="checked-label">
        <input class="checked" type="checkbox" checked data-c01-node="checked-input">
        checked pseudo-class 기준
      </label>
    </main>
