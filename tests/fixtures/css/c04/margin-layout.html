<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Spinon C04 margin layout reference</title>
  </head>
  <body>
    <main id="fixture-root">
      <div id="flex-parent">
        <div id="flex-a"></div>
        <div id="flex-b"></div>
        <div id="flex-c"></div>
      </div>
    </main>
    <pre id="reference-result"></pre>
    <script>
      const fixture = globalThis.__SPINON_C04_MARGIN_LAYOUT__;
      const caseId = new URLSearchParams(location.search).get('case');
      const selected = fixture?.cases.find((item) => item.id === caseId);
      if (!fixture || !selected) throw new Error('고정된 C04 margin case를 찾지 못했습니다.');

      const style = document.createElement('style');
      style.textContent = `${fixture.baseCss}\n${selected.overrideCss}`;
      document.head.append(style);

      const parent = document.querySelector('#flex-parent');
      const parentRect = parent.getBoundingClientRect();
      const children = [...parent.children];
      const properties = ['margin-top', 'margin-right', 'margin-bottom', 'margin-left'];
      const result = {
        caseId,
        computed: Object.fromEntries(properties.map((property) => [property, getComputedStyle(parent).getPropertyValue(property)])),
        itemStyles: children.map((element) => {
          const css = getComputedStyle(element);
          return {
            id: element.id,
            display: css.display,
            margins: Object.fromEntries(properties.map((property) => [property, css.getPropertyValue(property)])),
          };
        }),
        frames: [parent, ...children].map((element) => {
          const rect = element.getBoundingClientRect();
          return {
            id: element.id,
            x: rect.left - parentRect.left,
            y: rect.top - parentRect.top,
            width: rect.width,
            height: rect.height,
          };
        }),
      };
      document.querySelector('#reference-result').textContent = btoa(unescape(encodeURIComponent(JSON.stringify(result))));
    </script>
  </body>
</html>
