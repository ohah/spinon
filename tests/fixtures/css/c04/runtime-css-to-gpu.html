<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=301, initial-scale=1">
  <title>Spinon C04 runtime CSS to GPU oracle</title>
  <style>html, body { margin: 0; }</style>
</head>
<body>
  <div id="root" style="display:flex;box-sizing:border-box;width:301px;height:100px;flex-direction:row;align-items:flex-start;justify-content:flex-start;column-gap:11px;background-color:#123456">
    <div id="opaque" style="display:block;box-sizing:border-box;width:51px;height:31px;background-color:#3366ff"></div>
    <div id="transparent" style="display:block;box-sizing:border-box;width:41px;height:31px"></div>
    <div id="hidden" style="display:none;width:23px;height:17px;background-color:#ff0000"></div>
  </div>
  <pre id="reference-result" hidden></pre>
  <script>
    (() => {
      const inventory = window.__SPINON_C04_RUNTIME_GPU_INVENTORY__;
      if (inventory?.schema !== "spinon-css-runtime-gpu-inventory/v1"
        || inventory.fixtureId !== "C04-runtime-css-to-gpu-v1") {
        throw new Error("C04 runtime CSS to GPU inventory가 없거나 fixture와 다릅니다.");
      }
      const nodes = inventory.nodes.map(({ id, properties }) => {
        const element = document.getElementById(id);
        if (!element) throw new Error(`fixture node를 찾지 못했습니다: ${id}`);
        const style = getComputedStyle(element);
        const rect = element.getBoundingClientRect();
        return {
          id,
          properties: Object.fromEntries(properties.map((property) => [property, style.getPropertyValue(property).trim()])),
          rect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height },
        };
      });
      const observation = {
        fixtureId: inventory.fixtureId,
        viewport: { width: innerWidth, height: innerHeight, deviceScaleFactor: devicePixelRatio },
        environment: {
          locale: navigator.language,
          intlLocale: Intl.DateTimeFormat().resolvedOptions().locale,
          timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
          dark: matchMedia("(prefers-color-scheme: dark)").matches,
          coarsePointer: matchMedia("(pointer: coarse)").matches,
          hover: matchMedia("(hover: hover)").matches,
        },
        nodes,
      };
      const bytes = new TextEncoder().encode(JSON.stringify(observation));
      let binary = "";
      for (const byte of bytes) binary += String.fromCharCode(byte);
      document.querySelector("#reference-result").textContent = btoa(binary);
    })();
  </script>
</body>
</html>
