<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Repeated intrinsic implicit-row track list</title>
    <style>
      :root {
        color-scheme: light;
        font-family: sans-serif;
        font-size: 12px;
        line-height: 14px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      main {
        display: grid;
        grid-template-columns: 120px 120px;
        gap: 24px 32px;
        padding: 16px;
      }

      section {
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: flex-start;
      }

      .grid {
        display: grid;
        width: 40px;
        height: 100px;
        grid-template-columns: 40px;
        grid-template-rows: 10px;
        grid-auto-rows: fit-content(20px) min-content max-content auto min-content max-content;
        grid-auto-flow: row;
        row-gap: 0;
        column-gap: 0;
        align-content: start;
        align-items: normal;
        justify-content: start;
        justify-items: normal;
        overflow: visible;
        margin: 0;
        padding: 0;
        border: 0;
      }

      .item {
        display: block;
        width: auto;
        height: auto;
        min-height: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }

      .explicit {
        height: 10px;
        background: #234e70;
      }

      .payload {
        display: block;
        width: 40px;
        margin: 0;
        padding: 0;
        border: 0;
        background: #f2b134;
      }

      .payload[data-index="1"] { background: #f2b134; }
      .payload[data-index="2"] { background: #4a90a4; }
      .payload[data-index="3"] { background: #d1495b; }
      .payload[data-index="4"] { background: #6a994e; }
      .payload[data-index="5"] { background: #9b5de5; }
      .payload[data-index="6"] { background: #f15bb5; }
      .payload[data-index="7"] { background: #ff8c42; }
      .payload[data-index="8"] { background: #00a896; }

      [data-align="stretch"] {
        align-content: stretch;
      }
    </style>
  </head>
  <body>
    <main>
      <section data-scene="px-start" data-cap="20px" data-align="start">
        <div>px / start</div>
        <div class="grid">
          <div class="item explicit" data-item="0"></div>
          <div class="item" data-item="1"><div class="payload" data-index="1" style="height: 20px"></div></div>
          <div class="item" data-item="2"><div class="payload" data-index="2" style="height: 10px"></div></div>
          <div class="item" data-item="3"><div class="payload" data-index="3" style="height: 12px"></div></div>
          <div class="item" data-item="4"><div class="payload" data-index="4" style="height: 6px"></div></div>
          <div class="item" data-item="5"><div class="payload" data-index="5" style="height: 6px"></div></div>
          <div class="item" data-item="6"><div class="payload" data-index="6" style="height: 6px"></div></div>
          <div class="item" data-item="7"><div class="payload" data-index="7" style="height: 60px"></div></div>
          <div class="item" data-item="8"><div class="payload" data-index="8" style="height: 6px"></div></div>
        </div>
      </section>
      <section data-scene="percent-start" data-cap="20%" data-align="start">
        <div>% / start</div>
        <div class="grid" style="grid-auto-rows: fit-content(20%) min-content max-content auto min-content max-content">
          <div class="item explicit" data-item="0"></div>
          <div class="item" data-item="1"><div class="payload" data-index="1" style="height: 20px"></div></div>
          <div class="item" data-item="2"><div class="payload" data-index="2" style="height: 10px"></div></div>
          <div class="item" data-item="3"><div class="payload" data-index="3" style="height: 12px"></div></div>
          <div class="item" data-item="4"><div class="payload" data-index="4" style="height: 6px"></div></div>
          <div class="item" data-item="5"><div class="payload" data-index="5" style="height: 6px"></div></div>
          <div class="item" data-item="6"><div class="payload" data-index="6" style="height: 6px"></div></div>
          <div class="item" data-item="7"><div class="payload" data-index="7" style="height: 60px"></div></div>
          <div class="item" data-item="8"><div class="payload" data-index="8" style="height: 6px"></div></div>
        </div>
      </section>
      <section data-scene="px-stretch" data-cap="20px" data-align="stretch">
        <div>px / stretch</div>
        <div class="grid" style="align-content: stretch">
          <div class="item explicit" data-item="0"></div>
          <div class="item" data-item="1"><div class="payload" data-index="1" style="height: 20px"></div></div>
          <div class="item" data-item="2"><div class="payload" data-index="2" style="height: 10px"></div></div>
          <div class="item" data-item="3"><div class="payload" data-index="3" style="height: 12px"></div></div>
          <div class="item" data-item="4"><div class="payload" data-index="4" style="height: 6px"></div></div>
          <div class="item" data-item="5"><div class="payload" data-index="5" style="height: 6px"></div></div>
          <div class="item" data-item="6"><div class="payload" data-index="6" style="height: 6px"></div></div>
          <div class="item" data-item="7"><div class="payload" data-index="7" style="height: 60px"></div></div>
          <div class="item" data-item="8"><div class="payload" data-index="8" style="height: 6px"></div></div>
        </div>
      </section>
      <section data-scene="percent-stretch" data-cap="20%" data-align="stretch">
        <div>% / stretch</div>
        <div class="grid" style="grid-auto-rows: fit-content(20%) min-content max-content auto min-content max-content; align-content: stretch">
          <div class="item explicit" data-item="0"></div>
          <div class="item" data-item="1"><div class="payload" data-index="1" style="height: 20px"></div></div>
          <div class="item" data-item="2"><div class="payload" data-index="2" style="height: 10px"></div></div>
          <div class="item" data-item="3"><div class="payload" data-index="3" style="height: 12px"></div></div>
          <div class="item" data-item="4"><div class="payload" data-index="4" style="height: 6px"></div></div>
          <div class="item" data-item="5"><div class="payload" data-index="5" style="height: 6px"></div></div>
          <div class="item" data-item="6"><div class="payload" data-index="6" style="height: 6px"></div></div>
          <div class="item" data-item="7"><div class="payload" data-index="7" style="height: 60px"></div></div>
          <div class="item" data-item="8"><div class="payload" data-index="8" style="height: 6px"></div></div>
        </div>
      </section>
    </main>
    <script>
      window.__gridObservation = () =>
        Array.from(document.querySelectorAll("[data-scene]")).map((scene) => {
          const grid = scene.querySelector(".grid");
          const rect = (element) => {
            const box = element.getBoundingClientRect();
            return {
              x: box.x,
              y: box.y,
              width: box.width,
              height: box.height,
              right: box.right,
              bottom: box.bottom,
            };
          };
          return {
            id: scene.dataset.scene,
            cap: scene.dataset.cap,
            alignContent: getComputedStyle(grid).alignContent,
            gridAutoRows: getComputedStyle(grid).gridAutoRows,
            gridTemplateRows: getComputedStyle(grid).gridTemplateRows,
            grid: rect(grid),
            items: Array.from(grid.querySelectorAll("[data-item]")).map((item) => ({
              index: Number(item.dataset.item),
              rect: rect(item),
              payload: item.querySelector(".payload")?.getAttribute("style") ?? null,
              payloadRect: item.querySelector(".payload") ? rect(item.querySelector(".payload")) : null,
            })),
          };
        });
    </script>
  </body>
</html>
