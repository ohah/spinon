<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>C11.4 §11.8 normal auto-track stretch</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000000;
        font-family: sans-serif;
      }

      body {
        padding: 0;
      }

      #grid {
        box-sizing: border-box;
        display: grid;
        width: 160px;
        height: 100px;
        margin: 0;
        padding: 0;
        border: 0;
        grid-template-columns: 160px;
        grid-template-rows: auto auto 5px;
        grid-auto-flow: row;
        column-gap: 0;
        row-gap: 10px;
        align-content: normal;
        justify-content: start;
        background: #101820;
      }

      #item-0,
      #item-1,
      #item-2 {
        box-sizing: border-box;
        width: 160px;
        margin: 0;
        padding: 0;
        border: 0;
      }

      #item-0 {
        height: 10px;
        background: #e5484d;
      }

      #item-1 {
        height: 20px;
        background: #3a86ff;
      }

      #item-2 {
        height: 5px;
        background: #06d6a0;
      }
    </style>
  </head>
  <body>
    <main id="grid">
      <div id="item-0"></div>
      <div id="item-1"></div>
      <div id="item-2"></div>
    </main>
    <script>
      window.c114NormalAutoTrackObservation = () => {
        const grid = document.querySelector('#grid');
        const rect = (element) => {
          const value = element.getBoundingClientRect();
          return {
            x: value.x,
            y: value.y,
            width: value.width,
            height: value.height,
          };
        };
        return {
          alignContent: getComputedStyle(grid).alignContent,
          justifyContent: getComputedStyle(grid).justifyContent,
          gridTemplateRows: getComputedStyle(grid).gridTemplateRows,
          root: rect(grid),
          children: [...grid.children].map(rect),
        };
      };
    </script>
  </body>
</html>
