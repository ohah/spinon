<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C11.4 row-axis cyclic auto-repeat generalization precomparison</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      color: #101820;
      background: #f4f6f8;
      font: 14px/1.4 system-ui, sans-serif;
    }
    main {
      display: flex;
      align-items: flex-start;
      gap: 32px;
      flex-wrap: wrap;
    }
    figure { margin: 0; }
    figcaption { margin-bottom: 8px; font-weight: 600; }
    .grid {
      position: relative;
      display: grid;
      width: 24px;
      box-sizing: content-box;
      grid-template-columns: 24px;
      column-gap: 0;
      row-gap: 2px;
      margin: 0;
      padding: 0;
      border: 0;
      align-content: start;
      justify-content: start;
      background: #b9d8e8;
    }
    .max-content { height: max-content; }
    .definite { height: 44px; }
    .item {
      grid-column: 1;
      grid-row: 2;
      width: 24px;
      height: 24px;
      min-width: 0;
      min-height: 0;
      margin: 0;
      padding: 0;
      border: 0;
      background: #e5484d;
    }
    .prefix-item {
      grid-column: 1;
      grid-row: 1;
      width: 24px;
      height: 8px;
      min-width: 0;
      min-height: 0;
      margin: 0;
      padding: 0;
      border: 0;
      background: #2f9e44;
    }
    .item-secondary {
      grid-column: 1;
      grid-row: 2;
      width: 16px;
      height: 16px;
      min-width: 0;
      min-height: 0;
      margin: 0;
      padding: 0;
      border: 0;
      background: #f08c00;
    }
    .candidate-boundary {
      position: absolute;
      z-index: 1;
      inset-inline: 0;
      top: 21px;
      height: 1px;
      background: #173f8a;
      pointer-events: none;
    }
    .suffix-boundary {
      display: block;
      width: 24px;
      height: 1px;
      min-width: 0;
      min-height: 0;
      margin: 0;
      padding: 0;
      border: 0;
      background: #7048e8;
    }
    .note { margin-top: 8px; max-width: 260px; }
  </style>
</head>
<body>
  <main>
    <figure>
      <figcaption>max-content / auto-fill</figcaption>
      <div id="cyclic-fill" class="grid max-content" data-scene-id="cyclic-max-content-auto-fill-prefix-suffix"
           style="grid-template-rows: 8px repeat(auto-fill, minmax(0px, 25%)) 8px">
        <div id="cyclic-fill-prefix-item" class="prefix-item"></div>
        <div id="cyclic-fill-item" class="item"></div>
        <div id="cyclic-fill-item-secondary" class="item-secondary"></div>
        <span class="candidate-boundary" aria-hidden="true"></span>
        <span class="suffix-boundary" style="grid-row:3;grid-column:1" aria-hidden="true"></span>
      </div>
      <div class="note">Two items overlap in the repeated row; the blue browser-only suffix item marks the fixed suffix start.</div>
    </figure>
    <figure>
      <figcaption>max-content / auto-fit</figcaption>
      <div id="cyclic-fit" class="grid max-content" data-scene-id="cyclic-max-content-auto-fit-prefix-suffix"
           style="grid-template-rows: 8px repeat(auto-fit, minmax(0px, 25%)) 8px">
        <div id="cyclic-fit-prefix-item" class="prefix-item"></div>
        <div id="cyclic-fit-item" class="item"></div>
        <div id="cyclic-fit-item-secondary" class="item-secondary"></div>
        <span class="candidate-boundary" aria-hidden="true"></span>
        <span class="suffix-boundary" style="grid-row:3;grid-column:1" aria-hidden="true"></span>
      </div>
      <div class="note">The repeated row is occupied; the blue browser-only item marks the fixed suffix start.</div>
    </figure>
    <figure>
      <figcaption>44px definite / auto-fill control</figcaption>
      <div id="control-fill" class="grid definite" data-scene-id="definite-44px-auto-fill-prefix-suffix-control"
           style="grid-template-rows: 8px repeat(auto-fill, minmax(0px, 25%)) 8px">
        <div id="control-fill-prefix-item" class="prefix-item"></div>
        <div id="control-fill-item" class="item"></div>
        <div id="control-fill-item-secondary" class="item-secondary"></div>
        <span class="candidate-boundary" aria-hidden="true"></span>
        <span class="suffix-boundary" style="grid-row:4;grid-column:1" aria-hidden="true"></span>
      </div>
      <div class="note">The definite basis fits two 11px repeated rows; blue marks the fixed suffix start.</div>
    </figure>
    <figure>
      <figcaption>44px definite / auto-fit control</figcaption>
      <div id="control-fit" class="grid definite" data-scene-id="definite-44px-auto-fit-prefix-suffix-control"
           style="grid-template-rows: 8px repeat(auto-fit, minmax(0px, 25%)) 8px">
        <div id="control-fit-prefix-item" class="prefix-item"></div>
        <div id="control-fit-item" class="item"></div>
        <div id="control-fit-item-secondary" class="item-secondary"></div>
        <span class="candidate-boundary" aria-hidden="true"></span>
        <span class="suffix-boundary" style="grid-row:4;grid-column:1" aria-hidden="true"></span>
      </div>
      <div class="note">The empty second repeated row collapses; blue marks the fixed suffix start.</div>
    </figure>
  </main>
  <script>
    const ids = ['cyclic-fill', 'cyclic-fit', 'control-fill', 'control-fit'];
    window.c114Observation = ids.map((id) => {
      const root = document.getElementById(id);
      const item = root.querySelector('.item');
      const prefixItem = root.querySelector('.prefix-item');
      const secondaryItem = root.querySelector('.item-secondary');
      const marker = root.querySelector('.candidate-boundary');
      const suffixBoundary = root.querySelector('.suffix-boundary');
      const style = getComputedStyle(root);
      const rect = (element) => {
        const { x, y, width, height, top, right, bottom, left } = element.getBoundingClientRect();
        return { x, y, width, height, top, right, bottom, left };
      };
      return {
        id,
        sceneId: root.dataset.sceneId,
        authoredRows: root.style.gridTemplateRows,
        computed: {
          width: style.width,
          height: style.height,
          boxSizing: style.boxSizing,
          gridTemplateColumns: style.gridTemplateColumns,
          gridTemplateRows: style.gridTemplateRows,
          rowGap: style.rowGap,
          minHeight: style.minHeight,
          maxHeight: style.maxHeight,
        },
        rootRect: rect(root),
        prefixItemRect: rect(prefixItem),
        itemRect: rect(item),
        secondaryItemRect: rect(secondaryItem),
        candidateBoundaryRect: rect(marker),
        suffixBoundaryRect: rect(suffixBoundary),
        directInFlowChildCount: Array.from(root.children).filter((child) => getComputedStyle(child).position === 'static').length,
        runtimeSizedChildCount: Array.from(root.children).filter((child) => getComputedStyle(child).position === 'static' && !child.classList.contains('suffix-boundary')).length,
      };
    });
  </script>
</body>
</html>
