<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>C11.1 Root HTML column-flow implicit-boundary control</title>
  </head>
  <body style="margin:0;padding:0">
    <div id="implicit-boundary-control" style="display:grid;width:160px;height:90px;grid-template-columns:40px 40px 40px 40px;grid-template-rows:30px 30px 30px;grid-auto-flow:column;grid-auto-rows:auto;grid-auto-columns:auto;gap:0;margin:0;padding:0">
      <div id="implicit-boundary-control--row-four" style="width:40px;height:30px;margin:0;grid-row:4;grid-column:auto;background-color:#f97316"></div>
      <div id="implicit-boundary-control--column-five" style="width:40px;height:30px;margin:0;grid-row:auto;grid-column:5;background-color:#3578c7"></div>
    </div>
  </body>
</html>
