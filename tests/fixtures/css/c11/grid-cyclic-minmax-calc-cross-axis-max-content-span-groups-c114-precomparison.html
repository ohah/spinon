<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C11.4 max-content mixed cross-axis span groups oracle</title>
<style>
@font-face {
  font-family: Ahem;
  src: url("../../resources/c15/Ahem.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
}
* { box-sizing: border-box; }
body { margin: 24px; color: #111; font: 14px/1.4 sans-serif; }
.scene { margin: 20px 0 32px; }
.grid {
  box-sizing: content-box;
  display: grid;
  height: max-content;
  margin: 0;
  padding: 0;
  border: 2px solid #f0c674;
  column-gap: 2px;
  row-gap: 2px;
  align-content: start;
  justify-content: start;
  grid-template-columns: minmax(calc(10% + 2px), max-content) minmax(calc(10% + 2px), max-content) minmax(calc(10% + 2px), max-content);
  grid-template-rows: minmax(calc(10% + 2px), max-content) minmax(calc(10% + 2px), max-content);
  background: #101820;
  font-family: Ahem;
  font-size: 10px;
  font-weight: 400;
  line-height: 10px;
  white-space: normal;
  color: #e5484d;
}
.item {
  box-sizing: border-box;
  display: block;
  min-width: auto;
  min-height: auto;
  margin: 0;
  padding: 0;
  border: 0;
  font: 400 10px/10px Ahem;
  white-space: normal;
  word-break: normal;
  overflow-wrap: normal;
  color: #e5484d;
  background: #e5484d;
}
</style>
<main id="results"></main>
<script>
(() => {
  const definitions = [
    { id: "max-content-forward", width: "max-content", order: ["a", "b", "c"] },
    { id: "max-content-reverse", width: "max-content", order: ["c", "b", "a"] },
    { id: "definite-forward", width: "80px", order: ["a", "b", "c"] },
    { id: "definite-reverse", width: "80px", order: ["c", "b", "a"] },
  ];
  const items = {
    a: { text: "AA A A", placement: "grid-column:1 / 3;grid-row:1 / 3", width: "auto", height: "auto" },
    b: { text: "XXXX", placement: "grid-column:2 / 4;grid-row:1 / 3", width: "40px", height: "10px" },
    c: { text: "AA AA AA AA", placement: "grid-column:1 / 4;grid-row:1 / 3", width: "auto", height: "auto" },
  };
  const main = document.querySelector("#results");
  for (const definition of definitions) {
    const scene = document.createElement("section");
    scene.className = "scene";
    scene.id = definition.id;
    scene.dataset.width = definition.width;
    const title = document.createElement("h2");
    title.textContent = definition.id;
    scene.append(title);
    const root = document.createElement("div");
    root.className = "grid";
    root.id = `grid-${definition.id}`;
    root.style.width = definition.width;
    scene.append(root);
    for (const key of definition.order) {
      const item = items[key];
      const node = document.createElement("div");
      node.className = "item";
      node.id = `item-${key}-${definition.id}`;
      node.dataset.item = key;
      node.style.cssText = `width:${item.width};height:${item.height};${item.placement}`;
      node.append(document.createTextNode(item.text));
      root.append(node);
    }
    main.append(scene);
  }
  document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = "true"; });
})();
</script>
</html>
