<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Root HTML Grid intrinsic sizing of ASCII hyphenated words</title>
    <style>
      html, body { margin: 0; padding: 0; }
      body { background: #20242a; color: #f5f7fa; font: 12px/16px sans-serif; }
      #cases { display: grid; grid-template-columns: repeat(2, 220px); gap: 12px; }
      .case { box-sizing: border-box; width: 220px; min-height: 92px; padding: 6px; background: #303741; }
      .case-title { margin: 0 0 4px; }
      .grid {
        box-sizing: border-box;
        display: grid;
        width: 40px;
        height: 80px;
        margin: 0;
        padding: 0;
        overflow: visible;
        background: #39434f;
        grid-template-rows: 10px;
        grid-auto-flow: row;
        grid-auto-rows: min-content;
        gap: 0;
        align-content: start;
        justify-content: start;
      }
      .grid[data-columns="min-content"] { grid-template-columns: min-content; }
      .grid[data-columns="max-content"] { grid-template-columns: max-content; }
      .grid[data-columns="auto"] { grid-template-columns: auto; }
      .grid[data-columns="fixed"] { grid-template-columns: 20px; }
      .item { box-sizing: border-box; width: 1px; margin: 0; padding: 0; }
      .first { height: 10px; background: #f2665e; }
      .word-text {
        width: auto;
        height: auto;
        min-height: auto;
        font-family: monospace;
        font-size: 10px;
        line-height: 10px;
        word-break: normal;
        overflow-wrap: normal;
        white-space: normal;
        background: #5ba8f5;
      }
      .short-text {
        width: auto;
        height: auto;
        min-height: auto;
        font-family: monospace;
        font-size: 10px;
        line-height: 10px;
        word-break: normal;
        overflow-wrap: normal;
        white-space: normal;
        background: #f2bd57;
      }
      .last { height: 10px; background: #55c791; }
    </style>
  </head>
  <body>
    <main id="cases">
      <section class="case" data-case="hyphen-min-content">
        <p class="case-title">min-content / A-A</p>
        <div class="grid" data-columns="min-content">
          <div class="item first"></div>
          <div class="item word-text">A-A</div>
          <div class="item short-text">A</div>
          <div class="item last"></div>
        </div>
      </section>
      <section class="case" data-case="hyphen-max-content">
        <p class="case-title">max-content / A-A</p>
        <div class="grid" data-columns="max-content">
          <div class="item first"></div>
          <div class="item word-text">A-A</div>
          <div class="item short-text">A</div>
          <div class="item last"></div>
        </div>
      </section>
      <section class="case" data-case="hyphen-auto-mixed-tokens">
        <p class="case-title">auto / AA-BB CC</p>
        <div class="grid" data-columns="auto">
          <div class="item first"></div>
          <div class="item word-text">AA-BB CC</div>
          <div class="item short-text">A</div>
          <div class="item last"></div>
        </div>
      </section>
      <section class="case" data-case="digit-hyphen-min-content">
        <p class="case-title">min-content / 12-3 45</p>
        <div class="grid" data-columns="min-content">
          <div class="item first"></div>
          <div class="item word-text">12-3 45</div>
          <div class="item short-text">A</div>
          <div class="item last"></div>
        </div>
      </section>
      <section class="case" data-case="mixed-hyphen-min-content">
        <p class="case-title">min-content / A1-BB2</p>
        <div class="grid" data-columns="min-content">
          <div class="item first"></div>
          <div class="item word-text">A1-BB2</div>
          <div class="item short-text">A</div>
          <div class="item last"></div>
        </div>
      </section>
      <section class="case" data-case="multiple-hyphenated-tokens">
        <p class="case-title">min-content / A-B C-DE</p>
        <div class="grid" data-columns="min-content">
          <div class="item first"></div>
          <div class="item word-text">A-B C-DE</div>
          <div class="item short-text">A</div>
          <div class="item last"></div>
        </div>
      </section>
      <section class="case" data-case="hyphenated-reverse-order">
        <p class="case-title">min-content / reverse item order</p>
        <div class="grid" data-columns="min-content">
          <div class="item first"></div>
          <div class="item short-text">A</div>
          <div class="item word-text">AA-BB CC</div>
          <div class="item last"></div>
        </div>
      </section>
      <section class="case" data-case="hyphen-unbreakable-auto">
        <p class="case-title">auto / 12345678-12</p>
        <div class="grid" data-columns="auto">
          <div class="item first"></div>
          <div class="item word-text">12345678-12</div>
          <div class="item short-text">A</div>
          <div class="item last"></div>
        </div>
      </section>
      <section class="case" data-case="fixed-track-hyphen-break">
        <p class="case-title">fixed 20px / AA-BB CC</p>
        <div class="grid" data-columns="fixed">
          <div class="item first"></div>
          <div class="item word-text">AA-BB CC</div>
          <div class="item short-text">A</div>
          <div class="item last"></div>
        </div>
      </section>
    </main>
    <script>
      window.__C11_ROOT_HTML_HYPHEN_PRECOMPARISON__ = (() => {
        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");
        context.font = "10px monospace";
        return [...document.querySelectorAll(".case")].map((caseElement) => {
          const grid = caseElement.querySelector(".grid");
          const word = caseElement.querySelector(".word-text");
          const text = word.firstChild;
          const range = document.createRange();
          range.selectNodeContents(text);
          const style = getComputedStyle(grid);
          const tokens = text.data.split(/[ \t\n\r]+/).filter(Boolean);
          const breakSegments = tokens.flatMap((token) => token.match(/[^-]+-?/g) ?? []);
          const measure = (sample) => context.measureText(sample).width;
          const rect = (element) => {
            const box = element.getBoundingClientRect();
            const root = grid.getBoundingClientRect();
            return [box.left - root.left, box.top - root.top, box.width, box.height];
          };
          return {
            id: caseElement.dataset.case,
            text: text.data,
            columnsMode: grid.dataset.columns,
            computedColumns: style.gridTemplateColumns,
            computedRows: style.gridTemplateRows,
            root: [grid.offsetWidth, grid.offsetHeight],
            wordFrame: rect(word),
            lines: [...range.getClientRects()].map((box) => [box.x, box.y, box.width, box.height]),
            metrics: {
              spaceAdvanceCssPx: measure(" "),
              fullTextAdvanceCssPx: measure(text.data),
              tokenAdvancesCssPx: tokens.map((token) => ({ text: token, advanceCssPx: measure(token) })),
              breakSegmentAdvancesCssPx: breakSegments.map((segment) => ({ text: segment, advanceCssPx: measure(segment) })),
            },
          };
        });
      })();
    </script>
  </body>
</html>
