<!doctype html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>
html, body { margin: 0; padding: 0; }
main {
  box-sizing: border-box; display: grid; width: 30px; height: 20px;
  grid-template-columns: minmax(40px, 80px) 10px; grid-template-rows: 20px;
  gap: 0; margin: 0; padding: 0; background-color: #101820;
}
.a { width: 8px; height: 8px; background-color: #e5484d; }
.b { width: 8px; height: 8px; background-color: #3b82f6; }
</style></head><body><main><div class="a"></div><div class="b"></div></main></body></html>
