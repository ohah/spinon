<!doctype html><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:12px sans-serif}.grid{display:grid;width:120px;height:80px;margin:0 0 12px;padding:0;border:0;gap:0;align-content:start;justify-content:start;grid-auto-rows:7px;grid-auto-columns:9px;background:#101820}.item{margin:0;padding:0;border:0;min-width:0;min-height:0;background:#3e63dd}.wide{width:20px}.item.tall{height:20px}

<script>window.report=()=>Object.fromEntries([...document.querySelectorAll('[data-scene]')].map(g=>{const root=g.getBoundingClientRect();return[g.id,{rows:getComputedStyle(g).gridTemplateRows,columns:getComputedStyle(g).gridTemplateColumns,areas:getComputedStyle(g).gridTemplateAreas,root:[root.width,root.height],nodes:[[g.id,0,0,root.width,root.height],...([...g.children].map(e=>{const r=e.getBoundingClientRect();return[e.id,r.x-root.x,r.y-root.y,r.width,r.height]}))]}]}));</script>
