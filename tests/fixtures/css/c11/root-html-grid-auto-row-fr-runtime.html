<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Root HTML fractional implicit row runtime</title>
    <style>
      html,
      body {
        margin: 0;
      }

      #grid {
        display: grid;
        box-sizing: border-box;
        width: 100px;
        height: 100px;
        grid-template-columns: 40px 55px;
        grid-template-rows: 20px;
        grid-auto-rows: 1fr 2fr;
        grid-auto-flow: row;
        column-gap: 5px;
        row-gap: 5px;
        margin: 0;
        padding: 0;
        overflow: visible;
        background-color: #ddd;
      }

      .item {
        display: block;
        height: 10px;
        background-color: #3a8f5b;
      }

      .item:nth-child(2n + 1) {
        width: 40px;
      }

      .item:nth-child(2n) {
        width: 55px;
      }

      #item1 {
        height: 20px;
        background-color: #e5484d;
      }

      #item2 {
        height: 20px;
        background-color: #3b82f6;
      }
    </style>
  </head>
  <body>
    <div id="grid">
      <div id="item1" class="item"></div>
      <div id="item2" class="item"></div>
      <div id="item3" class="item"></div>
      <div id="item4" class="item"></div>
      <div id="item5" class="item"></div>
      <div id="item6" class="item"></div>
      <div id="item7" class="item"></div>
      <div id="item8" class="item"></div>
      <div id="item9" class="item"></div>
      <div id="item10" class="item"></div>
    </div>
  </body>
</html>
