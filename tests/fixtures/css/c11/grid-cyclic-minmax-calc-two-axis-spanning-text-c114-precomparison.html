<!doctype html>
<meta charset="utf-8">
<title>C11.4 cyclic minmax(calc()) two-axis spanning text precomparison</title>
<style>
  @font-face { font-family: Ahem; src: url("../../resources/c15/Ahem.ttf") format("truetype"); font-weight: 400; font-style: normal; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #ffffff; color: #101820; font: 12px/16px sans-serif; }
  main { display: grid; grid-template-columns: repeat(2, 240px); gap: 18px 24px; padding: 12px; align-items: start; }
  h2 { margin: 0 0 4px; font: 12px/16px sans-serif; }
  .grid {
    box-sizing: content-box;
    display: grid;
    height: max-content;
    margin: 0;
    padding: 0;
    border: 2px solid #f0c674;
    column-gap: 2px;
    row-gap: 2px;
    align-content: start;
    justify-content: start;
    grid-template-columns: repeat(2, minmax(calc(10% + 2px), max-content));
    grid-template-rows: repeat(2, minmax(calc(10% + 2px), max-content));
    background: #101820;
    font: 10px/10px Ahem, sans-serif;
    color: #e5484d;
  }
  .min-content { width: min-content; }
  .max-content { width: max-content; }
  .definite-min-content { width: 10px; }
  .definite-max-content { width: 60px; }
  .item {
    box-sizing: border-box;
    width: auto;
    height: auto;
    min-width: auto;
    min-height: auto;
    margin: 0;
    padding: 0;
    border: 0;
    grid-column: 1 / 3;
    grid-row: 1 / 3;
    white-space: normal;
    word-break: break-all;
    overflow-wrap: normal;
    background: #e5484d;
    color: #e5484d;
  }
</style>
<main>
  <section>
    <h2>min-content width · max-content height</h2>
    <div id="min-content-width" class="grid min-content"><div class="item">aaaaaa</div></div>
  </section>
  <section>
    <h2>max-content width · max-content height</h2>
    <div id="max-content-width" class="grid max-content"><div class="item">aaaaaa</div></div>
  </section>
  <section>
    <h2>definite 10px width · max-content height</h2>
    <div id="definite-10px-width" class="grid definite-min-content"><div class="item">aaaaaa</div></div>
  </section>
  <section>
    <h2>definite 60px width · max-content height</h2>
    <div id="definite-60px-width" class="grid definite-max-content"><div class="item">aaaaaa</div></div>
  </section>
</main>
<script>
  document.fonts.ready.then(() => {
    const relativeRect = (element, origin) => {
      const rect = element.getBoundingClientRect();
      return { x: rect.x - origin.x, y: rect.y - origin.y, width: rect.width, height: rect.height };
    };
    window.cyclicMinmaxCalcTwoAxisSpanningTextResults = {
      userAgent: navigator.userAgent,
      viewport: { width: innerWidth, height: innerHeight, dpr: devicePixelRatio },
      font: { status: document.fonts.status, loaded: document.fonts.check("10px Ahem") },
      scenes: Array.from(document.querySelectorAll(".grid"), grid => {
        const root = grid.getBoundingClientRect();
        const style = getComputedStyle(grid);
        const item = grid.firstElementChild;
        const range = document.createRange();
        range.selectNodeContents(item.firstChild);
        return {
          id: grid.id,
          root: { x: root.x, y: root.y, width: root.width, height: root.height },
          content: { width: style.width, height: style.height },
          columns: style.gridTemplateColumns,
          rows: style.gridTemplateRows,
          gaps: { column: style.columnGap, row: style.rowGap },
          item: {
            frame: relativeRect(item, root),
            gridArea: getComputedStyle(item).gridArea,
            text: item.textContent,
            lineRects: Array.from(range.getClientRects(), rect => ({ x: rect.x - root.x, y: rect.y - root.y, width: rect.width, height: rect.height })),
            scrollSize: { width: item.scrollWidth, height: item.scrollHeight },
          },
        };
      }),
    };
  });
</script>
