<!doctype html>
<meta charset="utf-8">
<title>C11.4 two-level nested Grid intrinsic contribution precomparison</title>
<style>
  @font-face { font-family: Ahem; src: url("../../resources/c15/Ahem.ttf") format("truetype"); font-weight: 400; font-style: normal; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 640px; background: #fff; }
  body { font: 10px/1 sans-serif; color: #111; }
  .case { min-height: 72px; border-bottom: 1px solid #ccc; padding: 4px; }
  .label { display: block; margin-bottom: 3px; }
  .grid { display: grid; gap: 0; align-content: start; justify-content: start; }
  .min { width: min-content; grid-template-columns: min-content; }
  .max { width: max-content; grid-template-columns: max-content; }
  .grid-item { margin: 0; padding: 0; border: 0; justify-self: start; align-self: start; }
  .text { font: 10px/10px Ahem, sans-serif; white-space: normal; color: #e5484d; }
  #result { display: none; }
</style>
<body>
  <section class="case" data-case="nested-depth-one-min-content">
    <span class="label">root Grid → one nested Grid, min-content constraint</span>
    <div class="grid root min" id="depth-one-min-root">
      <div class="grid grid-item min" id="depth-one-min-inner">
        <div class="grid-item text" id="depth-one-min-text">XX XXXXXXX</div>
      </div>
    </div>
  </section>
  <section class="case" data-case="nested-depth-two-min-content">
    <span class="label">root Grid → middle Grid → inner Grid, min-content constraint</span>
    <div class="grid root min" id="depth-two-min-root">
      <div class="grid grid-item min" id="depth-two-min-middle">
        <div class="grid grid-item min" id="depth-two-min-inner">
          <div class="grid-item text" id="depth-two-min-text">XX XXXXXXX</div>
        </div>
      </div>
    </div>
  </section>
  <section class="case" data-case="nested-depth-one-max-content">
    <span class="label">root Grid → one nested Grid, max-content constraint</span>
    <div class="grid root max" id="depth-one-max-root">
      <div class="grid grid-item max" id="depth-one-max-inner">
        <div class="grid-item text" id="depth-one-max-text">XX XXXXXXX</div>
      </div>
    </div>
  </section>
  <section class="case" data-case="nested-depth-two-max-content">
    <span class="label">root Grid → middle Grid → inner Grid, max-content constraint</span>
    <div class="grid root max" id="depth-two-max-root">
      <div class="grid grid-item max" id="depth-two-max-middle">
        <div class="grid grid-item max" id="depth-two-max-inner">
          <div class="grid-item text" id="depth-two-max-text">XX XXXXXXX</div>
        </div>
      </div>
    </div>
  </section>
  <pre id="result"></pre>
  <script>
    document.fonts.ready.then(() => {
      const rect = (element) => {
        const value = element.getBoundingClientRect();
        const snap = (number) => Math.round(number * 64) / 64;
        return {x:snap(value.x), y:snap(value.y), width:snap(value.width), height:snap(value.height)};
      };
      const probe = (width) => {
        const element = document.createElement('div');
        element.textContent = 'XX XXXXXXX';
        element.style.cssText = `position:fixed;left:-10000px;top:0;width:${width};height:auto;margin:0;padding:0;border:0;font:10px/10px Ahem,sans-serif;white-space:normal;`;
        document.body.appendChild(element);
        const value = rect(element);
        element.remove();
        return value;
      };
      const cases = Array.from(document.querySelectorAll('.case')).map((section) => ({
        id: section.dataset.case,
        grids: Array.from(section.querySelectorAll('.grid'), (grid) => ({
          id: grid.id,
          columns: getComputedStyle(grid).gridTemplateColumns,
          width: getComputedStyle(grid).width,
          frame: rect(grid),
        })),
        text: (() => {
          const element = section.querySelector('.text');
          return {id:element.id, frame:rect(element)};
        })(),
      }));
      window.__C114_NESTED_GRID_DEPTH_TWO__ = {
        userAgent: navigator.userAgent,
        platform: navigator.platform,
        viewport: {width:innerWidth, height:innerHeight, dpr:devicePixelRatio},
        ahemReady: document.fonts.check('10px Ahem'),
        textIntrinsic: {minContent:probe('min-content'), maxContent:probe('max-content')},
        cases,
      };
      document.querySelector('#result').textContent = JSON.stringify(window.__C114_NESTED_GRID_DEPTH_TWO__, null, 2);
    });
  </script>
</body>
