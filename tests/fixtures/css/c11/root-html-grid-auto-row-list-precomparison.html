<!doctype html>
<meta charset="utf-8">
<title>Root HTML grid-auto-rows fixed list cycle</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
#root { display:grid; width:100px; height:100px; grid-template-columns:40px 55px; grid-template-rows:20px; column-gap:5px; row-gap:5px; grid-auto-flow:row; grid-auto-rows:15px 25px; align-content:start; justify-content:start; background:#ddd; }
.item { width:40px; height:15px; background:#4a90e2; }
.item:nth-child(2n) { width:55px; }
.item:nth-child(-n+2) { height:20px; }
.item:nth-child(n+5):nth-child(-n+6) { height:25px; }
</style>
<div id="root">
  <div class="item" id="item1"></div><div class="item" id="item2"></div>
  <div class="item" id="item3"></div><div class="item" id="item4"></div>
  <div class="item" id="item5"></div><div class="item" id="item6"></div>
  <div class="item" id="item7"></div><div class="item" id="item8"></div>
</div>
