<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C11.3.3 negative named-line pair runtime reference</title>
<style>
  html, body { width: 320px; height: 240px; margin: 0; overflow: hidden; }
  #matrix {
    box-sizing: border-box;
    display: grid;
    width: 320px;
    height: 240px;
    grid-template-columns: 160px 160px;
    grid-template-rows: 60px 60px 60px 60px;
    grid-auto-flow: row;
    gap: 0;
  }
</style>
<div id="matrix">
  <div id="negative-pair-span-grid" style="box-sizing:border-box;display:grid;width:160px;height:30px;margin:0;padding:0;border:0;gap:0;background-color:#101820;grid-template-columns:20px 30px 40px;grid-template-rows:10px 10px 10px;grid-auto-rows:5px 7px;grid-auto-columns:5px 7px;grid-auto-flow:row">
    <div id="negative-pair-span-item" style="box-sizing:border-box;width:17px;height:10px;margin:0;padding:0;border:0;background-color:#2866f6;grid-column:-4 ghost / -1 ghost;grid-row:1 / 2"></div>
  </div>
  <div id="negative-pair-reversed-grid" style="box-sizing:border-box;display:grid;width:160px;height:30px;margin:0;padding:0;border:0;gap:0;background-color:#101820;grid-template-columns:20px 30px 40px;grid-template-rows:10px 10px 10px;grid-auto-rows:5px 7px;grid-auto-columns:5px 7px;grid-auto-flow:row">
    <div id="negative-pair-reversed-item" style="box-sizing:border-box;width:17px;height:10px;margin:0;padding:0;border:0;background-color:#2866f6;grid-column:-1 ghost / -4 ghost;grid-row:1 / 2"></div>
  </div>
  <div id="negative-pair-one-grid" style="box-sizing:border-box;display:grid;width:160px;height:30px;margin:0;padding:0;border:0;gap:0;background-color:#101820;grid-template-columns:20px 30px 40px;grid-template-rows:10px 10px 10px;grid-auto-rows:5px 7px;grid-auto-columns:5px 7px;grid-auto-flow:row">
    <div id="negative-pair-one-item" style="box-sizing:border-box;width:17px;height:10px;margin:0;padding:0;border:0;background-color:#2866f6;grid-column:-2 ghost / -1 ghost;grid-row:1 / 2"></div>
  </div>
  <div id="negative-pair-equal-grid" style="box-sizing:border-box;display:grid;width:160px;height:30px;margin:0;padding:0;border:0;gap:0;background-color:#101820;grid-template-columns:20px 30px 40px;grid-template-rows:10px 10px 10px;grid-auto-rows:5px 7px;grid-auto-columns:5px 7px;grid-auto-flow:row">
    <div id="negative-pair-equal-item" style="box-sizing:border-box;width:17px;height:10px;margin:0;padding:0;border:0;background-color:#2866f6;grid-column:-2 ghost / -2 ghost;grid-row:1 / 2"></div>
  </div>
  <div id="negative-pair-offset-grid" style="box-sizing:border-box;display:grid;width:160px;height:30px;margin:0;padding:0;border:0;gap:0;background-color:#101820;grid-template-columns:20px 30px 40px;grid-template-rows:10px 10px 10px;grid-auto-rows:5px 7px;grid-auto-columns:5px 7px;grid-auto-flow:row">
    <div id="negative-pair-offset-item" style="box-sizing:border-box;width:17px;height:10px;margin:0;padding:0;border:0;background-color:#2866f6;grid-column:-5 ghost / -2 ghost;grid-row:1 / 2"></div>
  </div>
  <div id="negative-pair-auto-columns-grid" style="box-sizing:border-box;display:grid;width:108px;height:30px;margin:0;padding:0;border:0;gap:0;background-color:#101820;grid-template-columns:20px 30px 40px;grid-template-rows:10px 10px 10px;grid-auto-rows:5px 7px;grid-auto-columns:auto;grid-auto-flow:row">

  </div>
