<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; }
  body { padding: 40px 0 0 20px; background-color: #101820; }
  #root {
    display: grid;
    width: 30px;
    height: 20px;
    grid-template-columns: fit-content(200%);
    grid-template-rows: 20px;
    gap: 0;
    padding: 0;
    border-width: 2px;
    border-style: solid;
    color: #30a46c;
    background-color: #263746;
  }
  #item {
    width: 60px;
    height: 20px;
    margin: 0;
    padding: 0;
    background-color: #e5484d;
  }
</style>
<main id="root">
  <div id="item"></div>
</main>
