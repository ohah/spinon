<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C11.4 auto minimum with max-content maximum</title>
  <style>
    @font-face {
      font-family: Ahem;
      src: url("../../resources/c15/Ahem.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
    }
    html, body { margin: 0; padding: 0; }
    body { font: 12px sans-serif; color: #18212b; background: #f1f5f9; }
    h1 { margin: 8px 10px; font-size: 16px; }
    #scenes { display: grid; grid-template-columns: repeat(2, max-content); gap: 8px; padding: 10px; }
    .scene { box-sizing: border-box; padding: 4px; background: white; border: 1px solid #94a3b8; }
    .label { margin-bottom: 4px; }
    .grid { box-sizing: border-box; display: grid; margin: 0; padding: 0; border: 0; gap: 0; align-content: start; justify-content: start; }
    .column-grid { width: 60px; height: 20px; grid-template-columns: minmax(auto, max-content); grid-template-rows: 20px; }
    .row-grid { width: 30px; height: 5px; grid-template-columns: 15px; grid-template-rows: minmax(auto, max-content); }
    .text-item { box-sizing: border-box; margin: 0; padding: 0; border: 0; font: 10px/10px Ahem; white-space: normal; }
    .image-item { box-sizing: border-box; display: block; width: 15px; height: auto; margin: 0; padding: 0; border: 0; align-self: start; }
    pre { white-space: pre-wrap; margin: 8px; padding: 8px; background: #e2e8f0; }
  </style>
</head>
<body>
  <h1>C11.4: minmax(auto, max-content) × overflow automatic minimum</h1>
  <main id="scenes"></main>
  <pre id="observation">waiting</pre>
  <script>
    const overflowValues = ["visible", "clip", "hidden", "auto", "scroll"];
    const imageUrl = "../../resources/c14-1-png-basic.png";
    const scenes = document.querySelector("#scenes");
    for (const axis of ["columns", "rows"]) {
      for (const overflow of overflowValues) {
        const id = `${axis}-${overflow}`;
        const card = document.createElement("section");
        card.className = "scene";
        card.dataset.scene = id;
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = id;
        const grid = document.createElement("div");
        grid.className = `grid ${axis === "columns" ? "column-grid" : "row-grid"}`;
        grid.dataset.grid = id;
        const item = axis === "columns" ? document.createElement("div") : document.createElement("img");
        item.className = axis === "columns" ? "text-item" : "image-item";
        item.dataset.item = id;
        item.style.overflow = overflow;
        if (axis === "columns") item.textContent = "XXXXXXXXXX";
        else item.src = imageUrl;
        grid.append(item);
        card.append(label, grid);
        scenes.append(card);
      }
    }
    async function observe() {
      await document.fonts.load("10px Ahem");
      await document.fonts.ready;
      const images = [...document.querySelectorAll("img")];
      await Promise.all(images.map(image => image.decode()));
      const frame = element => {
        const rect = element.getBoundingClientRect();
        return { x: rect.x, y: rect.y, width: rect.width, height: rect.height };
      };
      const relativeFrame = (element, ancestor) => {
        const rect = element.getBoundingClientRect();
        const parent = ancestor.getBoundingClientRect();
        return { x: rect.x - parent.x, y: rect.y - parent.y, width: rect.width, height: rect.height };
      };
      const observation = {
        userAgent: navigator.userAgent,
        devicePixelRatio: devicePixelRatio,
        viewport: { width: innerWidth, height: innerHeight },
        fontReady: document.fonts.check("10px Ahem"),
        scenes: [...scenes.querySelectorAll(".scene")].map(card => {
          const grid = card.querySelector(".grid");
          const item = grid.firstElementChild;
          const axis = card.dataset.scene.startsWith("columns-") ? "columns" : "rows";
          const style = getComputedStyle(grid);
          return {
            id: card.dataset.scene,
            axis,
            overflow: getComputedStyle(item).overflow,
            tracks: axis === "columns" ? style.gridTemplateColumns : style.gridTemplateRows,
            root: frame(grid),
            item: frame(item),
            itemRelative: relativeFrame(item, grid),
            itemMinimum: axis === "columns" ? getComputedStyle(item).minWidth : getComputedStyle(item).minHeight,
            naturalImage: item instanceof HTMLImageElement ? { width: item.naturalWidth, height: item.naturalHeight } : null,
            scrollSize: { width: item.scrollWidth, height: item.scrollHeight },
          };
        }),
      };
      document.querySelector("#observation").textContent = JSON.stringify(observation, null, 2);
      return observation;
    }
    window.observationReady = observe();
  </script>
</body>
</html>
