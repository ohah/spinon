<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C11.4 auto-repeat in both grid axes</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; color: #152033; background: #f4f6fa; font: 13px/1.4 system-ui, sans-serif; }
  h1 { margin: 0 0 6px; font-size: 20px; }
  p { max-width: 78ch; margin: 0 0 16px; }
  #cases { display: grid; grid-template-columns: repeat(2, max-content); gap: 22px; align-items: start; }
  figure { margin: 0; }
  figcaption { min-height: 36px; margin-bottom: 5px; font-weight: 650; }
  .grid { display: grid; width: 200px; height: 200px; gap: 8px; direction: ltr; writing-mode: horizontal-tb; justify-content: start; align-content: start; background: #dce5f2; }
  .item { width: 12px; height: 12px; min-width: 0; min-height: 0; background: #e5484d; }
  .track-strip { display: flex; align-items: stretch; gap: 2px; margin-top: 5px; }
  .track { display: grid; place-items: center; min-width: 18px; height: 18px; padding: 0 2px; overflow: hidden; border: 1px solid #70809a; color: #102033; background: #b8c9e2; font: 9px/1 ui-monospace, monospace; }
  .track:nth-child(even) { background: #f0c987; }
  #observations { margin-top: 20px; padding: 12px; max-height: 260px; overflow: auto; color: #d7e2f2; background: #101820; font: 10px/1.35 ui-monospace, monospace; white-space: pre-wrap; }
</style>
<h1>C11.4 · auto-repeat in both axes</h1>
<p>Each grid uses definite 200px inline and block sizes, 8px gutters, fixed 20px/10px neighbors, and a repeated <code>minmax(40px, 1fr) 20px</code> fragment.</p>
<main id="cases"></main>
<pre id="observations"></pre>
<script>
  const pattern = 'minmax(40px, 1fr) 20px';
  const definitions = [
    { id: 'columns-fill-control', columnsMode: 'auto-fill', rows: '20px 12px', width: 200, height: 200, placement: 'first' },
    { id: 'rows-fill-control', columns: '20px 12px', rowsMode: 'auto-fill', width: 200, height: 200, placement: 'first' },
    { id: 'both-fill-square', columnsMode: 'auto-fill', rowsMode: 'auto-fill', width: 200, height: 200, placement: 'first' },
    { id: 'both-fill-asymmetric', columnsMode: 'auto-fill', rowsMode: 'auto-fill', width: 200, height: 266, placement: 'first' },
    { id: 'both-fit-empty', columnsMode: 'auto-fit', rowsMode: 'auto-fit', width: 200, height: 200, placement: 'empty' },
    { id: 'both-fit-single', columnsMode: 'auto-fit', rowsMode: 'auto-fit', width: 200, height: 200, placement: 'first' },
    { id: 'both-fit-span-two', columnsMode: 'auto-fit', rowsMode: 'auto-fit', width: 200, height: 200, placement: 'span-two' },
    { id: 'both-fit-second-repeat', columnsMode: 'auto-fit', rowsMode: 'auto-fit', width: 200, height: 200, placement: 'second' },
    { id: 'columns-fit-rows-fill-empty', columnsMode: 'auto-fit', rowsMode: 'auto-fill', width: 200, height: 200, placement: 'empty' },
    { id: 'columns-fill-rows-fit-empty', columnsMode: 'auto-fill', rowsMode: 'auto-fit', width: 200, height: 200, placement: 'empty' },
    { id: 'columns-fit-rows-fill-second-repeat', columnsMode: 'auto-fit', rowsMode: 'auto-fill', width: 200, height: 200, placement: 'second' },
    { id: 'columns-fill-rows-fit-second-repeat', columnsMode: 'auto-fill', rowsMode: 'auto-fit', width: 200, height: 200, placement: 'second' },
  ];
  const trackNumbers = (value) => value.match(/[0-9.]+px/g)?.map((track) => Number.parseFloat(track)) ?? [];
  const patternTracks = (mode) => `20px repeat(${mode}, ${pattern}) 10px`;
  const cases = [];
  for (const definition of definitions) {
    const figure = document.createElement('figure');
    const caption = document.createElement('figcaption');
    caption.textContent = definition.id;
    const grid = document.createElement('div');
    grid.id = definition.id;
    grid.className = 'grid';
    grid.style.width = `${definition.width}px`;
    grid.style.height = `${definition.height}px`;
    grid.style.gridTemplateColumns = definition.columns
      ?? patternTracks(definition.columnsMode);
    grid.style.gridTemplateRows = definition.rows
      ?? patternTracks(definition.rowsMode);
    if (definition.placement !== 'empty') {
      const item = document.createElement('div');
      item.className = 'item';
      const line = definition.placement === 'second' ? 4 : 2;
      const span = definition.placement === 'span-two' ? 2 : 1;
      item.style.gridColumn = `${line} / span ${span}`;
      item.style.gridRow = `${line} / span ${span}`;
      grid.append(item);
    }
    figure.append(caption, grid);
    document.querySelector('#cases').append(figure);

    const style = getComputedStyle(grid);
    const rect = grid.getBoundingClientRect();
    const itemRect = grid.firstElementChild?.getBoundingClientRect();
    const columns = trackNumbers(style.gridTemplateColumns);
    const rows = trackNumbers(style.gridTemplateRows);
    for (const [axis, values] of [['columns', columns], ['rows', rows]]) {
      const strip = document.createElement('div');
      strip.className = 'track-strip';
      for (const size of values) {
        const track = document.createElement('span');
        track.className = 'track';
        track.style.width = axis === 'columns' ? `${Math.max(size, 18)}px` : '20px';
        track.style.height = axis === 'rows' ? `${Math.max(size, 18)}px` : '18px';
        track.textContent = `${axis[0]}:${size}`;
        strip.append(track);
      }
      figure.append(strip);
    }
    cases.push({
      id: definition.id,
      width: rect.width,
      height: rect.height,
      columnGap: style.columnGap,
      rowGap: style.rowGap,
      gridTemplateColumns: style.gridTemplateColumns,
      gridTemplateRows: style.gridTemplateRows,
      item: itemRect ? {
        x: itemRect.x - rect.x,
        y: itemRect.y - rect.y,
        width: itemRect.width,
        height: itemRect.height,
      } : null,
    });
  }
  document.querySelector('#observations').textContent = JSON.stringify({
    userAgent: navigator.userAgent,
    viewport: { width: innerWidth, height: innerHeight, dpr: devicePixelRatio },
    cases,
  }, null, 2);
</script>
