<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  .scene {
    display: grid;
    width: 40px;
    height: 100px;
    grid-template-columns: 40px;
    grid-template-rows: 10px;
    grid-auto-flow: row;
    grid-auto-columns: auto;
    grid-auto-rows: fit-content(24px);
    row-gap: 0;
    column-gap: 0;
    align-content: start;
    align-items: normal;
    justify-content: start;
    justify-items: normal;
    overflow: visible;
    margin: 0;
    padding: 0;
    background-color: #102030;
  }
  .explicit {
    display: block;
    width: auto;
    height: 10px;
    margin: 0;
    padding: 0;
    background-color: #e5484d;
  }
  .item {
    display: block;
    width: auto;
    height: auto;
    min-height: 0;
    max-height: none;
    margin: 0;
    padding: 0;
    background-color: #22c55e;
  }
  .payload {
    display: block;
    width: auto;
    height: 34px;
    margin: 0;
    padding: 0;
    background-color: #3b82f6;
  }
  .probe {
    display: block;
    width: auto;
    height: 6px;
    margin: 0;
    padding: 0;
    background-color: #f97316;
  }
  @media (prefers-color-scheme: dark) {
    .scene { grid-auto-rows: fit-content(calc(12px + 12%)); }
  }
</style>
<div id="scene" class="scene">
  <div id="explicit" class="explicit"></div>
  <div id="item" class="item"><div id="payload" class="payload"></div></div>
  <div id="probe" class="probe"></div>
</div>
