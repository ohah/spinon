<!doctype html>
<meta charset="utf-8">
<title>C11.4 cyclic minmax(calc()) overlapping spans precomparison</title>
<style>
  @font-face { font-family: Ahem; src: url("../../resources/c15/Ahem.ttf") format("truetype"); }
  html, body { margin: 0; padding: 0; }
  body { background: #ffffff; }
  .grid {
    box-sizing: content-box;
    display: grid;
    margin: 0 0 12px;
    padding: 0;
    border: 2px solid #f0c674;
    column-gap: 2px;
    row-gap: 0;
    align-items: stretch;
    align-content: start;
    justify-content: start;
    background: #101820;
    font: 10px/10px Ahem, sans-serif;
    color: #e5484d;
  }
  .grid.cyclic { width: max-content; }
  .grid.definite { width: 140px; }
  .grid.definite-small { width: 100px; }
  .item {
    min-width: 0;
    min-height: 0;
    margin: 0;
    padding: 0;
    border: 0;
    white-space: nowrap;
    background: #e5484d;
  }
  .span2-left { grid-column: 1 / 3; grid-row: 1; background: #3b82f6; color: #e5484d; }
  .span2-right { grid-column: 2 / 4; grid-row: 1; background: #22c55e; color: #e5484d; }
  .span3 { grid-column: 1 / 4; grid-row: 1; background: #e5484d; color: #e5484d; }
</style>
<div id="cyclic-minmax-calc-overlap-forward" class="grid cyclic" style="height:10px;grid-template-columns:minmax(calc(10% + 2px),max-content) minmax(calc(10% + 2px),max-content) minmax(calc(10% + 2px),max-content);grid-template-rows:10px">
  <div class="item span2-left" data-kind="span2-left">aaaaaaa</div>
  <div class="item span2-right" data-kind="span2-right">aaaaaaaa</div>
  <div class="item span3" data-kind="span3">aaaaaaaaaaaaaa</div>
</div>
<div id="cyclic-minmax-calc-overlap-reverse" class="grid cyclic" style="height:10px;grid-template-columns:minmax(calc(10% + 2px),max-content) minmax(calc(10% + 2px),max-content) minmax(calc(10% + 2px),max-content);grid-template-rows:10px">
  <div class="item span3" data-kind="span3">aaaaaaaaaaaaaa</div>
  <div class="item span2-right" data-kind="span2-right">aaaaaaaa</div>
  <div class="item span2-left" data-kind="span2-left">aaaaaaa</div>
</div>
<div id="definite-minmax-calc-overlap-forward" class="grid definite" style="height:10px;grid-template-columns:minmax(calc(10% + 2px),max-content) minmax(calc(10% + 2px),max-content) minmax(calc(10% + 2px),max-content);grid-template-rows:10px">
  <div class="item span2-left" data-kind="span2-left">aaaaaaa</div>
  <div class="item span2-right" data-kind="span2-right">aaaaaaaa</div>
  <div class="item span3" data-kind="span3">aaaaaaaaaaaaaa</div>
</div>
<div id="definite-minmax-calc-overlap-reverse" class="grid definite" style="height:10px;grid-template-columns:minmax(calc(10% + 2px),max-content) minmax(calc(10% + 2px),max-content) minmax(calc(10% + 2px),max-content);grid-template-rows:10px">
  <div class="item span3" data-kind="span3">aaaaaaaaaaaaaa</div>
  <div class="item span2-right" data-kind="span2-right">aaaaaaaa</div>
  <div class="item span2-left" data-kind="span2-left">aaaaaaa</div>
</div>
<div id="definite-minmax-calc-overlap-small-forward" class="grid definite-small" style="height:10px;grid-template-columns:minmax(calc(10% + 2px),max-content) minmax(calc(10% + 2px),max-content) minmax(calc(10% + 2px),max-content);grid-template-rows:10px">
  <div class="item span2-left" data-kind="span2-left">aaaaaaa</div>
  <div class="item span2-right" data-kind="span2-right">aaaaaaaa</div>
  <div class="item span3" data-kind="span3">aaaaaaaaaaaaaa</div>
</div>
<div id="definite-minmax-calc-overlap-small-reverse" class="grid definite-small" style="height:10px;grid-template-columns:minmax(calc(10% + 2px),max-content) minmax(calc(10% + 2px),max-content) minmax(calc(10% + 2px),max-content);grid-template-rows:10px">
  <div class="item span3" data-kind="span3">aaaaaaaaaaaaaa</div>
  <div class="item span2-right" data-kind="span2-right">aaaaaaaa</div>
  <div class="item span2-left" data-kind="span2-left">aaaaaaa</div>
</div>
<script>
  document.fonts.ready.then(() => {
    const rect = (element, origin) => {
      const { x, y, width, height } = element.getBoundingClientRect();
      return { x: x - origin.x, y: y - origin.y, width, height };
    };
    window.cyclicMinmaxCalcOverlapResults = {
      userAgent: navigator.userAgent,
      viewport: { width: innerWidth, height: innerHeight, dpr: devicePixelRatio },
      font: { status: document.fonts.status, loaded: document.fonts.check("10px Ahem") },
      scenes: Array.from(document.querySelectorAll(".grid"), (grid) => {
        const root = grid.getBoundingClientRect();
        const style = getComputedStyle(grid);
        return {
          id: grid.id,
          root: { x: root.x, y: root.y, width: root.width, height: root.height },
          content: { width: style.width, height: style.height },
          columns: style.gridTemplateColumns,
          rows: style.gridTemplateRows,
          columnGap: style.columnGap,
          items: Array.from(grid.children, (item) => ({
            kind: item.dataset.kind,
            frame: rect(item, root),
            column: getComputedStyle(item).gridColumn,
            text: item.textContent,
            scrollWidth: item.scrollWidth,
          })),
        };
      }),
    };
  });
</script>
