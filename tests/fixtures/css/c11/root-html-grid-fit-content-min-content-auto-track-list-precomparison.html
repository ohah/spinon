<!doctype html>
<meta charset="utf-8">
<title>C11.4 Root HTML fit-content/min-content/auto implicit row list precomparison</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { color: #e7edf3; background: #101820; font: 12px/16px sans-serif; }
  .case { margin: 0 0 12px; }
  .label { margin: 0 0 2px; }
  .grid {
    display: grid;
    width: 40px;
    height: 100px;
    grid-template-columns: 40px;
    grid-template-rows: 10px;
    grid-auto-flow: row;
    grid-auto-columns: auto;
    align-content: stretch;
    align-items: normal;
    justify-content: start;
    justify-items: normal;
    gap: 0;
    margin: 0;
    padding: 0;
    border: 0;
    outline: 1px dashed #ffffff;
    overflow: visible;
    background: #17212b;
  }
  .explicit { height: 10px; background: #e5484d; }
  .item { min-height: 0; margin: 0; padding: 0; }
  .item-1 { background: #22c55e; }
  .item-2 { background: #14b8a6; }
  .item-3 { background: #f97316; }
  .item-4 { background: #a855f7; }
  .payload { margin: 0; padding: 0; background: #3b82f6; }
  .payload-2 { background: #06b6d4; }
  .payload-3 { background: #84cc16; }
  .payload-4 { background: #ec4899; }
  .p34 { height: 34px; }
  .p10 { height: 10px; }
  .p6 { height: 6px; }
  .p50 { height: 50px; }
</style>
<div class="case">
  <p class="label">fit-content(20%) min-content auto · positive free space</p>
  <div class="grid" id="fit-min-auto" style="grid-auto-rows:fit-content(20%) min-content auto">
    <div class="explicit" id="a-explicit"></div>
    <div class="item item-1" id="a-item-1"><div class="payload p34" id="a-payload-1"></div></div>
    <div class="item item-2" id="a-item-2"><div class="payload payload-2 p34" id="a-payload-2"></div></div>
    <div class="item item-3" id="a-item-3"><div class="payload payload-3 p10" id="a-payload-3"></div></div>
    <div class="item item-4" id="a-item-4"><div class="payload payload-4 p6" id="a-payload-4"></div></div>
  </div>
</div>
<div class="case">
  <p class="label">fit-content(20%) auto min-content · same contributions, reordered</p>
  <div class="grid" id="fit-auto-min" style="grid-auto-rows:fit-content(20%) auto min-content">
    <div class="explicit" id="b-explicit"></div>
    <div class="item item-1" id="b-item-1"><div class="payload p34" id="b-payload-1"></div></div>
    <div class="item item-2" id="b-item-2"><div class="payload payload-2 p34" id="b-payload-2"></div></div>
    <div class="item item-3" id="b-item-3"><div class="payload payload-3 p10" id="b-payload-3"></div></div>
    <div class="item item-4" id="b-item-4"><div class="payload payload-4 p6" id="b-payload-4"></div></div>
  </div>
</div>
<div class="case">
  <p class="label">fit-content(120%) min-content auto · visible overflow control</p>
  <div class="grid" id="fit-overflow" style="grid-auto-rows:fit-content(120%) min-content auto">
    <div class="explicit" id="c-explicit"></div>
    <div class="item item-1" id="c-item-1"><div class="payload p6" id="c-payload-1"></div></div>
    <div class="item item-2" id="c-item-2"><div class="payload payload-2 p34" id="c-payload-2"></div></div>
    <div class="item item-3" id="c-item-3"><div class="payload payload-3 p10" id="c-payload-3"></div></div>
    <div class="item item-4" id="c-item-4"><div class="payload payload-4 p50" id="c-payload-4"></div></div>
  </div>
</div>
