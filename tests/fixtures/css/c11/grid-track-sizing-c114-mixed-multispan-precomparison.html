<!doctype html>
<meta charset="utf-8">
<title>Spinon C11.4 mixed text and image multi-span precomparison</title>
<style>
  @font-face { font-family: Ahem; src: url("../../resources/c15/Ahem.ttf") format("truetype"); font-weight: 400; font-style: normal; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 320px; background: #fff; }
  body { font: 10px/1 sans-serif; color: #111; }
  .case { min-height: 74px; border-bottom: 1px solid #ccc; padding: 4px; }
  .label { display: block; margin-bottom: 2px; }
  .grid { display: grid; width: 220px; height: 180px; grid-template-columns: repeat(4, min-content); grid-template-rows: repeat(3, 60px); gap: 0; align-items: start; align-content: start; justify-content: start; overflow: visible; font: 10px/10px Ahem, sans-serif; white-space: normal; color: #e5484d; }
  .item { display: block; align-self: auto; justify-self: auto; margin: 0; padding: 0; border: 0; }
  .image { width: auto; height: 48px; }
  #result { display: none; }
</style>
<body>
  <section class="case" data-case="mixed-text-image-span2-forward">
    <span class="label">span-2 Ahem text and intrinsic image contributions, text first</span>
    <div class="grid" id="mixed-text-image-span2-forward">
      <div class="item" id="mixed-text-a-forward" style="grid-column:1 / span 2;grid-row:1">XX XXXXX</div>
      <img class="item image" id="mixed-image-b-forward" src="../../resources/c14-1-png-basic.png" alt="" style="grid-column:2 / span 2;grid-row:2">
    </div>
  </section>
  <section class="case" data-case="mixed-text-image-span2-reversed">
    <span class="label">same span-2 inputs with image first in DOM</span>
    <div class="grid" id="mixed-text-image-span2-reversed">
      <img class="item image" id="mixed-image-b-reversed" src="../../resources/c14-1-png-basic.png" alt="" style="grid-column:2 / span 2;grid-row:2">
      <div class="item" id="mixed-text-a-reversed" style="grid-column:1 / span 2;grid-row:1">XX XXXXX</div>
    </div>
  </section>
  <section class="case" data-case="mixed-text-image-span2-before-span3">
    <span class="label">mixed span-2 contributions followed by a span-3 text contribution</span>
    <div class="grid" id="mixed-text-image-span2-before-span3">
      <div class="item" id="mixed-text-c-a" style="grid-column:1 / span 2;grid-row:1">XX XXXXX</div>
      <img class="item image" id="mixed-image-c-b" src="../../resources/c14-1-png-basic.png" alt="" style="grid-column:2 / span 2;grid-row:2">
      <div class="item" id="mixed-text-c-c" style="grid-column:1 / span 3;grid-row:3">XXXXXXXXXXXXXXXXXX</div>
    </div>
  </section>
  <section class="case" data-case="mixed-text-image-span3-before-span2">
    <span class="label">same mixed spans with span-3 text first in DOM</span>
    <div class="grid" id="mixed-text-image-span3-before-span2">
      <div class="item" id="mixed-text-r-c" style="grid-column:1 / span 3;grid-row:3">XXXXXXXXXXXXXXXXXX</div>
      <img class="item image" id="mixed-image-r-b" src="../../resources/c14-1-png-basic.png" alt="" style="grid-column:2 / span 2;grid-row:2">
      <div class="item" id="mixed-text-r-a" style="grid-column:1 / span 2;grid-row:1">XX XXXXX</div>
    </div>
  </section>
  <pre id="result"></pre>
  <script>
    Promise.all([
      document.fonts.ready,
      ...Array.from(document.querySelectorAll('img'), (image) => image.decode()),
    ]).then(() => {
      const rect = (node) => {
        const value = node.getBoundingClientRect();
        return {x:value.x, y:value.y, width:value.width, height:value.height};
      };
      const cases = Array.from(document.querySelectorAll('.case')).map((section) => {
        const grid = section.querySelector('.grid');
        return {
          id: section.dataset.case,
          columns: getComputedStyle(grid).gridTemplateColumns,
          rows: getComputedStyle(grid).gridTemplateRows,
          grid: rect(grid),
          items: Array.from(grid.children, (item) => ({
            id:item.id,
            text:item.textContent.trim(),
            naturalWidth:item instanceof HTMLImageElement ? item.naturalWidth : null,
            naturalHeight:item instanceof HTMLImageElement ? item.naturalHeight : null,
            computedMinWidth:getComputedStyle(item).minWidth,
            frame:rect(item),
          })),
        };
      });
      window.__C114_MIXED_MULTISPAN_OBSERVATION__ = {
        userAgent:navigator.userAgent,
        platform:navigator.platform,
        devicePixelRatio,
        ahemReady:document.fonts.check('10px Ahem'),
        imageDecodeComplete:Array.from(document.querySelectorAll('img'), (image) => image.complete && image.naturalWidth === 24 && image.naturalHeight === 16).every(Boolean),
        intrinsicWidths:{
          shortTextProbe:(() => {
            const probe = document.createElement('div');
            probe.textContent = 'XX XXXXX';
            probe.style.cssText = 'position:fixed;left:-10000px;top:0;width:min-content;height:auto;margin:0;padding:0;border:0;font:10px/10px Ahem,sans-serif;white-space:normal;overflow-wrap:normal;word-break:normal;';
            document.body.appendChild(probe);
            const width = probe.getBoundingClientRect().width;
            probe.remove();
            return width;
          })(),
          longTextProbe:(() => {
            const probe = document.createElement('div');
            probe.textContent = 'XXXXXXXXXXXXXXXXXX';
            probe.style.cssText = 'position:fixed;left:-10000px;top:0;width:min-content;height:auto;margin:0;padding:0;border:0;font:10px/10px Ahem,sans-serif;white-space:normal;overflow-wrap:normal;word-break:normal;';
            document.body.appendChild(probe);
            const width = probe.getBoundingClientRect().width;
            probe.remove();
            return width;
          })(),
        },
        cases,
      };
      document.querySelector('#result').textContent = JSON.stringify(window.__C114_MIXED_MULTISPAN_OBSERVATION__, null, 2);
    });
  </script>
</body>
