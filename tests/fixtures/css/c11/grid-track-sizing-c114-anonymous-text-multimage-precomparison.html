<!doctype html>
<meta charset="utf-8">
<title>Spinon C11.4 anonymous Grid text and multiple spanning images precomparison</title>
<style>
  @font-face { font-family: Ahem; src: url("../../resources/c15/Ahem.ttf") format("truetype"); font-weight: 400; font-style: normal; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 520px; background: #fff; }
  body { font: 12px/16px system-ui, sans-serif; color: #111; }
  .case { min-height: 88px; border-bottom: 1px solid #ccc; padding: 4px; }
  .label { display: block; margin-bottom: 2px; }
  .grid { display: grid; width: 220px; height: 180px; grid-template-columns: repeat(4, min-content); grid-template-rows: repeat(3, 60px); gap: 0; align-items: start; align-content: start; justify-items: start; justify-content: start; overflow: visible; font: 10px/10px Ahem, sans-serif; white-space: normal; color: #e5484d; background: #101820; }
  .grid img { width: auto; margin: 0; padding: 0; border: 0; }
  #result { display: none; }
</style>
<body>
  <section class="case" data-case="anonymous-text-two-images-forward">
    <span class="label">anonymous Ahem text before two overlapping span-2 images</span>
    <div class="grid" id="anonymous-text-two-images-forward">XX<img id="image-a-forward" src="../../resources/c14-1-png-basic.png" alt="" style="height:16px;grid-column:1 / span 2;grid-row:1"><img id="image-b-forward" src="../../resources/c14-1-png-basic.png" alt="" style="height:32px;grid-column:2 / span 2;grid-row:2"></div>
  </section>
  <section class="case" data-case="two-images-anonymous-text-reversed">
    <span class="label">same two span-2 images and anonymous item in reversed source order</span>
    <div class="grid" id="two-images-anonymous-text-reversed"><img id="image-b-reversed" src="../../resources/c14-1-png-basic.png" alt="" style="height:32px;grid-column:2 / span 2;grid-row:2">XX<img id="image-a-reversed" src="../../resources/c14-1-png-basic.png" alt="" style="height:16px;grid-column:1 / span 2;grid-row:1"></div>
  </section>
  <section class="case" data-case="anonymous-text-three-images-forward">
    <span class="label">anonymous item and span-2 images followed by a span-3 image</span>
    <div class="grid" id="anonymous-text-three-images-forward">XX<img id="image-a-three-forward" src="../../resources/c14-1-png-basic.png" alt="" style="height:16px;grid-column:1 / span 2;grid-row:1"><img id="image-b-three-forward" src="../../resources/c14-1-png-basic.png" alt="" style="height:32px;grid-column:2 / span 2;grid-row:2"><img id="image-c-three-forward" src="../../resources/c14-1-png-basic.png" alt="" style="height:48px;grid-column:1 / span 3;grid-row:3"></div>
  </section>
  <section class="case" data-case="three-images-anonymous-text-reversed">
    <span class="label">same three spanning images with the anonymous item in reversed source order</span>
    <div class="grid" id="three-images-anonymous-text-reversed"><img id="image-c-three-reversed" src="../../resources/c14-1-png-basic.png" alt="" style="height:48px;grid-column:1 / span 3;grid-row:3"><img id="image-b-three-reversed" src="../../resources/c14-1-png-basic.png" alt="" style="height:32px;grid-column:2 / span 2;grid-row:2">XX<img id="image-a-three-reversed" src="../../resources/c14-1-png-basic.png" alt="" style="height:16px;grid-column:1 / span 2;grid-row:1"></div>
  </section>
  <pre id="result"></pre>
  <script>
    const rect = (node) => {
      const value = node.getBoundingClientRect();
      return {x:value.x, y:value.y, width:value.width, height:value.height};
    };
    const textSegments = (element) => {
      const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
      const segments = [];
      for (let node = walker.nextNode(); node; node = walker.nextNode()) {
        const range = document.createRange();
        range.selectNodeContents(node);
        segments.push({text:node.data, rects:Array.from(range.getClientRects(), (value) => ({x:value.x,y:value.y,width:value.width,height:value.height}))});
      }
      return segments;
    };
    const minContentWidth = (text) => {
      const probe = document.createElement('div');
      probe.textContent = text;
      probe.style.cssText = 'position:fixed;left:-10000px;top:0;width:min-content;height:auto;margin:0;padding:0;border:0;font:10px/10px Ahem,sans-serif;white-space:normal;overflow-wrap:normal;word-break:normal;';
      document.body.appendChild(probe);
      const width = probe.getBoundingClientRect().width;
      probe.remove();
      return width;
    };
    Promise.all([
      document.fonts.ready,
      ...Array.from(document.querySelectorAll('img'), (image) => image.decode()),
    ]).then(async () => {
      const browserVersion = await navigator.userAgentData.getHighEntropyValues(['uaFullVersion']);
      const cases = Array.from(document.querySelectorAll('.case'), (section) => {
        const grid = section.querySelector('.grid');
        return {
          id:section.dataset.case,
          directChildren:Array.from(grid.childNodes, (node) => ({
            kind:node.nodeType === Node.TEXT_NODE ? 'text' : node.nodeType === Node.ELEMENT_NODE ? 'element' : `node-${node.nodeType}`,
            text:node.nodeType === Node.TEXT_NODE ? node.data : null,
            id:node.nodeType === Node.ELEMENT_NODE ? node.id || null : null,
          })),
          columns:getComputedStyle(grid).gridTemplateColumns,
          rows:getComputedStyle(grid).gridTemplateRows,
          grid:rect(grid),
          text:textSegments(grid),
          elements:Array.from(grid.children, (child) => ({
            id:child.id || null,
            tag:child.localName,
            display:getComputedStyle(child).display,
            gridColumn:getComputedStyle(child).gridColumn,
            gridRow:getComputedStyle(child).gridRow,
            naturalSize:child instanceof HTMLImageElement ? {width:child.naturalWidth,height:child.naturalHeight} : null,
            frame:rect(child),
          })),
        };
      });
      window.__C114_ANONYMOUS_TEXT_MULTI_IMAGE_OBSERVATION__ = {
        userAgent:navigator.userAgent,
        userAgentFullVersion:browserVersion.uaFullVersion,
        platform:navigator.platform,
        viewport:{width:innerWidth,height:innerHeight},
        devicePixelRatio,
        ahemReady:document.fonts.check('10px Ahem'),
        imageDecodeComplete:Array.from(document.querySelectorAll('img'), (image) => image.complete && image.naturalWidth === 24 && image.naturalHeight === 16).every(Boolean),
        intrinsicWidths:{anonymousText:minContentWidth('XX')},
        cases,
      };
      document.querySelector('#result').textContent = JSON.stringify(window.__C114_ANONYMOUS_TEXT_MULTI_IMAGE_OBSERVATION__, null, 2);
    });
  </script>
</body>
