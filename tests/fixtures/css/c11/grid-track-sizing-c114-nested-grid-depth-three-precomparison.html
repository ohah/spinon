<!doctype html>
<meta charset="utf-8">
<title>C11.4 depth-three nested Grid intrinsic sizing precomparison</title>
<style>
  @font-face { font-family: Ahem; src: url("../../resources/c15/Ahem.ttf") format("truetype"); font-weight: 400; font-style: normal; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 640px; background: #fff; }
  body { font: 10px/1 sans-serif; color: #111; }
  .case { min-height: 116px; border-bottom: 1px solid #ccc; padding: 8px; }
  .label { display: block; margin-bottom: 6px; }
  .grid { display: grid; gap: 0; align-content: start; justify-content: start; align-items: start; }
  .min { width: min-content; height: min-content; grid-template-columns: min-content; grid-template-rows: min-content; }
  .max { width: max-content; height: max-content; grid-template-columns: max-content; grid-template-rows: max-content; }
  .grid-item { margin: 0; padding: 0; border: 0; justify-self: start; align-self: start; }
  .text { font: 10px/10px Ahem, sans-serif; white-space: normal; color: #e5484d; }
  #result { display: none; }
</style>
<body>
  <section class="case" data-case="nested-depth-three-min-content-two-axis">
    <span class="label">depth three: root → middle → branch → inner Grid, two-axis min-content</span>
    <div class="grid root min" id="depth-three-min-root">
      <div class="grid grid-item min" id="depth-three-min-middle">
        <div class="grid grid-item min" id="depth-three-min-branch">
          <div class="grid grid-item min" id="depth-three-min-inner">
            <div class="grid-item text" id="depth-three-min-text">XX XXXXXXX</div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <section class="case" data-case="nested-depth-three-max-content-two-axis">
    <span class="label">depth three: root → middle → branch → inner Grid, two-axis max-content</span>
    <div class="grid root max" id="depth-three-max-root">
      <div class="grid grid-item max" id="depth-three-max-middle">
        <div class="grid grid-item max" id="depth-three-max-branch">
          <div class="grid grid-item max" id="depth-three-max-inner">
            <div class="grid-item text" id="depth-three-max-text">XX XXXXXXX</div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <pre id="result"></pre>
  <script>
    document.fonts.ready.then(() => {
      const rect = (element) => {
        const value = element.getBoundingClientRect();
        const snap = (number) => Math.round(number * 64) / 64;
        return {x:snap(value.x), y:snap(value.y), width:snap(value.width), height:snap(value.height)};
      };
      const cases = Array.from(document.querySelectorAll(".case")).map((section) => ({
        id: section.dataset.case,
        grids: Array.from(section.querySelectorAll(".grid"), (grid) => ({
          id: grid.id,
          columns: getComputedStyle(grid).gridTemplateColumns,
          rows: getComputedStyle(grid).gridTemplateRows,
          width: getComputedStyle(grid).width,
          height: getComputedStyle(grid).height,
          frame: rect(grid),
        })),
        text: (() => {
          const element = section.querySelector(".text");
          return {id:element.id, frame:rect(element)};
        })(),
      }));
      window.__C114_NESTED_GRID_DEPTH_THREE__ = {
        userAgent: navigator.userAgent,
        platform: navigator.platform,
        viewport: {width:innerWidth, height:innerHeight, dpr:devicePixelRatio},
        ahemReady: document.fonts.check("10px Ahem"),
        cases,
      };
      document.querySelector("#result").textContent = JSON.stringify(window.__C114_NESTED_GRID_DEPTH_THREE__, null, 2);
    });
  </script>
</body>
