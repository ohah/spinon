<!doctype html><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:12px sans-serif}.grid{display:grid;width:100px;height:80px;margin:0 0 12px;padding:0;border:0;gap:0;align-content:start;justify-content:start;background:#101820}.item{margin:0;padding:0;border:0;min-width:0;min-height:0;background:#3e63dd}.green{background:#30a46c}.red{background:#e5484d}.purple{background:#8e4ec6}.orange{background:#f76b15}.cyan{background:#00a2c7}
</style>
<div id="both-axis-cycle" class="grid" style="grid-template-rows:20px;grid-template-columns:30px;grid-auto-rows:5px 7px;grid-auto-columns:11px 13px;grid-template-areas:'hero hero side side' 'hero hero side side' 'footer footer utility utility' 'extra extra spare spare'"><div id="both-hero" class="item red" style="grid-area:hero"></div><div id="both-side" class="item green" style="grid-area:side"></div><div id="both-footer" class="item purple" style="grid-area:footer"></div><div id="both-utility" class="item orange" style="grid-area:utility"></div><div id="both-extra" class="item cyan" style="grid-area:extra"></div><div id="both-spare" class="item" style="grid-area:spare"></div></div>
<div id="row-cycle-from-first-implicit" class="grid" style="grid-template-rows:17px 19px;grid-template-columns:22px 24px;grid-auto-rows:6px 8px;grid-auto-columns:10px 12px;grid-template-areas:'a a' 'b b' 'c c' 'd d' 'e e'"><div id="row-a" class="item red" style="grid-area:a"></div><div id="row-b" class="item green" style="grid-area:b"></div><div id="row-c" class="item purple" style="grid-area:c"></div><div id="row-d" class="item orange" style="grid-area:d"></div><div id="row-e" class="item cyan" style="grid-area:e"></div></div>
<div id="column-cycle-from-first-implicit" class="grid" style="grid-template-rows:12px 14px;grid-template-columns:21px 23px 25px;grid-auto-rows:4px 5px;grid-auto-columns:9px 10px;grid-template-areas:'left left middle middle right' 'left left middle middle right'"><div id="column-left" class="item red" style="grid-area:left"></div><div id="column-middle" class="item green" style="grid-area:middle"></div><div id="column-right" class="item purple" style="grid-area:right"></div></div>
<div id="authored-tracks-exceed-area" class="grid" style="grid-template-rows:15px 16px 17px;grid-template-columns:18px 19px 20px;grid-auto-rows:5px 7px;grid-auto-columns:9px 11px;grid-template-areas:'top top' 'bottom bottom'"><div id="exceed-top" class="item red" style="grid-area:top"></div><div id="exceed-bottom" class="item green" style="grid-area:bottom"></div></div>
<div id="row-cycle-continues-after-area" class="grid" style="grid-template-rows:20px;grid-template-columns:30px;grid-auto-rows:6px 8px;grid-auto-columns:11px 13px;grid-template-areas:'known' 'area-row'"><div id="phase-row-known" class="item red" style="grid-area:known"></div><div id="phase-row-area" class="item green" style="grid-area:area-row"></div><div id="phase-row-late" class="item purple" style="grid-row:4 / span 1;grid-column:1"></div></div>
<div id="column-cycle-continues-after-area" class="grid" style="grid-template-rows:30px;grid-template-columns:20px;grid-auto-rows:11px 13px;grid-auto-columns:5px 7px;grid-template-areas:'known area-col'"><div id="phase-column-known" class="item red" style="grid-area:known"></div><div id="phase-column-area" class="item green" style="grid-area:area-col"></div><div id="phase-column-late" class="item purple" style="grid-row:1;grid-column:4 / span 1"></div></div>
<script>window.report=()=>Object.fromEntries([...document.querySelectorAll('.grid')].map(g=>{const root=g.getBoundingClientRect();return[g.id,{rows:getComputedStyle(g).gridTemplateRows,columns:getComputedStyle(g).gridTemplateColumns,areas:getComputedStyle(g).gridTemplateAreas,root:[root.width,root.height],children:[...g.children].map(e=>{const r=e.getBoundingClientRect();return[e.id,r.x-root.x,r.y-root.y,r.width,r.height]})}]}));</script>
