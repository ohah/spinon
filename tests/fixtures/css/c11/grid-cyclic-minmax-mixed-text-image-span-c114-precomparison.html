<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C11.4 cyclic minmax mixed text and image span oracle</title>
  <style>
    @font-face {
      font-family: Ahem;
      src: url("../../resources/c15/Ahem.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      color: #101820;
      background: #e8edf2;
      font: 12px/1.4 system-ui, sans-serif;
    }
    main {
      display: grid;
      grid-template-columns: repeat(2, max-content);
      gap: 24px;
      align-items: start;
    }
    section { display: grid; gap: 6px; }
    h2 { margin: 0; font: 600 12px/1.4 system-ui, sans-serif; }
    .root {
      display: grid;
      grid-template-columns: repeat(3, minmax(calc(10% + 2px), max-content));
      grid-template-rows: repeat(2, minmax(calc(10% + 2px), max-content));
      gap: 2px;
      box-sizing: content-box;
      height: max-content;
      margin: 0;
      padding: 0;
      border: 2px solid #f0c674;
      background: #101820;
      align-content: start;
      justify-content: start;
    }
    .root.intrinsic { width: min-content; }
    .root.definite { width: 40px; }
    .item {
      box-sizing: border-box;
      min-width: auto;
      min-height: auto;
      margin: 0;
      padding: 0;
      border: 0;
      color: #e5484d;
      background: #e5484d;
    }
    .text {
      font: 400 10px/10px Ahem, monospace;
      white-space: normal;
      word-break: normal;
      overflow-wrap: normal;
    }
    .image { display: block; width: 40px; min-width: 40px; height: auto; }
    .a { grid-column: 1 / 3; grid-row: 1 / 3; }
    .b { grid-column: 2 / 4; grid-row: 1 / 3; }
    .c { grid-column: 1 / 4; grid-row: 1 / 3; }
  </style>
</head>
<body>
  <main>
    <section>
      <h2>intrinsic-forward</h2>
      <div class="root intrinsic" data-scene="intrinsic-forward">
        <div class="item text a" data-item="A">AA A A</div>
        <img class="item image b" data-item="B" src="../../resources/c14-1-png-basic.png" alt="">
        <div class="item text c" data-item="C">AA AA AA AA</div>
      </div>
    </section>
    <section>
      <h2>intrinsic-reverse</h2>
      <div class="root intrinsic" data-scene="intrinsic-reverse">
        <div class="item text c" data-item="C">AA AA AA AA</div>
        <img class="item image b" data-item="B" src="../../resources/c14-1-png-basic.png" alt="">
        <div class="item text a" data-item="A">AA A A</div>
      </div>
    </section>
    <section>
      <h2>definite-forward</h2>
      <div class="root definite" data-scene="definite-forward">
        <div class="item text a" data-item="A">AA A A</div>
        <img class="item image b" data-item="B" src="../../resources/c14-1-png-basic.png" alt="">
        <div class="item text c" data-item="C">AA AA AA AA</div>
      </div>
    </section>
    <section>
      <h2>definite-reverse</h2>
      <div class="root definite" data-scene="definite-reverse">
        <div class="item text c" data-item="C">AA AA AA AA</div>
        <img class="item image b" data-item="B" src="../../resources/c14-1-png-basic.png" alt="">
        <div class="item text a" data-item="A">AA A A</div>
      </div>
    </section>
  </main>
  <script>
    window.oracleReady = Promise.all([
      document.fonts.load("400 10px/10px Ahem"),
      ...Array.from(document.images, image => image.decode()),
    ]).then(() => {
      const round = value => Math.round(value * 64) / 64;
      const size = value => round(parseFloat(value));
      const rect = (root, element) => {
        const outer = root.getBoundingClientRect();
        const inner = element.getBoundingClientRect();
        return {
          x: round(inner.x - outer.x), y: round(inner.y - outer.y),
          width: round(inner.width), height: round(inner.height),
        };
      };
      const rangeRects = (root, element) => {
        const outer = root.getBoundingClientRect();
        const range = document.createRange();
        range.selectNodeContents(element);
        return Array.from(range.getClientRects(), item => ({
          x: round(item.x - outer.x), y: round(item.y - outer.y),
          width: round(item.width), height: round(item.height),
        }));
      };
      window.oracleObservation = Array.from(document.querySelectorAll("[data-scene]"), root => {
        const style = getComputedStyle(root);
        const items = Array.from(root.querySelectorAll("[data-item]"), item => {
          const itemStyle = getComputedStyle(item);
          return {
            id: item.dataset.item,
            kind: item.tagName.toLowerCase(),
            frame: rect(root, item),
            columns: itemStyle.gridColumn,
            rows: itemStyle.gridRow,
            textLines: item.tagName === "IMG" ? null : rangeRects(root, item),
            natural: item.tagName === "IMG" ? { width: item.naturalWidth, height: item.naturalHeight } : null,
          };
        });
        return {
          scene: root.dataset.scene,
          borderBox: { width: round(root.getBoundingClientRect().width), height: round(root.getBoundingClientRect().height) },
          columns: style.gridTemplateColumns.split(" ").map(size),
          rows: style.gridTemplateRows.split(" ").map(size),
          items,
        };
      });
      return window.oracleObservation;
    });
  </script>
</body>
</html>
