<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spinon root HTML Grid anonymous text precomparison</title>
    <style>
      html,
      body {
        margin: 0;
        min-width: 0;
      }

      #layout {
        box-sizing: border-box;
        display: grid;
        width: 120px;
        height: 70px;
        grid-template-columns: 40px 80px;
        grid-template-rows: 70px;
        row-gap: 0;
        column-gap: 0;
        background-color: #101820;
        color: #e5484d;
        font-family: monospace;
        font-size: 16px;
        line-height: 20px;
        white-space: normal;
      }
    </style>
  </head>
  <body><main id="layout">AB</main></body>
</html>
