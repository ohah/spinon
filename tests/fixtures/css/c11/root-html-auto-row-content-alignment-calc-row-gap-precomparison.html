<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>C11.4 implicit auto-row alignment with calc row gap</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #fff;
      }

      #grid {
        position: absolute;
        left: 100px;
        top: 100px;
        display: grid;
        box-sizing: border-box;
        width: 40px;
        height: 40px;
        grid-template-columns: 40px;
        grid-template-rows: 10px;
        grid-auto-rows: auto;
        grid-auto-flow: row;
        align-content: center;
        align-items: normal;
        row-gap: calc(6.25% + 2px);
        column-gap: 0;
        overflow: visible;
        background-color: #e9edf2;
      }

      #fixed {
        box-sizing: border-box;
        width: 40px;
        height: 10px;
        background-color: #303944;
      }

      .text {
        box-sizing: border-box;
        font-family: monospace;
        font-size: 10px;
        font-weight: 400;
        font-style: normal;
        line-height: 10px;
        white-space: normal;
        background-color: #2476d2;
      }
    </style>
  </head>
  <body>
    <div id="grid"><div id="fixed"></div><div id="text-a" class="text">A</div><div id="text-b" class="text">B</div></div>
    <script>
      window.captureCalcGap = () => {
        const grid = document.querySelector("#grid");
        const root = grid.getBoundingClientRect();
        const style = getComputedStyle(grid);
        return {
          rowGap: style.rowGap,
          alignContent: style.alignContent,
          root: [root.left, root.top, root.width, root.height],
          usedRows: style.gridTemplateRows.split(" ").map(Number.parseFloat),
          itemRects: Array.from(grid.children, (item) => {
            const rect = item.getBoundingClientRect();
            return [rect.left - root.left, rect.top - root.top, rect.width, rect.height];
          }),
        };
      };

      window.runCalcGapAlignmentMatrix = () => {
        const grid = document.querySelector("#grid");
        const gaps = [
          { expression: "calc(1px - 10%)", percentage: -0.1, length: 1 },
          { expression: "calc(6.25% + 2px)", percentage: 0.0625, length: 2 },
          { expression: "calc(2px + 6.25%)", percentage: 0.0625, length: 2 },
          { expression: "calc(25% - 2px)", percentage: 0.25, length: -2 },
          { expression: "calc(10% - 1px)", percentage: 0.1, length: -1 },
          { expression: "calc(120% - 2px)", percentage: 1.2, length: -2 },
        ];
        const alignments = [
          "normal", "stretch", "start", "flex-start", "end", "flex-end", "center",
          "space-between", "space-around", "space-evenly",
        ];
        const items = Array.from(grid.children);
        return gaps.map((gap) => {
          grid.style.rowGap = gap.expression;
          return {
            ...gap,
            expectedUsedGap: Math.max(0, 40 * gap.percentage + gap.length),
            itemCountCases: [2, 3].map((itemCount) => {
              grid.replaceChildren(...items.slice(0, itemCount));
              return {
                itemCount,
                cases: alignments.map((alignment) => {
                  grid.style.alignContent = alignment;
                  return captureCalcGap();
                }),
              };
            }),
          };
        });
      };
    </script>
  </body>
</html>
