<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Root HTML intrinsic row tracks with named areas</title>
    <style>
      html, body { margin: 0; padding: 0; }
      #root {
        box-sizing: border-box;
        display: grid;
        width: 32px;
        height: 120px;
        margin: 0;
        padding: 0;
        gap: 0;
        grid-template-columns: 1fr;
        grid-template-rows: min-content max-content;
        grid-template-areas: "head" "body";
        font-family: monospace;
        font-size: 10px;
        line-height: 11px;
        white-space: normal;
      }
      .item { box-sizing: border-box; min-width: 0; min-height: 0; margin: 0; padding: 0; }
      #head { grid-area: head; background-color: #e5484d; }
      #body { grid-area: body; background-color: #3a8f5b; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="head" class="item">ab cd ef</div>
      <div id="body" class="item">gh ij kl mn op qr</div>
    </div>
  </body>
</html>
