<!doctype html>
<meta charset="utf-8">
<title>C11.4 direct-text Grid preferred aspect-ratio axis transfer precomparison</title>
<style>
@font-face {
  font-family: Ahem;
  src: url('../../resources/c15/Ahem.ttf') format('truetype');
}
html, body { margin: 0; }
body {
  padding: 20px;
  color: #111;
  background: #fff;
  font: 12px/1.2 sans-serif;
}
.case { margin: 0 0 18px; }
.case-label { margin-bottom: 3px; color: #263238; }
.grid {
  display: grid;
  width: 100px;
  grid-template-columns: max-content max-content;
  grid-template-rows: auto;
  gap: 0;
  align-items: normal;
  justify-items: normal;
  outline: 1px solid #263238;
}
.item {
  margin: 0;
  border: 0;
  padding: 0;
  color: #111;
  background: #dbeafe;
  font: 10px/10px Ahem;
  white-space: nowrap;
  outline: 1px solid #1976d2;
}
.ratio { aspect-ratio: 2 / 1; }
.definite-width { width: 60px; }
.definite-height { height: 30px; }
</style>
<section class="case">
  <div class="case-label">Definite width 60px: preferred ratio vs no-ratio control</div>
  <div id="width-ratio" class="grid">
    <div id="width-ratio-short" class="item">A</div>
    <div id="width-ratio-long" class="item ratio definite-width">AAAA</div>
  </div>
</section>
<section class="case">
  <div class="case-label">Definite width 60px: no-ratio control</div>
  <div id="width-control" class="grid">
    <div id="width-control-short" class="item">A</div>
    <div id="width-control-long" class="item definite-width">AAAA</div>
  </div>
</section>
<section class="case">
  <div class="case-label">Definite height 30px: preferred ratio vs no-ratio control</div>
  <div id="height-ratio" class="grid">
    <div id="height-ratio-short" class="item">A</div>
    <div id="height-ratio-long" class="item ratio definite-height">AAAA</div>
  </div>
</section>
<section class="case">
  <div class="case-label">Definite height 30px: no-ratio control</div>
  <div id="height-control" class="grid">
    <div id="height-control-short" class="item">A</div>
    <div id="height-control-long" class="item definite-height">AAAA</div>
  </div>
</section>
<pre id="observation"></pre>
<script>
window.captureGridAspectRatioAxisTransfer = async () => {
  await document.fonts.ready;
  const boxRect = (rect, origin = { x: 0, y: 0 }) => {
    return {
      x: Number((rect.x - origin.x).toFixed(2)),
      y: Number((rect.y - origin.y).toFixed(2)),
      width: Number(rect.width.toFixed(2)),
      height: Number(rect.height.toFixed(2)),
    };
  };
  const box = (element, origin = { x: 0, y: 0 }) =>
    boxRect(element.getBoundingClientRect(), origin);
  return [...document.querySelectorAll('.grid')].map((grid) => ({
    id: grid.id,
    frame: box(grid),
    columns: getComputedStyle(grid).gridTemplateColumns,
    rows: getComputedStyle(grid).gridTemplateRows,
    items: [...grid.children].map((item) => ({
      id: item.id,
      frame: box(item, grid.getBoundingClientRect()),
      width: getComputedStyle(item).width,
      height: getComputedStyle(item).height,
      aspectRatio: getComputedStyle(item).aspectRatio,
      textRange: (() => {
        const range = document.createRange();
        range.selectNodeContents(item);
        return boxRect(range.getBoundingClientRect(), grid.getBoundingClientRect());
      })(),
      fontReady: document.fonts.check('10px Ahem'),
    })),
  }));
};
window.captureGridAspectRatioAxisTransfer().then((data) => {
  document.querySelector('#observation').textContent = JSON.stringify(data, null, 2);
});
</script>
