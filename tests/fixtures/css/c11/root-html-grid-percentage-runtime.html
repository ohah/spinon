<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Root HTML Grid percentage tracks</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }

      main {
        box-sizing: border-box;
        display: grid;
        width: 240px;
        height: 120px;
        grid-template-columns: 25% 50% 20px;
        grid-template-rows: 25% 50% 10px;
        column-gap: 10px;
        row-gap: 5px;
        background-color: #101820;
      }

      .marker {
        width: 8px;
        height: 6px;
      }

      .marker:nth-child(3n + 1) { background-color: #e5484d; }
      .marker:nth-child(3n + 2) { background-color: #3b82f6; }
      .marker:nth-child(3n) { background-color: #3a8f5b; }
    </style>
  </head>
  <body>
    <main>
      <div class="marker"></div><div class="marker"></div><div class="marker"></div>
      <div class="marker"></div><div class="marker"></div><div class="marker"></div>
      <div class="marker"></div><div class="marker"></div><div class="marker"></div>
    </main>
  </body>
</html>
