<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      #columns {
        display: grid; box-sizing: border-box; width: 120px; height: 90px;
        grid-template-columns: 40px 40px 40px;
        grid-template-rows: 20px 30px 40px;
        grid-auto-rows: 9px; grid-auto-columns: 7px;
        gap: 0; margin: 0; padding: 0; overflow: visible;
      }
      #display-none { display: none; grid-column: 2 / 3; background-color: #f97316; }
      #column-first { grid-column: 2 / 3; background-color: #e5484d; }
      #column-hidden { visibility: hidden; grid-column: 2 / 3; background-color: #398b59; }
      #column-last { grid-column: 2 / 3; background-color: #3578c7; }
      #rows {
        display: grid; box-sizing: border-box; width: 120px; height: 50px;
        grid-template-columns: 40px 80px; grid-template-rows: 20px 30px;
        gap: 0; margin: 0; padding: 0; overflow: visible;
      }
      #row-first { grid-row: 1 / 2; background-color: #f97316; }
      #row-second { grid-row: 1 / 2; background-color: #8f3f71; }
    </style>
  </head>
  <body style="margin:0;padding:0">
    <div id="columns">
      <div id="display-none"></div>
      <div id="column-first"></div>
      <div id="column-hidden"></div>
      <div id="column-last"></div>
    </div>
    <div id="rows">
      <div id="row-first"></div>
      <div id="row-second"></div>
    </div>
  </body>
</html>
