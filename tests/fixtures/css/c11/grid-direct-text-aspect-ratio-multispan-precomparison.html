<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C11.4 direct-text aspect-ratio two-track span precomparison</title>
<style>
@font-face {
  font-family: Ahem;
  src: url("../../resources/c15/Ahem.ttf") format("truetype");
}
body { margin: 16px; color: #15202b; font: 14px/1.4 system-ui, sans-serif; }
h1 { font-size: 18px; }
.case { display: flex; align-items: flex-start; gap: 16px; margin: 10px 0; }
.label { width: 330px; margin: 0; font: 12px/1.4 ui-monospace, monospace; }
.grid {
  display: grid;
  grid-template-columns: max-content max-content;
  grid-template-rows: auto;
  gap: 0;
  width: 100px;
  height: auto;
  align-items: normal;
  justify-items: stretch;
  font-family: Ahem, sans-serif;
  font-size: 10px;
  line-height: 10px;
  font-weight: 400;
  font-style: normal;
}
.item {
  display: block;
  width: auto;
  height: auto;
  min-width: auto;
  max-width: none;
  min-height: auto;
  max-height: none;
  margin: 0;
  padding: 0;
  border: 0;
  white-space: normal;
  overflow: visible;
  font: inherit;
  word-break: normal;
  overflow-wrap: normal;
  background: #39a5db;
}
.ratio { aspect-ratio: 2 / 1; }
</style>
<h1>C11.4 direct-text aspect-ratio two-track span precomparison</h1>
<p id="font-status">Ahem font loading…</p>
<div id="cases"></div>
<script>
const cases = [
  ["span-baseline", true, ""],
  ["span-min-width-45", true, "min-width:45px"],
  ["span-min-width-60", true, "min-width:60px"],
  ["span-min-height-30", true, "min-height:30px"],
  ["span-max-width-30-min-width-0", true, "min-width:0;max-width:30px"],
  ["span-max-height-15-auto-min-control", true, "min-height:0;max-height:15px"],
  ["span-max-height-15-min-width-0", true, "min-width:0;min-height:0;max-height:15px"],
  ["span-max-height-17-75-range", true, "min-width:0;min-height:0;max-height:17.75px"],
  ["span-no-ratio", false, "aspect-ratio:auto"],
];
const host = document.querySelector("#cases");
for (const [id, hasRatio, constraints] of cases) {
  const row = document.createElement("section");
  row.className = "case";
  row.innerHTML = `<p class="label">${id}: ${constraints || (hasRatio ? "ratio only" : "no ratio")}</p><div class="grid" id="${id}"><div class="item${hasRatio ? " ratio" : ""}" style="grid-column:1 / span 2;${constraints}">AAAA</div></div>`;
  host.append(row);
}
window.collectOracle = async () => {
  await document.fonts.ready;
  const rect = (node) => {
    const box = node.getBoundingClientRect();
    return { x: box.x, y: box.y, width: box.width, height: box.height };
  };
  const results = [...document.querySelectorAll(".grid")].map((grid) => {
    const item = grid.querySelector(".item");
    const text = document.createRange();
    text.selectNodeContents(item);
    const style = getComputedStyle(grid);
    const itemStyle = getComputedStyle(item);
    return {
      id: grid.id,
      columns: style.gridTemplateColumns,
      rows: style.gridTemplateRows,
      grid: rect(grid),
      item: rect(item),
      text: rect(text),
      computed: {
        aspectRatio: itemStyle.aspectRatio,
        minWidth: itemStyle.minWidth,
        maxWidth: itemStyle.maxWidth,
        minHeight: itemStyle.minHeight,
        maxHeight: itemStyle.maxHeight,
        gridColumnStart: itemStyle.gridColumnStart,
        gridColumnEnd: itemStyle.gridColumnEnd,
        gridRowStart: itemStyle.gridRowStart,
        gridRowEnd: itemStyle.gridRowEnd,
        font: itemStyle.font,
      },
    };
  });
  return {
    userAgent: navigator.userAgent,
    fontReady: document.fonts.check("10px Ahem"),
    results,
  };
};
document.fonts.ready.then(() => {
  document.querySelector("#font-status").textContent = `Ahem ready: ${document.fonts.check("10px Ahem")}`;
});
</script>
