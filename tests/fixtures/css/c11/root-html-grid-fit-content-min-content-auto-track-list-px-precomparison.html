<!doctype html>
<meta charset="utf-8">
<title>C11.4 Root HTML fit-content px cap precomparison</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { color: #e7edf3; background: #101820; font: 12px/16px sans-serif; }
  #grid {
    display: grid;
    width: 40px;
    height: 100px;
    grid-template-columns: 40px;
    grid-template-rows: 10px;
    grid-auto-flow: row;
    grid-auto-columns: auto;
    grid-auto-rows: fit-content(20px) min-content auto;
    align-content: stretch;
    align-items: normal;
    justify-content: start;
    justify-items: normal;
    gap: 0;
    margin: 0;
    padding: 0;
    border: 0;
    outline: 1px dashed #ffffff;
    overflow: visible;
    background: #17212b;
  }
  #explicit { height: 10px; background: #e5484d; }
  .item { min-height: 0; margin: 0; padding: 0; }
  #item-1 { background: #22c55e; }
  #item-2 { background: #14b8a6; }
  #item-3 { background: #f97316; }
  #item-4 { background: #a855f7; }
  .payload { margin: 0; padding: 0; }
  #payload-1 { height: 34px; background: #3b82f6; }
  #payload-2 { height: 34px; background: #06b6d4; }
  #payload-3 { height: 10px; background: #84cc16; }
  #payload-4 { height: 6px; background: #ec4899; }
</style>
<div id="grid">
  <div id="explicit"></div>
  <div class="item" id="item-1"><div class="payload" id="payload-1"></div></div>
  <div class="item" id="item-2"><div class="payload" id="payload-2"></div></div>
  <div class="item" id="item-3"><div class="payload" id="payload-3"></div></div>
  <div class="item" id="item-4"><div class="payload" id="payload-4"></div></div>
</div>
