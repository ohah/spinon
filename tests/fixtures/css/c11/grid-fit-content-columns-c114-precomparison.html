<!doctype html>
<meta charset="utf-8">
<title>C11.4 fit-content column limits</title>
<style>
  html,
  body {
    margin: 0;
    background: #fff;
    font: 10px/10px monospace;
  }

  main {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    padding: 8px;
  }

  .root {
    display: grid;
    box-sizing: border-box;
    width: var(--root-width, 60px);
    height: 60px;
    grid-template-columns: none;
    grid-template-rows: 60px;
    grid-auto-columns: fit-content(var(--limit));
    grid-auto-flow: column;
    column-gap: 0;
    row-gap: 0;
    align-content: normal;
    justify-content: normal;
    justify-items: stretch;
    align-items: start;
    overflow: visible;
    background: #ddd;
  }

  .item {
    min-width: var(--minimum, 0);
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
  }

  .child {
    width: 100px;
    height: 10px;
    margin: 0;
    padding: 0;
    border: 0;
    background: #f0c;
  }
</style>
<main>
  <section data-scene="column-fit-content-40">
    <div class="root" style="--limit: 40px">
      <div class="item"><div class="child"></div></div>
    </div>
  </section>
  <section data-scene="column-fit-content-30">
    <div class="root" style="--limit: 30px">
      <div class="item"><div class="child"></div></div>
    </div>
  </section>
  <section data-scene="column-fit-content-200">
    <div class="root" style="--limit: 200px; --root-width: 300px">
      <div class="item"><div class="child"></div></div>
    </div>
  </section>
  <section data-scene="column-fit-content-auto-minimum-control">
    <div class="root" style="--limit: 40px; --minimum: auto">
      <div class="item"><div class="child"></div></div>
    </div>
  </section>
</main>
<script>
  const rect = (element) => {
    const { x, y, width, height } = element.getBoundingClientRect();
    return { x, y, width, height };
  };

  window.observation = [...document.querySelectorAll("[data-scene]")].map((scene) => {
    const root = scene.querySelector(".root");
    const item = scene.querySelector(".item");
    const child = scene.querySelector(".child");
    return {
      id: scene.dataset.scene,
      limit: getComputedStyle(root).getPropertyValue("--limit").trim(),
      gridTemplateColumns: getComputedStyle(root).gridTemplateColumns,
      gridTemplateRows: getComputedStyle(root).gridTemplateRows,
      root: rect(root),
      item: rect(item),
      child: rect(child),
      itemMinWidth: getComputedStyle(item).minWidth,
      overflow: getComputedStyle(root).overflow,
    };
  });
</script>
