<!doctype html>
<html lang="en" style="margin:0;padding:0">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>C11 Root HTML explicit Grid placement runtime</title>
  </head>
  <body style="margin:0;padding:0;background-color:#ffffff">
    <main style="display:block;margin:0;padding:0;width:120px">
      <div id="positive" style="display:grid;box-sizing:border-box;width:120px;height:40px;grid-template-columns:40px 80px;grid-template-rows:20px 20px;gap:0;margin:0;padding:0;overflow:visible;background-color:#dbeafe">
        <div style="display:block;box-sizing:border-box;width:100px;height:30px;grid-row:1 / 2;grid-column:2 / 3;background-color:#e5484d"></div>
        <div style="display:block;grid-row:2 / 3;grid-column:1 / 2;background-color:#3a8f5b"></div>
        <div style="display:block;grid-row:1 / 2;grid-column:1 / 2;background-color:#3578c7"></div>
        <div style="display:block;grid-row:2 / 3;grid-column:2 / 3;background-color:#f97316"></div>
      </div>
      <div id="negative-reversed" style="display:grid;box-sizing:border-box;width:120px;height:40px;grid-template-columns:40px 80px;grid-template-rows:20px 20px;gap:0;margin:0;padding:0;overflow:visible;background-color:#dbeafe">
        <div style="display:block;grid-row:-2 / -1;grid-column:-2 / -1;background-color:#8f3f71"></div>
        <div style="display:block;grid-row:2 / 1;grid-column:2 / 1;background-color:#5b6f8f"></div>
      </div>
      <div id="shorthand-span" style="display:grid;box-sizing:border-box;width:120px;height:40px;grid-template-columns:40px 80px;grid-template-rows:20px 20px;gap:0;margin:0;padding:0;overflow:visible;background-color:#dbeafe">
        <div style="display:block;grid-area:1 / 2 / 2 / 3;background-color:#be4bdb"></div>
        <div style="display:block;grid-row:2 / span 1;grid-column:1 / span 1;background-color:#2f9e44"></div>
        <div style="display:block;grid-area:2 / 2 / 3 / 3;grid-row-start:1;background-color:#845ef7"></div>
      </div>
      <div id="overlap" style="display:grid;box-sizing:border-box;width:120px;height:40px;grid-template-columns:40px 80px;grid-template-rows:20px 20px;gap:0;margin:0;padding:0;overflow:visible;background-color:#dbeafe">
        <div style="display:block;grid-row:1 / 2;grid-column:1 / 2;background-color:#c92a2a"></div>
        <div style="display:block;grid-row:1 / 2;grid-column:1 / 2;background-color:#087f5b"></div>
      </div>
      <div id="hidden-control" style="display:grid;box-sizing:border-box;width:120px;height:40px;grid-template-columns:40px 80px;grid-template-rows:20px 20px;gap:0;margin:0;padding:0;overflow:visible;background-color:#dbeafe">
        <div style="display:block;grid-row:1 / 2;grid-column:2 / 3;background-color:#f08c00"></div>
        <div style="display:none;grid-row:30 / 31;grid-column:30 / 31;background-color:#000000"></div>
      </div>
      <div id="self-alignment" style="display:grid;box-sizing:border-box;width:120px;height:40px;grid-template-columns:40px 80px;grid-template-rows:20px 20px;gap:0;margin:0;padding:0;overflow:visible;background-color:#dbeafe">
        <div style="display:block;box-sizing:border-box;width:16px;height:10px;grid-row:1 / 2;grid-column:1 / 2;align-self:end;justify-self:end;background-color:#6741d9"></div>
      </div>
    </main>
  </body>
</html>
