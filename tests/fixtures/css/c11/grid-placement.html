<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spinon C11.2.1 명시 Grid 배치 기준 장면</title>
  <style>
    html, body { margin: 0; padding: 0; }
    body { direction: ltr; writing-mode: horizontal-tb; color-scheme: light; }
    *, *::before, *::after { box-sizing: content-box; }
    #stage { position: absolute; top: 0; left: 0; width: 360px; height: 800px; }
    .scene { position: absolute; top: 0; left: 0; display: none; width: 360px; height: 800px; }
    .scene.active { display: block; }
    .scene-root { position: absolute; top: 0; left: 0; width: 360px; height: 800px; margin: 0; padding: 0; border: 0; direction: ltr; writing-mode: horizontal-tb; }
    [data-node] { margin: 0; padding: 0; border: 0; box-sizing: content-box; }
    .surface { background-color: #edf1f7; }
    .blue { background-color: #2866f6; }
    .red { background-color: #e5484d; }
    .green { background-color: #19a974; }
    .yellow { background-color: #ffc857; }
    .purple { background-color: #8758ff; }
    .cyan { background-color: #0ea5e9; }
    .orange { background-color: #f97316; }
    .pink { background-color: #ec4899; }
  </style>
</head>
<body>
  <div id="stage">
    <section class="scene" data-scene="numeric-lines">
      <div class="scene-root" id="c1121-numeric-root">
        <div id="c1121-numeric-grid" data-node class="surface" style="display:grid;width:250px;height:85px;grid-template-columns:80px 80px 80px;grid-template-rows:40px 40px;column-gap:5px;row-gap:5px">
          <div id="c1121-positive-lines" data-node class="blue" style="grid-column-start:1;grid-column-end:3;grid-row-start:1;grid-row-end:2"></div>
          <div id="c1121-negative-lines" data-node class="red" style="grid-column-start:-2;grid-column-end:-1;grid-row-start:-2;grid-row-end:-1"></div>
        </div>
      </div>
    </section>
    <section class="scene" data-scene="positive-spans">
      <div class="scene-root" id="c1121-span-root">
        <div id="c1121-span-grid" data-node class="surface" style="display:grid;width:250px;height:85px;grid-template-columns:80px 80px 80px;grid-template-rows:40px 40px;column-gap:5px;row-gap:5px">
          <div id="c1121-span-from-start" data-node class="blue" style="grid-column-start:1;grid-column-end:span 2;grid-row-start:1;grid-row-end:span 2"></div>
          <div id="c1121-span-from-end" data-node class="red" style="grid-column-start:span 2;grid-column-end:4;grid-row-start:span 1;grid-row-end:3"></div>
        </div>
      </div>
    </section>
    <section class="scene" data-scene="reversed-lines">
      <div class="scene-root" id="c1121-reverse-root">
        <div id="c1121-reverse-grid" data-node class="surface" style="display:grid;width:250px;height:85px;grid-template-columns:80px 80px 80px;grid-template-rows:40px 40px;column-gap:5px;row-gap:5px">
          <div id="c1121-reversed-item" data-node class="purple" style="grid-column-start:3;grid-column-end:1;grid-row-start:2;grid-row-end:1"></div>
        </div>
      </div>
    </section>
    <section class="scene" data-scene="shorthand-cascade">
      <div class="scene-root" id="c1121-shorthand-root">
        <div id="c1121-shorthand-grid" data-node class="surface" style="display:grid;width:250px;height:85px;grid-template-columns:80px 80px 80px;grid-template-rows:40px 40px;column-gap:5px;row-gap:5px">
          <div id="c1121-grid-area-item" data-node class="blue" style="grid-area:1 / 1 / 3 / 3"></div>
          <div id="c1121-cascade-item" data-node class="red" style="grid-area:1 / 2 / 2 / 4;grid-column-start:1"></div>
        </div>
      </div>
    </section>
    <section class="scene" data-scene="overlap-source-order">
      <div class="scene-root" id="c1121-overlap-root">
        <div id="c1121-overlap-grid" data-node class="surface" style="display:grid;width:250px;height:85px;grid-template-columns:80px 80px 80px;grid-template-rows:40px 40px;column-gap:5px;row-gap:5px">
          <div id="c1121-overlap-first" data-node class="blue" style="grid-column:1 / 3;grid-row:1 / 3"></div>
          <div id="c1121-overlap-second" data-node class="red" style="grid-column:1 / 3;grid-row:1 / 3"></div>
        </div>
      </div>
    </section>
    <section class="scene" data-scene="nested-placement-modes">
      <div class="scene-root" id="c1121-nested-root">
        <div id="c1121-nested-outer" data-node class="surface" style="display:grid;width:250px;height:60px;grid-template-columns:120px 120px;grid-template-rows:60px;column-gap:10px">
          <div id="c1121-nested-auto-grid" data-node class="blue" style="display:grid;width:120px;height:60px;grid-template-columns:55px 55px;grid-template-rows:60px;column-gap:10px;grid-column:1 / 2;grid-row:1 / 2">
            <div id="c1121-nested-auto-a" data-node class="green" style="width:20px;height:20px"></div>
            <div id="c1121-nested-auto-b" data-node class="yellow" style="width:20px;height:20px"></div>
          </div>
          <div id="c1121-nested-explicit-grid" data-node class="red" style="display:grid;width:120px;height:60px;grid-template-columns:55px 55px;grid-template-rows:60px;column-gap:10px;grid-column:2 / 3;grid-row:1 / 2">
            <div id="c1121-nested-explicit-a" data-node class="purple" style="grid-column:2 / 3;grid-row:1 / 2"></div>
            <div id="c1121-nested-explicit-b" data-node class="cyan" style="grid-column:1 / 2;grid-row:1 / 2"></div>
          </div>
        </div>
      </div>
    </section>
    <section class="scene" data-scene="deferred-implicit-track">
      <div class="scene-root" id="c1121-implicit-root">
        <div id="c1121-implicit-grid" data-node class="surface" style="display:grid;width:160px;height:40px;grid-template-columns:80px 80px;grid-template-rows:40px">
          <div id="c1121-implicit-item" data-node class="orange" style="grid-column:4 / 5;grid-row:1 / 2"></div>
        </div>
      </div>
    </section>
    <section class="scene" data-scene="deferred-named-line">
      <div class="scene-root" id="c1121-named-root">
        <div id="c1121-named-grid" data-node class="surface" style="display:grid;width:160px;height:40px;grid-template-columns:[left] 80px [middle] 80px [right];grid-template-rows:40px">
          <div id="c1121-named-item" data-node class="pink" style="grid-column:left / middle;grid-row:1 / 2"></div>
        </div>
      </div>
    </section>
    <section class="scene" data-scene="deferred-mixed-auto-explicit">
      <div class="scene-root" id="c1121-mixed-root">
        <div id="c1121-mixed-grid" data-node class="surface" style="display:grid;width:160px;height:80px;grid-template-columns:80px 80px;grid-template-rows:40px 40px">
          <div id="c1121-mixed-definite" data-node class="blue" style="grid-column:2 / 3;grid-row:2 / 3"></div>
          <div id="c1121-mixed-auto" data-node class="red"></div>
        </div>
      </div>
    </section>
    <section class="scene" data-scene="deferred-equal-lines">
      <div class="scene-root" id="c1121-equal-root">
        <div id="c1121-equal-grid" data-node class="surface" style="display:grid;width:160px;height:80px;grid-template-columns:80px 80px;grid-template-rows:40px 40px">
          <div id="c1121-equal-item" data-node class="yellow" style="grid-column:2 / 2;grid-row:1 / 2"></div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
