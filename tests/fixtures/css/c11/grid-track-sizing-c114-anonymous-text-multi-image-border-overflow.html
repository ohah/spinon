<!doctype html>
<meta charset="utf-8">
<title>Spinon C11.4 anonymous text and multi-image border overflow precomparison</title>
<style>
  @font-face { font-family: Ahem; src: url("../../resources/c15/Ahem.ttf") format("truetype"); font-weight: 400; font-style: normal; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 520px; background: #fff; }
  body { font: 12px/16px system-ui, sans-serif; color: #111; }
  .case { min-height: 202px; border-bottom: 1px solid #ccc; padding: 4px; }
  .label { display: block; margin-bottom: 2px; }
  .grid { display: grid; width: 40px; height: 184px; border: 2px solid #f0c674; grid-template-columns: repeat(4, min-content); grid-template-rows: repeat(3, 60px); gap: 0; align-items: start; align-content: start; justify-items: start; justify-content: start; overflow: visible; font: 10px/10px Ahem, sans-serif; white-space: normal; color: #e5484d; background: #101820; }
  .grid img { width: auto; margin: 0; padding: 0; border: 0; }
  #result { display: none; }
</style>
<body>
  <section class="case" data-case="anonymous-runs-two-images-forward">
    <span class="label">two anonymous Ahem runs separated by two placed images; 22px item overflow past the bordered grid</span>
    <div class="grid" id="anonymous-runs-two-images-forward">XX<img id="image-a-forward" src="../../resources/c14-1-png-basic.png" alt="" style="height:16px;grid-column:1 / span 2;grid-row:1">XX<img id="image-b-forward" src="../../resources/c14-1-png-basic.png" alt="" style="height:32px;grid-column:2 / span 2;grid-row:2"></div>
  </section>
  <section class="case" data-case="two-images-anonymous-runs-reversed">
    <span class="label">same two anonymous runs and placed images in reversed direct-child order</span>
    <div class="grid" id="two-images-anonymous-runs-reversed"><img id="image-b-reversed" src="../../resources/c14-1-png-basic.png" alt="" style="height:32px;grid-column:2 / span 2;grid-row:2">XX<img id="image-a-reversed" src="../../resources/c14-1-png-basic.png" alt="" style="height:16px;grid-column:1 / span 2;grid-row:1">XX</div>
  </section>
  <pre id="result"></pre>
  <script>
    const rect = (node) => {
      const value = node.getBoundingClientRect();
      return {x:value.x, y:value.y, width:value.width, height:value.height};
    };
    const textSegments = (element) => {
      const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
      const segments = [];
      for (let node = walker.nextNode(); node; node = walker.nextNode()) {
        const range = document.createRange();
        range.selectNodeContents(node);
        segments.push({text:node.data, rects:Array.from(range.getClientRects(), (value) => ({x:value.x,y:value.y,width:value.width,height:value.height}))});
      }
      return segments;
    };
    Promise.all([
      document.fonts.ready,
      ...Array.from(document.querySelectorAll('img'), (image) => image.decode()),
    ]).then(async () => {
      const browserVersion = await navigator.userAgentData.getHighEntropyValues(['uaFullVersion']);
      const cases = Array.from(document.querySelectorAll('.case'), (section) => {
        const grid = section.querySelector('.grid');
        const gridFrame = rect(grid);
        const childFrames = Array.from(grid.childNodes, (node) => {
          if (node.nodeType === Node.TEXT_NODE) {
            const range = document.createRange();
            range.selectNodeContents(node);
            return {kind:'text', text:node.data, rects:Array.from(range.getClientRects(), (value) => ({x:value.x,y:value.y,width:value.width,height:value.height}))};
          }
          return {kind:'element', id:node.id, tag:node.localName, display:getComputedStyle(node).display, gridColumn:getComputedStyle(node).gridColumn, gridRow:getComputedStyle(node).gridRow, naturalSize:{width:node.naturalWidth,height:node.naturalHeight}, frame:rect(node)};
        });
        const rightmostImage = Math.max(...Array.from(grid.children, (child) => rect(child).x + rect(child).width));
        const rightmostText = Math.max(...childFrames.filter((child) => child.kind === 'text').flatMap((child) => child.rects.map((value) => value.x + value.width)));
        return {
          id:section.dataset.case,
          directChildren:childFrames.map((child) => child.kind === 'text' ? {kind:child.kind,text:child.text} : {kind:child.kind,id:child.id}),
          columns:getComputedStyle(grid).gridTemplateColumns,
          rows:getComputedStyle(grid).gridTemplateRows,
          grid:gridFrame,
          gridContentBox:{x:gridFrame.x + parseFloat(getComputedStyle(grid).borderLeftWidth), width:grid.clientWidth, height:grid.clientHeight},
          rightmostImage,
          rightmostTextFragment:rightmostText,
          imageOverflowRight:rightmostImage - (gridFrame.x + gridFrame.width),
          textFragmentOverflowRight:rightmostText - (gridFrame.x + gridFrame.width),
          border:{top:getComputedStyle(grid).borderTopWidth,right:getComputedStyle(grid).borderRightWidth,bottom:getComputedStyle(grid).borderBottomWidth,left:getComputedStyle(grid).borderLeftWidth,color:getComputedStyle(grid).borderTopColor,style:getComputedStyle(grid).borderTopStyle},
          overflowVisible:getComputedStyle(grid).overflow,
          text:childFrames.filter((child) => child.kind === 'text'),
          elements:childFrames.filter((child) => child.kind === 'element'),
        };
      });
      window.__C114_ANONYMOUS_MULTI_IMAGE_BORDER_OVERFLOW__ = {
        userAgent:navigator.userAgent,
        userAgentFullVersion:browserVersion.uaFullVersion,
        platform:navigator.platform,
        viewport:{width:innerWidth,height:innerHeight},
        devicePixelRatio,
        ahemReady:document.fonts.check('10px Ahem'),
        imageDecodeComplete:Array.from(document.querySelectorAll('img'), (image) => image.complete && image.naturalWidth === 24 && image.naturalHeight === 16).every(Boolean),
        intrinsicWidths:{anonymousText:minContentWidth('XX')},
        cases,
      };
      document.querySelector('#result').textContent = JSON.stringify(window.__C114_ANONYMOUS_MULTI_IMAGE_BORDER_OVERFLOW__, null, 2);
    });
    function minContentWidth(text) {
      const probe = document.createElement('div');
      probe.textContent = text;
      probe.style.cssText = 'position:fixed;left:-10000px;top:0;width:min-content;height:auto;margin:0;padding:0;border:0;font:10px/10px Ahem,sans-serif;white-space:normal;overflow-wrap:normal;word-break:normal;';
      document.body.appendChild(probe);
      const width = probe.getBoundingClientRect().width;
      probe.remove();
      return width;
    }
  </script>
</body>
