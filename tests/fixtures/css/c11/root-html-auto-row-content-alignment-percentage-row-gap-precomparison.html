<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>C11.4 implicit auto-row alignment with percentage row gap</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #fff;
      }

      #grid {
        position: absolute;
        left: 100px;
        top: 100px;
        display: grid;
        box-sizing: border-box;
        width: 40px;
        height: 40px;
        grid-template-columns: 40px;
        grid-template-rows: 10px;
        grid-auto-rows: auto;
        grid-auto-flow: row;
        align-content: center;
        align-items: normal;
        row-gap: 120%;
        column-gap: 0;
        overflow: visible;
        background-color: #e9edf2;
      }

      #fixed {
        box-sizing: border-box;
        width: 40px;
        height: 10px;
        background-color: #303944;
      }

      .text {
        box-sizing: border-box;
        font-family: monospace;
        font-size: 10px;
        font-weight: 400;
        font-style: normal;
        line-height: 10px;
        white-space: normal;
        background-color: #2476d2;
      }

      #label {
        position: absolute;
        left: 100px;
        top: 76px;
        color: #111;
        font: 12px/16px monospace;
      }
    </style>
  </head>
  <body>
    <div id="label">row-gap: 120%; align-content: center</div>
    <div id="grid"><div id="fixed"></div><div id="text-a" class="text">A</div><div id="text-b" class="text">B</div></div>
    <script>
      window.captureAlignment = () => {
        const grid = document.querySelector("#grid");
        const root = grid.getBoundingClientRect();
        const style = getComputedStyle(grid);
        return {
          specified: grid.style.rowGap,
          computed: style.rowGap,
          alignContent: style.alignContent,
          root: [root.left, root.top, root.width, root.height],
          usedRows: style.gridTemplateRows.split(" ").map(Number.parseFloat),
          itemRects: Array.from(grid.children, (item) => {
            const rect = item.getBoundingClientRect();
            return [rect.left - root.left, rect.top - root.top, rect.width, rect.height];
          }),
        };
      };

      window.runPercentageGapAlignmentMatrix = () => {
        const grid = document.querySelector("#grid");
        const percentages = [0, 6.25, 12.5, 18.75, 20, 100, 120];
        const alignments = [
          "normal", "stretch", "start", "flex-start", "end", "flex-end", "center",
          "space-between", "space-around", "space-evenly",
        ];
        return percentages.map((percentage) => {
          grid.style.rowGap = `${percentage}%`;
          return {
            percentage,
            cases: alignments.map((alignment) => {
              grid.style.alignContent = alignment;
              return captureAlignment();
            }),
          };
        });
      };
    </script>
  </body>
</html>
