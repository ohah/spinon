<!doctype html><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:12px sans-serif}.grid{display:grid;width:120px;height:80px;margin:0 0 12px;padding:0;border:0;gap:0;align-content:start;justify-content:start;grid-auto-rows:7px;grid-auto-columns:9px;background:#101820}.item{margin:0;padding:0;border:0;min-width:0;min-height:0;background:#3e63dd}.wide{width:20px}.tall{height:20px}
</style>
<div id="none" class="grid" style="grid-template-areas:'a b' 'c d'"><div id="none-a" class="item wide" style="grid-area:a;height:10px"></div><div id="none-b" class="item" style="grid-area:b;width:30px;height:10px"></div><div id="none-c" class="item wide" style="grid-area:c;height:20px"></div><div id="none-d" class="item" style="grid-area:d;width:30px;height:20px"></div></div>
<div id="short-row" class="grid" style="grid-template-rows:12px;grid-template-areas:'a b' 'c d'"><div id="short-row-a" class="item wide" style="grid-area:a;height:10px"></div><div id="short-row-b" class="item" style="grid-area:b;width:30px;height:10px"></div><div id="short-row-c" class="item wide" style="grid-area:c;height:20px"></div><div id="short-row-d" class="item" style="grid-area:d;width:30px;height:20px"></div></div>
<div id="short-col" class="grid" style="grid-template-columns:13px;grid-template-areas:'a b' 'c d'"><div id="short-col-a" class="item wide" style="grid-area:a;height:10px"></div><div id="short-col-b" class="item" style="grid-area:b;width:30px;height:10px"></div><div id="short-col-c" class="item wide" style="grid-area:c;height:20px"></div><div id="short-col-d" class="item" style="grid-area:d;width:30px;height:20px"></div></div>
<div id="auto" class="grid" style="grid-auto-rows:auto;grid-auto-columns:auto;grid-template-areas:'a b' 'c d'"><div id="auto-a" class="item wide" style="grid-area:a;height:10px"></div><div id="auto-b" class="item" style="grid-area:b;width:30px;height:10px"></div><div id="auto-c" class="item wide" style="grid-area:c;height:20px"></div><div id="auto-d" class="item" style="grid-area:d;width:30px;height:20px"></div></div>
<div id="long" class="grid" style="grid-template-rows:5px 6px 7px;grid-template-columns:30px 40px 50px;grid-template-areas:'a b' 'c d'"><div id="long-a" class="item" style="grid-area:a;width:10px;height:3px"></div><div id="long-b" class="item" style="grid-area:b;width:10px;height:3px"></div><div id="long-c" class="item" style="grid-area:c;width:10px;height:4px"></div><div id="long-d" class="item" style="grid-area:d;width:10px;height:4px"></div></div>
<div id="width-mismatch" class="grid" style="width:160px;height:120px;grid-auto-rows:auto;grid-auto-columns:auto;grid-template-rows:60px 60px;grid-template-columns:40px 120px;grid-template-areas:'a b c' 'd e f'"><div id="width-mismatch-last-cell" class="item" style="grid-area:c"></div></div>
<script>window.report=()=>Object.fromEntries([...document.querySelectorAll('.grid')].map(g=>{const root=g.getBoundingClientRect();return[g.id,{rows:getComputedStyle(g).gridTemplateRows,columns:getComputedStyle(g).gridTemplateColumns,areas:getComputedStyle(g).gridTemplateAreas,root:[root.width,root.height],children:[...g.children].map(e=>{const r=e.getBoundingClientRect();return[e.id,r.x-root.x,r.y-root.y,r.width,r.height]})}]}));</script>
