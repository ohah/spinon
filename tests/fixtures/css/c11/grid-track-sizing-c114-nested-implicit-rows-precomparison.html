<!doctype html>
<meta charset="utf-8">
<title>C11.4 nested Grid positive implicit rows precomparison</title>
<style>
  * { box-sizing: content-box; }
  body { margin: 20px; font: 12px sans-serif; }
  .scene { display: grid; grid-template-columns: 24px; grid-template-rows: min-content min-content; row-gap: 4px; width: 24px; outline: 1px solid #111; margin: 12px 0; }
  .nested { display: grid; grid-template-columns: 24px; grid-template-rows: min-content; grid-auto-rows: min-content max-content; row-gap: 4px; width: 24px; align-content: start; justify-content: start; align-self: start; }
  .explicit { grid-row: 1 / 2; width: 24px; height: 8px; background: #2a6; }
  .implicit-min { grid-row: 2 / 3; width: 4px; height: 8px; background: #e90; }
  .implicit-max { grid-row: 3 / 4; display: block; }
  #span-two-nested { grid-row: 1 / 3; }
  #one-row-nested { grid-row: 1 / 2; }
  .scene-label { font: 12px sans-serif; margin-bottom: 2px; }
</style>
<div class="scene-label">span two outer rows</div>
<div id="span-two" class="scene">
  <div id="span-two-nested" class="nested">
    <div id="span-two-explicit" class="explicit"></div>
    <div id="span-two-implicit-min" class="implicit-min"></div>
    <img id="span-two-implicit-max" class="implicit-max" src="../../resources/c14-1-png-basic.png" alt="">
  </div>
</div>
<div class="scene-label">one outer row</div>
<div id="one-row" class="scene">
  <div id="one-row-nested" class="nested">
    <div id="one-row-explicit" class="explicit"></div>
    <div id="one-row-implicit-min" class="implicit-min"></div>
    <img id="one-row-implicit-max" class="implicit-max" src="../../resources/c14-1-png-basic.png" alt="">
  </div>
</div>
<script>
  const box = (id) => {
    const { x, y, width, height } = document.getElementById(id).getBoundingClientRect();
    const snap = (value) => Math.round(value * 64) / 64;
    return { x: snap(x), y: snap(y), width: snap(width), height: snap(height) };
  };
  const scene = (id) => {
    const root = document.getElementById(id);
    const nested = root.firstElementChild;
    return {
      root: box(id),
      outerRows: getComputedStyle(root).gridTemplateRows,
      nested: box(nested.id),
      innerRows: getComputedStyle(nested).gridTemplateRows,
      autoRows: getComputedStyle(nested).gridAutoRows,
      children: [...nested.children].map((node) => ({ id: node.id, box: box(node.id) }))
    };
  };
  Promise.all([...document.images].map((image) => image.decode())).then(() => {
    window.oracle = {
      userAgent: navigator.userAgent,
      viewport: { width: innerWidth, height: innerHeight, dpr: devicePixelRatio },
      images: [...document.images].map((image) => ({ complete: image.complete, naturalWidth: image.naturalWidth, naturalHeight: image.naturalHeight })),
      scenes: { spanTwo: scene('span-two'), oneRow: scene('one-row') }
    };
    document.documentElement.dataset.ready = 'true';
  });
</script>
