<!doctype html>
<meta charset="utf-8">
<title>C11.4 cyclic minmax image multi-span precomparison</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; color: #fff; background: #20252b; font: 14px system-ui; }
  .case { display: inline-block; vertical-align: top; margin: 0 16px 16px 0; }
  .root { display: grid; grid-template-columns: repeat(3, minmax(calc(10% + 2px), max-content)); grid-template-rows: repeat(2, minmax(calc(10% + 2px), max-content)); gap: 2px; box-sizing: content-box; border: 2px solid #f0c674; background: #101820; align-content: start; justify-content: start; }
  .intrinsic { width: min-content; height: min-content; }
  .definite { width: 80px; height: 80px; }
  img { display: block; width: auto; object-fit: fill; justify-self: start; align-self: start; background: #e5484d; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
<div id="cases"></div>
<pre id="result">waiting</pre>
<script>
const source = '../../resources/c14-1-png-basic.png';
const definitions = [
  ['intrinsic-forward', 'intrinsic', ['A','B','C']],
  ['intrinsic-reverse', 'intrinsic', ['C','B','A']],
  ['definite-forward', 'definite', ['A','B','C']],
  ['definite-reverse', 'definite', ['C','B','A']],
];
const items = {
  A: {height:8, col:'1 / 3', row:'1 / 3'},
  B: {height:12, col:'2 / 4', row:'1 / 3'},
  C: {height:16, col:'1 / 4', row:'1 / 3'},
};
const cases = document.querySelector('#cases');
for (const [id, kind, order] of definitions) {
  const wrap=document.createElement('section'); wrap.className='case'; wrap.id=id;
  const label=document.createElement('div'); label.textContent=id; wrap.append(label);
  const root=document.createElement('div'); root.className=`root ${kind}`; root.id=`${id}-root`;
  for(const key of order){const d=items[key];const img=document.createElement('img');img.id=`${id}-${key}`;img.alt=key;img.src=source;img.style.height=`${d.height}px`;img.style.gridColumn=d.col;img.style.gridRow=d.row;root.append(img)}
  wrap.append(root); cases.append(wrap);
}
(async()=>{await Promise.all([...document.images].map(i=>i.decode())); const rows=definitions.map(([id])=>{const root=document.querySelector(`#${id}-root`);const r=root.getBoundingClientRect();const cs=getComputedStyle(root);return{id,width:r.width,height:r.height,columns:cs.gridTemplateColumns,rows:cs.gridTemplateRows,items:[...root.children].map(i=>{const b=i.getBoundingClientRect();const c=getComputedStyle(i);return{id:i.id,width:b.width,height:b.height,x:b.x,y:b.y,gridColumn:c.gridColumn,gridRow:c.gridRow}})}});document.querySelector('#result').textContent=JSON.stringify({userAgent:navigator.userAgent,dpr:devicePixelRatio,viewport:{width:innerWidth,height:innerHeight},rows},null,2)})().catch(e=>document.querySelector('#result').textContent=String(e));
</script>
