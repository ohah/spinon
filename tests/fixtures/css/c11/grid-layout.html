<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spinon C11 Grid 기준 장면</title>
  <style>
    html, body { margin: 0; padding: 0; }
    body { direction: ltr; writing-mode: horizontal-tb; color-scheme: light; }
    *, *::before, *::after { box-sizing: content-box; }
    #stage { position: absolute; top: 0; left: 0; width: 360px; height: 800px; }
    .scene { position: absolute; top: 0; left: 0; display: none; width: 360px; height: 800px; }
    .scene.active { display: block; }
    .scene-root { position: absolute; top: 0; left: 0; width: 360px; height: 800px; margin: 0; padding: 0; border: 0; direction: ltr; writing-mode: horizontal-tb; }
    [data-node] { margin: 0; padding: 0; border: 0; box-sizing: content-box; }
    .track-surface { background-color: #edf1f7; }
    .blue { background-color: #2866f6; }
    .red { background-color: #e5484d; }
    .green { background-color: #19a974; }
    .yellow { background-color: #ffc857; }
    .purple { background-color: #8758ff; }
    .cyan { background-color: #0ea5e9; }
    .orange { background-color: #f97316; }
    .pink { background-color: #ec4899; }
  </style>
</head>
<body>
  <div id="stage">
    <section class="scene" data-scene="fixed-tracks-gap">
      <div class="scene-root" id="c11-fixed-root">
        <div id="c11-fixed-grid" data-node style="display:grid;width:320px;height:130px;grid-template-columns:80px 100px 120px;grid-template-rows:50px 70px;column-gap:8px;row-gap:6px" class="track-surface">
          <div id="c11-fixed-a" data-node class="blue" style="width:40px;height:20px"></div>
          <div id="c11-fixed-b" data-node class="red" style="width:50px;height:24px"></div>
          <div id="c11-fixed-c" data-node class="green" style="width:60px;height:26px"></div>
          <div id="c11-fixed-d" data-node class="yellow" style="width:30px;height:18px"></div>
        </div>
      </div>
    </section>
    <section class="scene" data-scene="percentage-tracks">
      <div class="scene-root" id="c11-percent-root">
        <div id="c11-percent-grid" data-node style="display:grid;width:320px;height:90px;grid-template-columns:25% 75%;grid-template-rows:90px" class="track-surface">
          <div id="c11-percent-a" data-node class="blue" style="width:30px;height:20px"></div>
          <div id="c11-percent-b" data-node class="red" style="width:30px;height:20px"></div>
        </div>
      </div>
    </section>
    <section class="scene" data-scene="fractional-tracks-gap">
      <div class="scene-root" id="c11-fr-root">
        <div id="c11-fr-grid" data-node style="display:grid;width:320px;height:90px;grid-template-columns:1fr 2fr;grid-template-rows:90px;column-gap:12px" class="track-surface">
          <div id="c11-fr-a" data-node class="blue" style="width:30px;height:20px"></div>
          <div id="c11-fr-b" data-node class="red" style="width:30px;height:20px"></div>
        </div>
      </div>
    </section>
    <section class="scene" data-scene="mixed-fixed-percent-fr">
      <div class="scene-root" id="c11-mixed-root">
        <div id="c11-mixed-grid" data-node style="display:grid;width:360px;height:90px;grid-template-columns:80px 25% 1fr;grid-template-rows:90px;column-gap:12px" class="track-surface">
          <div id="c11-mixed-a" data-node class="blue" style="width:30px;height:20px"></div>
          <div id="c11-mixed-b" data-node class="red" style="width:30px;height:20px"></div>
          <div id="c11-mixed-c" data-node class="green" style="width:30px;height:20px"></div>
        </div>
      </div>
    </section>
    <section class="scene" data-scene="row-auto-placement">
      <div class="scene-root" id="c11-auto-root">
        <div id="c11-auto-grid" data-node style="display:grid;width:210px;height:140px;grid-template-columns:100px 100px;grid-template-rows:40px 40px 40px;column-gap:10px;row-gap:10px" class="track-surface">
          <div id="c11-auto-a" data-node class="blue" style="width:20px;height:20px"></div>
          <div id="c11-auto-b" data-node class="red" style="width:20px;height:20px"></div>
          <div id="c11-auto-c" data-node class="green" style="width:20px;height:20px"></div>
          <div id="c11-auto-d" data-node class="yellow" style="width:20px;height:20px"></div>
          <div id="c11-auto-e" data-node class="purple" style="width:20px;height:20px"></div>
        </div>
      </div>
    </section>
    <section class="scene" data-scene="empty-grid">
      <div class="scene-root" id="c11-empty-root">
        <div id="c11-empty-grid" data-node style="display:grid;width:320px;height:90px;grid-template-columns:80px 100px 120px;grid-template-rows:90px;column-gap:10px" class="track-surface"></div>
      </div>
    </section>
    <section class="scene" data-scene="single-item-grid">
      <div class="scene-root" id="c11-single-root">
        <div id="c11-single-grid" data-node style="display:grid;width:320px;height:90px;grid-template-columns:60px 80px 100px;grid-template-rows:90px;column-gap:40px" class="track-surface">
          <div id="c11-single-item" data-node class="blue" style="width:30px;height:20px"></div>
        </div>
      </div>
    </section>
    <section class="scene" data-scene="grid-under-block">
      <div class="scene-root" id="c11-block-root">
        <div id="c11-block-parent" data-node style="display:block;width:300px;height:100px;margin:10px 0 0 10px;background-color:#edf1f7">
          <div id="c11-block-grid" data-node style="display:grid;width:200px;height:60px;margin-left:15px;grid-template-columns:90px 100px;grid-template-rows:60px;column-gap:10px" class="track-surface">
            <div id="c11-block-a" data-node class="blue" style="width:20px;height:20px"></div>
            <div id="c11-block-b" data-node class="red" style="width:20px;height:20px"></div>
          </div>
        </div>
      </div>
    </section>
    <section class="scene" data-scene="grid-under-flex">
      <div class="scene-root" id="c11-flex-root">
        <div id="c11-flex-parent" data-node style="display:flex;flex-direction:row;width:320px;height:80px;column-gap:10px;align-items:flex-start">
          <div id="c11-flex-grid-a" data-node style="display:grid;width:150px;height:60px;grid-template-columns:70px 70px;grid-template-rows:60px;column-gap:10px" class="track-surface">
            <div id="c11-flex-a1" data-node class="blue" style="width:20px;height:20px"></div>
            <div id="c11-flex-a2" data-node class="red" style="width:20px;height:20px"></div>
          </div>
          <div id="c11-flex-grid-b" data-node style="display:grid;width:150px;height:60px;grid-template-columns:70px 70px;grid-template-rows:60px;column-gap:10px" class="track-surface">
            <div id="c11-flex-b1" data-node class="green" style="width:20px;height:20px"></div>
            <div id="c11-flex-b2" data-node class="yellow" style="width:20px;height:20px"></div>
          </div>
        </div>
      </div>
    </section>
    <section class="scene" data-scene="flex-under-grid">
      <div class="scene-root" id="c11-grid-flex-root">
        <div id="c11-grid-flex-parent" data-node style="display:grid;width:320px;height:80px;grid-template-columns:160px 150px;grid-template-rows:80px;column-gap:10px" class="track-surface">
          <div id="c11-grid-flex-child" data-node style="display:flex;flex-direction:row;width:160px;height:60px;column-gap:10px;align-items:flex-start">
            <div id="c11-grid-flex-a" data-node class="blue" style="width:30px;height:20px"></div>
            <div id="c11-grid-flex-b" data-node class="red" style="width:40px;height:25px"></div>
          </div>
          <div id="c11-grid-block-child" data-node class="green" style="width:20px;height:20px"></div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
