<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Root HTML intrinsic min-content tracks with named areas</title>
    <style>
      html, body { margin: 0; padding: 0; }
      #root {
        box-sizing: border-box;
        display: grid;
        width: 240px;
        height: 120px;
        margin: 0;
        padding: 0;
        gap: 0;
        grid-template-columns: min-content 1fr;
        grid-template-rows: max-content 1fr;
        grid-template-areas: "wide tail" "foot foot";
        font-family: monospace;
        font-size: 10px;
        line-height: 11px;
        white-space: normal;
      }
      .item { box-sizing: border-box; min-width: 0; min-height: 0; margin: 0; padding: 0; }
      #wide { grid-area: wide; background-color: #e5484d; }
      #tail { grid-area: tail; background-color: #3a8f5b; }
      #foot { grid-area: foot; background-color: #0a84ff; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="wide" class="item">ab cd</div>
      <div id="tail" class="item">efghij</div>
      <div id="foot" class="item">kl mn</div>
    </div>
  </body>
</html>
