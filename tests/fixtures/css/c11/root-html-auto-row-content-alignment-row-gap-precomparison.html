<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>C11.4 implicit auto-row content alignment with row gap</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }

      #grid {
        display: grid;
        box-sizing: border-box;
        width: 40px;
        height: 40px;
        grid-template-columns: 40px;
        grid-template-rows: 10px;
        grid-auto-rows: auto;
        grid-auto-flow: row;
        align-content: start;
        align-items: normal;
        row-gap: 2px;
        column-gap: 0;
        overflow: visible;
        background-color: #e9edf2;
      }

      #fixed {
        box-sizing: border-box;
        width: 40px;
        height: 10px;
        background-color: #d8dde3;
      }

      .text {
        box-sizing: border-box;
        font-family: monospace;
        font-size: 10px;
        font-weight: 400;
        font-style: normal;
        line-height: 10px;
        white-space: normal;
        background-color: #5b9ff5;
      }
    </style>
  </head>
  <body>
    <div id="grid"><div id="fixed"></div><div id="text-a" class="text">A</div><div id="text-b" class="text">B</div></div>
    <script>
      window.captureAlignment = () => {
        const grid = document.querySelector("#grid");
        const root = grid.getBoundingClientRect();
        const style = getComputedStyle(grid);
        return {
          specified: style.alignContent,
          computed: style.alignContent,
          usedRows: style.gridTemplateRows.split(" ").map(Number.parseFloat),
          rowGap: Number.parseFloat(style.rowGap),
          itemRects: Array.from(grid.children, (item) => {
            const rect = item.getBoundingClientRect();
            return [rect.left - root.left, rect.top - root.top, rect.width, rect.height];
          }),
        };
      };
      window.runGapAlignmentMatrix = () => {
        const grid = document.querySelector("#grid");
        const alignments = ["normal", "stretch", "start", "flex-start", "end", "flex-end", "center", "space-between", "space-around", "space-evenly"];
        return [0, 2.5, 5, 7.5].map((gap) => {
          grid.style.rowGap = `${gap}px`;
          return {
            rowGap: gap,
            cases: alignments.map((value) => {
              grid.style.alignContent = value;
              return window.captureAlignment();
            }),
          };
        });
      };
    </script>
  </body>
</html>
