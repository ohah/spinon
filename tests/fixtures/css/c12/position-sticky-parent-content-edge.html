<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C12.5 nested scrollport sticky fixture</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 360px; height: 260px; margin: 0; overflow: hidden; }
  body { font: 12px/1 sans-serif; }
  #outer {
    position: absolute;
    inset: 16px auto auto 16px;
    width: 328px;
    height: 228px;
    overflow: auto;
    border: 2px solid #111;
    padding: 8px;
  }
  #outer-content { width: 288px; height: 560px; position: relative; }
  #before-inner { height: 48px; background: #ddd; }
  #inner {
    width: 260px;
    height: 148px;
    overflow: auto;
    border: 2px solid #333;
    padding: 6px;
  }
  #inner-content { width: 224px; height: 360px; position: relative; }
  #before-section { height: 36px; background: #bbb; }
  #section {
    position: relative;
    width: 224px;
    height: 176px;
    padding-bottom: 12px;
    border-bottom: 2px solid #333;
    background: #f5f5f5;
  }
  #sticky {
    position: sticky;
    top: 8px;
    width: 180px;
    height: 28px;
    background: #db3344;
  }
  #section-after { height: 132px; background: #cde; }
  #inner-tail { height: 148px; background: #edf; }
  #outer-tail { height: 240px; background: #def; }
</style>
<div id="outer">
  <div id="outer-content">
    <div id="before-inner"></div>
    <div id="inner">
      <div id="inner-content">
        <div id="before-section"></div>
        <div id="section">
          <div id="sticky"></div>
        </div>
        <div id="section-after"></div>
        <div id="inner-tail"></div>
      </div>
    </div>
    <div id="outer-tail"></div>
  </div>
</div>
