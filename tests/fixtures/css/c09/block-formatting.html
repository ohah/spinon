<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spinon C09 Block formatting reference</title>
  <style>
    html, body { margin: 0; padding: 0; }
    body { color: #172033; font: 16px/1.25 sans-serif; direction: ltr; writing-mode: horizontal-tb; }
    *, *::before, *::after { box-sizing: content-box; }
    div { margin: 0; padding: 0; border: 0; }
    .viewport {
      position: absolute;
      top: 0;
      left: 0;
      display: flow-root;
      width: 320px;
      height: 240px;
      margin: 0;
      padding: 0;
      border: 0;
      direction: ltr;
    }
    .root { display: block; width: auto; min-width: 0; min-height: 0; }
    .box { height: 10px; }
  </style>
</head>
<body>
  <div class="viewport" id="viewport-c091-root-viewport">
    <div class="root" id="c091-root-viewport" style="margin:13px 10px 17px">
      <div id="c091-root-viewport-child" class="box"></div>
    </div>
  </div>

  <div class="viewport" id="viewport-c091-auto-width">
    <div class="root" id="c091-auto-width-root">
      <div id="c091-auto-width-parent" style="width:260px;margin:5px 7px 6px;padding:2px 10px 4px;border:3px solid;border-right-width:4px;border-bottom-width:5px">
        <div id="c091-auto-width-child" style="margin:0 12px 0 8px;padding:1px 6px 2px 5px;border:1px solid;border-right-width:3px;border-bottom-width:2px"></div>
      </div>
    </div>
  </div>

  <div class="viewport" id="viewport-c091-auto-width-min-width">
    <div class="root" id="c091-min-width-root">
      <div id="c091-min-width-parent" style="width:200px">
        <div id="c091-min-width-child" style="height:10px;min-width:180px;margin-left:10px;margin-right:20px"></div>
      </div>
    </div>
  </div>

  <div class="viewport" id="viewport-c091-percentage-containing-block">
    <div class="root" id="c091-percentage-root">
      <div id="c091-percentage-parent" style="width:200px">
        <div id="c091-percentage-child" style="width:50%;height:10px;box-sizing:border-box;padding:10px;border:2px solid"></div>
      </div>
    </div>
  </div>

  <div class="viewport" id="viewport-c091-centered-auto-margins">
    <div class="root" id="c091-centered-root">
      <div id="c091-centered-parent" style="width:200px">
        <div id="c091-centered-child" style="width:120px;height:10px;margin-right:auto;margin-left:auto"></div>
      </div>
    </div>
  </div>

  <div class="viewport" id="viewport-c091-vertical-auto-margins">
    <div class="root" id="c091-vertical-auto-root">
      <div id="c091-vertical-auto-parent" style="width:200px;height:100px">
        <div id="c091-vertical-auto-child" style="width:80px;height:20px;margin-top:auto;margin-bottom:auto"></div>
      </div>
    </div>
  </div>

  <div class="viewport" id="viewport-c091-overconstrained-ltr">
    <div class="root" id="c091-overconstrained-root">
      <div id="c091-overconstrained-parent" style="width:200px">
        <div id="c091-overconstrained-child" style="width:240px;height:10px;margin-left:10px;margin-right:20px"></div>
      </div>
    </div>
  </div>

  <div class="viewport" id="viewport-c091-negative-margin-auto-width">
    <div class="root" id="c091-negative-root">
      <div id="c091-negative-parent" style="width:200px">
        <div id="c091-negative-auto-width-child" style="height:10px;margin-left:-10px;margin-right:20px"></div>
      </div>
    </div>
  </div>

  <div class="viewport" id="viewport-c091-auto-height-order">
    <div class="root" id="c091-auto-height-root">
      <div id="c091-auto-height-first" style="height:10px"></div>
      <div id="c091-auto-height-second" style="height:20px"></div>
    </div>
  </div>

  <div class="viewport" id="viewport-c091-hidden-subtree">
    <div class="root" id="c091-hidden-root">
      <div id="c091-hidden-parent" style="display:none">
        <div id="c091-hidden-child" style="width:100px;height:30px;margin:20px"></div>
      </div>
      <div id="c091-hidden-visible-sibling" class="box"></div>
    </div>
  </div>

  <div class="viewport" id="viewport-c092-positive-siblings">
    <div class="root" id="c092-positive-root">
      <div id="c092-positive-first" style="width:100px;height:10px;margin-bottom:20px"></div>
      <div id="c092-positive-second" style="width:100px;height:10px;margin-top:30px"></div>
    </div>
  </div>

  <div class="viewport" id="viewport-c092-signed-self-collapse">
    <div class="root" id="c092-signed-root">
      <div id="c092-signed-first" style="width:100px;height:10px;margin-bottom:25px"></div>
      <div id="c092-signed-empty" style="width:100px;height:0;margin-top:30px;margin-bottom:-12px"></div>
      <div id="c092-signed-last" style="width:100px;height:10px;margin-top:10px"></div>
    </div>
  </div>

  <div class="viewport" id="viewport-c092-fractional-signed-collapse">
    <div class="root" id="c092-fractional-root">
      <div id="c092-fractional-first" style="height:10px;margin-bottom:25.25px"></div>
      <div id="c092-fractional-empty" style="height:0;margin-top:30.5px;margin-bottom:-12.25px"></div>
      <div id="c092-fractional-last" style="height:10px;margin-top:10.75px"></div>
    </div>
  </div>

  <div class="viewport" id="viewport-c092-negative-siblings">
    <div class="root" id="c092-negative-sibling-root">
      <div id="c092-negative-first" style="width:100px;height:10px;margin-bottom:-20px"></div>
      <div id="c092-negative-second" style="width:100px;height:10px;margin-top:-30px"></div>
    </div>
  </div>

  <div class="viewport" id="viewport-c092-parent-first-child">
    <div class="root" id="c092-parent-first-root">
      <div id="c092-parent-first" style="width:200px;margin-top:7px">
        <div id="c092-parent-first-child" style="height:10px;margin-top:20px"></div>
      </div>
    </div>
  </div>

  <div class="viewport" id="viewport-c092-parent-last-child">
    <div class="root" id="c092-parent-last-root">
      <div id="c092-parent-last" style="width:200px">
        <div id="c092-parent-last-child" style="height:10px;margin-bottom:20px"></div>
      </div>
      <div id="c092-parent-last-after" style="height:10px;margin-top:15px"></div>
    </div>
  </div>

  <div class="viewport" id="viewport-c092-padding-barrier">
    <div class="root" id="c092-padding-root">
      <div id="c092-padding-parent" style="width:200px;padding-top:1px">
        <div id="c092-padding-child" style="height:10px;margin-top:20px"></div>
      </div>
    </div>
  </div>

  <div class="viewport" id="viewport-c092-border-none">
    <div class="root" id="c092-border-none-root">
      <div id="c092-border-none-parent" style="width:200px;border-top:4px none">
        <div id="c092-border-none-child" style="height:10px;margin-top:20px"></div>
      </div>
    </div>
  </div>

  <div class="viewport" id="viewport-c092-border-solid">
    <div class="root" id="c092-border-solid-root">
      <div id="c092-border-solid-parent" style="width:200px;border-top:4px solid">
        <div id="c092-border-solid-child" style="height:10px;margin-top:20px"></div>
      </div>
    </div>
  </div>

  <div class="viewport" id="viewport-c093-flow-root-internal">
    <div class="root" id="c093-flow-root-internal-root">
      <div id="c093-flow-root-internal" style="display:flow-root;margin-top:10px">
        <div id="c093-flow-root-internal-child" style="height:10px;margin-top:20px;margin-bottom:30px"></div>
      </div>
    </div>
  </div>

  <div class="viewport" id="viewport-c093-flow-root-parent-margin">
    <div class="root" id="c093-flow-root-parent-root">
      <div id="c093-flow-root-parent" style="width:200px;margin-top:8px">
        <div id="c093-flow-root-parent-child" style="display:flow-root;margin-top:24px">
          <div id="c093-flow-root-parent-grandchild" style="height:10px"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="viewport" id="viewport-c093-flow-root-parent-last-child">
    <div class="root" id="c093-flow-root-parent-last-root">
      <div id="c093-flow-root-parent-last" style="width:200px">
        <div id="c093-flow-root-parent-last-child" style="display:flow-root;margin-bottom:24px">
          <div id="c093-flow-root-parent-last-grandchild" style="height:10px"></div>
        </div>
      </div>
      <div id="c093-flow-root-parent-last-after" style="height:10px;margin-top:16px"></div>
    </div>
  </div>

  <div class="viewport" id="viewport-c093-flow-root-sibling-margin">
    <div class="root" id="c093-flow-root-sibling-root">
      <div id="c093-flow-root-sibling-before" style="height:10px;margin-bottom:30px"></div>
      <div id="c093-flow-root-sibling" style="display:flow-root;height:10px;margin-top:20px;margin-bottom:30px"></div>
      <div id="c093-flow-root-sibling-after" style="height:10px;margin-top:20px"></div>
    </div>
  </div>
</body>
</html>
