<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>C13.2 root hidden / body auto · 400×240</title>
    <style>
      html, body { box-sizing: border-box; width: 400px; height: 240px; margin: 0; }
      html { overflow: hidden; }
      body { overflow: auto; background: #f4f7fa; }
      main { position: relative; box-sizing: border-box; width: 464px; height: 324px; background: #57a6d9; }
      #marker { position: absolute; left: 120px; top: 120px; width: 24px; height: 20px; background: #e3544e; }
      #fixed { position: fixed; right: 8px; bottom: 8px; width: 52px; height: 28px; background: #ed8b36; }
    </style>
  </head>
  <body>
    <main><div id="marker"></div></main>
    <div id="fixed"></div>
  </body>
</html>
