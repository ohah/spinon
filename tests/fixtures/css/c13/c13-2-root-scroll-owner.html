<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>C13.2 root scroll owner precomparison</title>
    <style>
      html { width: 640px; height: 480px; margin: 0; }
      body { width: 640px; height: 480px; margin: 0; overflow: visible; font: 14px/1.4 sans-serif; background: #f4f7fa; }
      h1 { margin: 0 0 12px; font-size: 20px; }
      #content { width: 700px; height: 920px; background: linear-gradient(90deg, #57a6d9 0 40px, transparent 40px), linear-gradient(#f4f7fa, #f4f7fa); border: 2px solid #15202b; }
      #content::after { content: "root and body overflow propagation fixture"; display: block; padding: 12px; }
      #fixed { position: fixed; right: 8px; bottom: 8px; width: 48px; height: 24px; border: 2px solid #15202b; background: #ed8b36; }
    </style>
  </head>
  <body>
    <h1>Root/body scroll owner oracle</h1>
    <main id="content"></main>
    <div id="fixed" aria-label="fixed viewport control"></div>
  </body>
</html>
