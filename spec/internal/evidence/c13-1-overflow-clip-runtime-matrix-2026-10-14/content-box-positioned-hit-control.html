<!doctype html>
<meta charset="utf-8">
<style>
  html,body{margin:0}
  #root{display:block;position:relative;width:200px;height:160px;background:#111}
  #clip{position:relative;left:20px;top:10px;width:80px;height:60px;padding:8px;border:4px solid #333;overflow:clip;overflow-clip-margin:content-box 8px;background:#333}
  #target{position:absolute;left:50px;top:40px;width:60px;height:40px;background:#f00}
</style>
<div id="root"><div id="clip"><div id="target"></div></div></div>
<script>
window.capture=()=>{
 const clip=document.querySelector('#clip'), target=document.querySelector('#target');
 const cs=getComputedStyle(clip), tr=target.getBoundingClientRect();
 const hit=(x,y)=>document.elementFromPoint(x,y)===target;
 const range=(axis)=>{const x=axis==='x';let start=Math.floor(x?tr.left:tr.top),end=Math.ceil(x?tr.right:tr.bottom)-1;const fixed=x?(tr.top+tr.bottom)/2:(tr.left+tr.right)/2;const arr=[];let begin=null,last=null;for(let i=start;i<=end;i++){const ok=x?hit(i,fixed):hit(fixed,i);if(ok&&begin===null)begin=i;if(!ok&&begin!==null){arr.push([begin,last]);begin=null}last=i}if(begin!==null)arr.push([begin,last]);return {fixedAt:fixed,ranges:arr}};
 const rect=e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom}};
 return {ua:navigator.userAgent,viewport:{width:innerWidth,height:innerHeight,dpr:devicePixelRatio},overflowX:cs.overflowX,overflowY:cs.overflowY,overflowClipMargin:cs.overflowClipMargin,clip:rect(clip),target:rect(target),hitRanges:{x:range('x'),y:range('y')}};
};
</script>
