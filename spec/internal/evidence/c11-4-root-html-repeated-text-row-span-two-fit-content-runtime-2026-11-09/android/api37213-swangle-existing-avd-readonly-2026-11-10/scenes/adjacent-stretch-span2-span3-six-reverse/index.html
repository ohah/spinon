<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>* { box-sizing: border-box; } html, body { margin: 0; padding: 0; }
.grid { display: grid; width: 40px; height: 220px; grid-template-columns: 40px; grid-template-rows: 10px;
 grid-auto-flow: row; align-items: normal; justify-content: start; justify-items: normal; direction: ltr;
 overflow: visible; margin: 0; padding: 0; row-gap: 0; column-gap: 0; }
.item { display: block; width: auto; height: auto; min-height: 0; margin: 0; padding: 0; overflow: visible; grid-column: 1 / 2; }
.empty { height: 10px; }
.payload { display: block; width: auto; height: auto; margin: 0; padding: 0; overflow: visible;
 font-family: monospace; font-size: 10px; font-weight: 400; font-style: normal; line-height: 10px;
 letter-spacing: 0; word-spacing: 0; white-space: normal; direction: ltr; } .item.empty { background-color: rgb(17, 23, 31); } .item[data-item="A"] { background-color: rgb(31, 41, 51); } .item[data-item="A"] .payload { background-color: rgb(121, 131, 141); } .item[data-item="B"] { background-color: rgb(61, 71, 81); } .item[data-item="B"] .payload { background-color: rgb(151, 161, 171); } .item[data-item="C"] { background-color: rgb(91, 101, 111); } .item[data-item="C"] .payload { background-color: rgb(181, 191, 201); } .item[data-item="D"] { background-color: rgb(101, 111, 121); } .item[data-item="D"] .payload { background-color: rgb(191, 201, 211); } .item[data-item="E"] { background-color: rgb(111, 121, 131); } .item[data-item="E"] .payload { background-color: rgb(201, 211, 221); }</style></head><body><div class="grid" style="grid-auto-rows:min-content min-content fit-content(20%) fit-content(10px) max-content auto;align-content:stretch"><div class="item empty" data-item="empty" style="grid-row:1 / 2"></div><div class="item" data-item="D" style="grid-row:5 / span 3"><div class="payload" data-payload="D">AAAA BBB CCCCC DDDD</div></div><div class="item" data-item="C" style="grid-row:4 / span 3"><div class="payload" data-payload="C">AAAAA BBBB CCC DDDD</div></div><div class="item" data-item="B" style="grid-row:3 / span 2"><div class="payload" data-payload="B">AAAAAA BBBBB CCCC DDD</div></div><div class="item" data-item="A" style="grid-row:2 / span 2"><div class="payload" data-payload="A">AAAA BBBB CCCC DDDD EEEE FFFF</div></div></div></body></html>
