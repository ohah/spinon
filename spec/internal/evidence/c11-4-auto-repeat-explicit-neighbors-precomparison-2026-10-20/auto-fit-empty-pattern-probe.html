<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  .grid {
    display: grid;
    box-sizing: border-box;
    width: 200px;
    height: 200px;
    grid-template-columns: 20px repeat(auto-fit, minmax(40px, 1fr) 20px) 10px;
    grid-template-rows: 20px repeat(auto-fit, minmax(40px, 1fr) 20px) 10px;
    column-gap: 8px;
    row-gap: 8px;
    justify-content: start;
    align-content: start;
    margin: 0;
    padding: 0;
    border: 0;
    background: #e2e8f0;
    outline: 1px solid #334155;
  }
  .item { width: 12px; height: 12px; background: #e5484d; }
  .column-item { grid-column: -2 / -1; grid-row: 1; }
  .row-item { grid-column: 1; grid-row: -2 / -1; }
  .grid::after {
    content: attr(id);
    position: absolute;
    left: 210px;
    top: 2px;
    padding: 2px 4px;
    color: #0f172a;
    background: white;
    font: 12px/1.3 sans-serif;
  }
</style>
<div id="empty-columns-suffix" class="grid"><i class="item column-item"></i></div>
<div id="empty-rows-suffix" class="grid"><i class="item row-item"></i></div>
