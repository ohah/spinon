<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  .grid {
    display: grid;
    width: 40px;
    height: 100px;
    grid-template-columns: 40px;
    grid-template-rows: 10px;
    grid-auto-flow: row;
    grid-auto-columns: auto;
    grid-auto-rows: fit-content(20%) auto 8px;
    row-gap: 0;
    column-gap: 0;
    align-content: start;
    align-items: normal;
    justify-content: start;
    justify-items: normal;
    overflow: visible;
    margin: 0;
    padding: 0;
    background-color: #102030;
  }
  .explicit {
    display: block;
    width: auto;
    height: 10px;
    margin: 0;
    padding: 0;
    background-color: #e5484d;
  }
  .item {
    display: block;
    width: auto;
    height: auto;
    min-height: 0;
    max-height: none;
    margin: 0;
    padding: 0;
    background-color: #22c55e;
  }
  .payload {
    display: block;
    width: auto;
    margin: 0;
    padding: 0;
  }
  .payload-1 { height: 34px; background-color: #3b82f6; }
  .payload-2 { height: 30px; background-color: #a855f7; }
  .payload-3 { height: 6px; background-color: #f59e0b; }
  .payload-4 { height: 25px; background-color: #14b8a6; }
  @media (prefers-color-scheme: dark) {
    .grid { grid-auto-rows: fit-content(calc(12px + 12%)) auto 8px; }
  }
</style>
<div id="grid" class="grid">
  <div id="explicit" class="explicit"></div>
  <div id="item-1" class="item"><div id="payload-1" class="payload payload-1"></div></div>
  <div id="item-2" class="item"><div id="payload-2" class="payload payload-2"></div></div>
  <div id="item-3" class="item"><div id="payload-3" class="payload payload-3"></div></div>
  <div id="item-4" class="item"><div id="payload-4" class="payload payload-4"></div></div>
</div>
