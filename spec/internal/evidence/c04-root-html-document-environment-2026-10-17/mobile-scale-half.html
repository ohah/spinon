<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=0.5">
  <title>C04.12 initial scale</title>
  <style>
    html, body { margin: 0; min-height: 100%; }
    #probe { height: 80px; color: CanvasText; background: Canvas; }
    @media (max-width: 390px) { #probe { --viewport-query: narrow; } }
    @media (prefers-color-scheme: light) { #probe { --scheme-query: light; } }
    @media (prefers-color-scheme: dark) { #probe { --scheme-query: dark; } }
  </style>
</head>
<body><div id="probe">C04.12 probe</div></body>
</html>
