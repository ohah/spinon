<!doctype html>
<meta charset="utf-8">
<title>C11.4 safe center overflow oracle</title>
<style>
  html { color-scheme: light; }
  body { margin: 0; font: 12px sans-serif; }
  .case { display: grid; grid-template-columns: 40px; grid-template-rows: 10px; grid-auto-rows: auto; column-gap: 0; width: 40px; height: 40px; margin: 8px; outline: 1px solid black; }
  .item { width: 40px; height: 10px; background: rgb(80 140 200); }
  .text { width: 40px; font: 10px/10px monospace; color: black; background: rgb(240 220 160); }
  #safe-positive { row-gap: 0; align-content: safe center; }
  #unsafe-positive { row-gap: 0; align-content: unsafe center; }
  #center-positive { row-gap: 0; align-content: center; }
  #safe-overflow { row-gap: calc(120% - 2px); align-content: safe center; }
  #unsafe-overflow { row-gap: calc(120% - 2px); align-content: unsafe center; }
  #center-overflow { row-gap: calc(120% - 2px); align-content: center; }
</style>
<div id="safe-positive" class="case"><div class="item"></div><div class="text">A</div><div class="text">B</div></div>
<div id="unsafe-positive" class="case"><div class="item"></div><div class="text">A</div><div class="text">B</div></div>
<div id="center-positive" class="case"><div class="item"></div><div class="text">A</div><div class="text">B</div></div>
<div id="safe-overflow" class="case"><div class="item"></div><div class="text">A</div><div class="text">B</div></div>
<div id="unsafe-overflow" class="case"><div class="item"></div><div class="text">A</div><div class="text">B</div></div>
<div id="center-overflow" class="case"><div class="item"></div><div class="text">A</div><div class="text">B</div></div>
