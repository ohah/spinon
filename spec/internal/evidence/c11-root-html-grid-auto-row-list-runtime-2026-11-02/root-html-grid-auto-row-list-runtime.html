<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Root HTML grid-auto-rows fixed list cycle</title>
    <style>
      html,
      body {
        margin: 0;
      }

      #root {
        display: grid;
        width: 100px;
        height: 100px;
        grid-template-columns: 40px 55px;
        grid-template-rows: 20px;
        grid-auto-flow: row;
        grid-auto-rows: 15px 25px;
        column-gap: 5px;
        row-gap: 5px;
        background-color: #ddd;
      }

      .item {
        display: block;
        width: 40px;
        height: 15px;
        background-color: #4a90e2;
      }

      .item:nth-child(2n) {
        width: 55px;
      }

      .item:nth-child(-n+2) {
        height: 20px;
      }

      .item:nth-child(n+5):nth-child(-n+6) {
        height: 25px;
      }
    </style>
  </head>
  <body>
    <main id="root">
      <div class="item" id="item1"></div>
      <div class="item" id="item2"></div>
      <div class="item" id="item3"></div>
      <div class="item" id="item4"></div>
      <div class="item" id="item5"></div>
      <div class="item" id="item6"></div>
      <div class="item" id="item7"></div>
      <div class="item" id="item8"></div>
    </main>
  </body>
</html>
