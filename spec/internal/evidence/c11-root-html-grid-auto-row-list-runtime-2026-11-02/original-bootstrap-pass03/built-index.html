<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Root HTML Grid integer repeat precomparison</title>
  <style>
    html, body { margin: 0; padding: 0; }
    .grid {
      box-sizing: border-box;
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
      background-color: #101820;
    }
    .grid > div { box-sizing: border-box; }
    .a { background-color: #e5484d; }
    .b { background-color: #3b82f6; }
    .c { background-color: #16a34a; }
    .d { background-color: #f59e0b; }
    .e { background-color: #a855f7; }

    #px-columns {
      width: 160px; height: 20px; background-color: #101820;
      grid-template-columns: repeat(2, 30px 50px);
      grid-template-rows: 20px;
    }
    #px-rows {
      width: 40px; height: 100px; background-color: #111827;
      grid-template-columns: 40px;
      grid-template-rows: repeat(2, 20px 30px);
    }
    #percentage-columns {
      width: 200px; height: 20px; background-color: #1f2937;
      grid-template-columns: repeat(2, 25% 25%);
      grid-template-rows: 20px;
    }
    #fraction-columns {
      width: 150px; height: 20px; background-color: #0f3d2e;
      grid-template-columns: repeat(2, 1fr 2fr);
      grid-template-rows: 20px;
    }
    #mixed-units {
      width: 200px; height: 20px; background-color: #4c1d95;
      grid-template-columns: 20px repeat(2, 20% 1fr);
      grid-template-rows: 20px;
    }
    #multiple-groups {
      width: 110px; height: 20px; background-color: #164e63;
      grid-template-columns: repeat(2, 20px) 10px repeat(2, 30px);
      grid-template-rows: 20px;
    }
    #single-count {
      width: 80px; height: 20px; background-color: #713f12;
      grid-template-columns: repeat(1, 30px 50px);
      grid-template-rows: 20px;
    }
  </style>
</head>
<body>
  <section id="px-columns" class="grid">
    <div class="a" style="width:30px;height:20px"></div>
    <div class="b" style="width:50px;height:20px"></div>
    <div class="c" style="width:30px;height:20px"></div>
    <div class="d" style="width:50px;height:20px"></div>
  </section>
  <section id="px-rows" class="grid">
    <div class="a" style="width:40px;height:20px"></div>
    <div class="b" style="width:40px;height:30px"></div>
    <div class="c" style="width:40px;height:20px"></div>
    <div class="d" style="width:40px;height:30px"></div>
  </section>
  <section id="percentage-columns" class="grid">
    <div class="a" style="width:50px;height:20px"></div>
    <div class="b" style="width:50px;height:20px"></div>
    <div class="c" style="width:50px;height:20px"></div>
    <div class="d" style="width:50px;height:20px"></div>
  </section>
  <section id="fraction-columns" class="grid">
    <div class="a" style="width:25px;height:20px"></div>
    <div class="b" style="width:50px;height:20px"></div>
    <div class="c" style="width:25px;height:20px"></div>
    <div class="d" style="width:50px;height:20px"></div>
  </section>
  <section id="mixed-units" class="grid">
    <div class="a" style="width:20px;height:20px"></div>
    <div class="b" style="width:40px;height:20px"></div>
    <div class="c" style="width:50px;height:20px"></div>
    <div class="d" style="width:40px;height:20px"></div>
    <div class="e" style="width:50px;height:20px"></div>
  </section>
  <section id="multiple-groups" class="grid">
    <div class="a" style="width:20px;height:20px"></div>
    <div class="b" style="width:20px;height:20px"></div>
    <div class="c" style="width:10px;height:20px"></div>
    <div class="d" style="width:30px;height:20px"></div>
    <div class="e" style="width:30px;height:20px"></div>
  </section>
  <section id="single-count" class="grid">
    <div class="a" style="width:30px;height:20px"></div>
    <div class="b" style="width:50px;height:20px"></div>
  </section>
</body>
</html>
