<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=2"><style>html,body{margin:0;padding:0}#probe{position:absolute;left:100px;top:50px;width:20px;height:10px;background:rgb(255,0,0)}</style></head><body><div id="probe"></div><pre id="metrics"></pre><script>requestAnimationFrame(()=>{const r=document.querySelector('#probe').getBoundingClientRect();const v=visualViewport;document.querySelector('#metrics').textContent=JSON.stringify({innerWidth,innerHeight,dpr:devicePixelRatio,visualWidth:v.width,visualHeight:v.height,visualScale:v.scale,offsetLeft:v.offsetLeft,offsetTop:v.offsetTop,probe:{x:r.x,y:r.y,width:r.width,height:r.height},predictedSurfaceRect:{x:r.x*devicePixelRatio*v.scale,y:r.y*devicePixelRatio*v.scale,width:r.width*devicePixelRatio*v.scale,height:r.height*devicePixelRatio*v.scale}})})</script></body></html>
