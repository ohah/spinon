<!doctype html>
<meta charset="utf-8">
<title>C11.2.3 Grid order oracle</title>
<style>
  html, body { margin: 0; padding: 0; }
  .grid {
    display: grid;
    width: 30px;
    height: 10px;
    grid-template-columns: 10px 10px 10px;
    grid-template-rows: 10px;
    grid-auto-rows: 10px;
    grid-auto-flow: row;
    gap: 0;
  }
  #ties { margin-top: 10px; }
  .item { width: 10px; height: 10px; }
  #mixed .a { order: 2; }
  #mixed .b { order: -1; }
  #mixed .c { order: 0; }
  #ties .a { order: 0; }
  #ties .b { order: -1; }
  #ties .c { order: -1; }
  #ties .d { order: 0; }
</style>
<div id="mixed" class="grid">
  <div class="item a"></div>
  <div class="item b"></div>
  <div class="item c"></div>
</div>
<div id="ties" class="grid">
  <div class="item a"></div>
  <div class="item b"></div>
  <div class="item c"></div>
  <div class="item d"></div>
</div>
