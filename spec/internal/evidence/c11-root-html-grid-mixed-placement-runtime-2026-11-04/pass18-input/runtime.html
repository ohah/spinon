<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>C11 Root HTML mixed explicit and one-axis placement runtime</title>
  </head>
  <body style="margin:0;padding:0;background-color:#ffffff">
    <div id="column-hidden-blocker" style="display:grid;box-sizing:border-box;width:120px;height:90px;grid-template-columns:40px 50px 30px;grid-template-rows:20px 30px 40px;grid-auto-flow:row;gap:0;margin:0;padding:0;overflow:visible">
      <div id="column-first" style="display:block;box-sizing:border-box;width:auto;height:auto;margin:0;padding:0;overflow:visible;grid-column:2 / 3;background-color:#e5484d"></div>
      <div id="column-hidden" style="display:block;box-sizing:border-box;width:auto;height:auto;margin:0;padding:0;overflow:visible;visibility:hidden;grid-row:2 / 3;grid-column:2 / 3;background-color:#3a8f5b"></div>
      <div id="column-last" style="display:block;box-sizing:border-box;width:auto;height:auto;margin:0;padding:0;overflow:visible;grid-column:2 / 3;background-color:#3578c7"></div>
    </div>
    <div id="row-definite-blocker" style="display:grid;box-sizing:border-box;width:120px;height:90px;grid-template-columns:40px 50px 30px;grid-template-rows:20px 30px 40px;grid-auto-flow:row;gap:0;margin:0;padding:0;overflow:visible">
      <div id="row-first" style="display:block;box-sizing:border-box;width:auto;height:auto;margin:0;padding:0;overflow:visible;grid-row:1 / 2;background-color:#f97316"></div>
      <div id="row-second" style="display:block;box-sizing:border-box;width:auto;height:auto;margin:0;padding:0;overflow:visible;grid-row:1 / 2;background-color:#8f3f71"></div>
      <div id="row-full-blocker" style="display:block;box-sizing:border-box;width:auto;height:auto;margin:0;padding:0;overflow:visible;grid-row:3 / 4;grid-column:3 / 4;background-color:#3a8f5b"></div>
    </div>
    <div id="row-span-next-to-blocker" style="display:grid;box-sizing:border-box;width:120px;height:90px;grid-template-columns:40px 50px 30px;grid-template-rows:20px 30px 40px;grid-auto-flow:row;gap:0;margin:0;padding:0;overflow:visible">
      <div id="row-span-blocker" style="display:block;box-sizing:border-box;width:auto;height:auto;margin:0;padding:0;overflow:visible;grid-row:1 / 2;grid-column:1 / 2;background-color:#3a8f5b"></div>
      <div id="row-span-partial" style="display:block;box-sizing:border-box;width:auto;height:auto;margin:0;padding:0;overflow:visible;grid-row:1 / span 2;grid-column:auto;background-color:#845ef7"></div>
    </div>
    <div id="column-definite-blocker" style="display:grid;box-sizing:border-box;width:120px;height:90px;grid-template-columns:40px 50px 30px;grid-template-rows:20px 30px 40px;grid-auto-flow:row;gap:0;margin:0;padding:0;overflow:visible">
      <div id="column-partial-first" style="display:block;box-sizing:border-box;width:auto;height:auto;margin:0;padding:0;overflow:visible;grid-column:2 / 3;background-color:#3578c7"></div>
      <div id="column-full-blocker" style="display:block;box-sizing:border-box;width:auto;height:auto;margin:0;padding:0;overflow:visible;grid-row:1 / 2;grid-column:2 / 3;background-color:#f97316"></div>
    </div>
    <div id="column-span-next-to-blocker" style="display:grid;box-sizing:border-box;width:120px;height:90px;grid-template-columns:40px 50px 30px;grid-template-rows:20px 30px 40px;grid-auto-flow:row;gap:0;margin:0;padding:0;overflow:visible">
      <div id="column-span-blocker" style="display:block;box-sizing:border-box;width:auto;height:auto;margin:0;padding:0;overflow:visible;grid-row:1 / 2;grid-column:2 / 3;background-color:#f97316"></div>
      <div id="column-span-partial" style="display:block;box-sizing:border-box;width:auto;height:auto;margin:0;padding:0;overflow:visible;grid-row:auto;grid-column:2 / span 2;background-color:#845ef7"></div>
    </div>
    <div id="display-none-full-control" style="display:grid;box-sizing:border-box;width:120px;height:90px;grid-template-columns:40px 50px 30px;grid-template-rows:20px 30px 40px;grid-auto-flow:row;gap:0;margin:0;padding:0;overflow:visible">
      <div id="display-none-partial" style="display:block;box-sizing:border-box;width:auto;height:auto;margin:0;padding:0;overflow:visible;grid-row:1 / 2;background-color:#e5484d"></div>
      <div id="display-none-full" style="display:none;box-sizing:border-box;width:auto;height:auto;margin:0;padding:0;overflow:visible;grid-row:1 / 2;grid-column:1 / 2;background-color:#3a8f5b"></div>
      <div id="display-none-visible-full" style="display:block;box-sizing:border-box;width:auto;height:auto;margin:0;padding:0;overflow:visible;grid-row:3 / 4;grid-column:3 / 4;background-color:#3a8f5b"></div>
      <div id="display-none-opposite-axis" style="display:none;box-sizing:border-box;width:auto;height:auto;margin:0;padding:0;overflow:visible;grid-column:1 / 2;background-color:#3578c7"></div>
    </div>
    <div id="all-auto-existing-route-control" style="display:grid;box-sizing:border-box;width:120px;height:50px;grid-template-columns:40px 50px 30px;grid-template-rows:20px 20px;grid-auto-flow:row;gap:0;margin:0;padding:0;overflow:visible">
      <div id="all-auto-first" style="display:block;box-sizing:border-box;width:auto;height:auto;margin:0;padding:0;overflow:visible;background-color:#e5484d"></div>
      <div id="all-auto-second" style="display:block;box-sizing:border-box;width:auto;height:auto;margin:0;padding:0;overflow:visible;background-color:#3578c7"></div>
    </div>
    <div id="fully-definite-existing-route-control" style="display:grid;box-sizing:border-box;width:120px;height:50px;grid-template-columns:40px 50px 30px;grid-template-rows:20px 20px;grid-auto-flow:row;gap:0;margin:0;padding:0;overflow:visible">
      <div id="fully-definite-item" style="display:block;box-sizing:border-box;width:auto;height:auto;margin:0;padding:0;overflow:visible;grid-row:1 / 2;grid-column:2 / 3;background-color:#845ef7"></div>
    </div>
  </body>
</html>
