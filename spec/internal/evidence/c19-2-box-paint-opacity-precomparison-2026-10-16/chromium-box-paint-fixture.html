<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C19.2 box paint and opacity oracle</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { width: 1280px; height: 633px; margin: 0; overflow: hidden; }
    body { font: 14px/1.3 sans-serif; color: white; }
    #stage { position: relative; width: 1280px; height: 633px; background: rgb(32 49 75); }
    .label { position: absolute; font-size: 12px; color: white; pointer-events: none; }
    #label-alpha { left: 24px; top: 14px; width: 110px; }
    #label-overlap { left: 152px; top: 14px; width: 120px; }
    #label-nested { left: 292px; top: 14px; width: 88px; }
    #label-alpha-opacity { left: 392px; top: 14px; width: 160px; }
    #label-wide-gamut { left: 672px; top: 14px; width: 170px; }
    #label-opacity-levels { left: 24px; top: 174px; width: 250px; }
    #label-clip-z { left: 392px; top: 174px; width: 150px; }
    #label-current-color-border { left: 552px; top: 174px; width: 180px; }
    #alpha { position: absolute; left: 32px; top: 48px; width: 64px; height: 64px; background: rgb(255 0 0 / 50%); }
    #group { position: absolute; left: 160px; top: 48px; width: 90px; height: 80px; opacity: .5; }
    #group-blue { position: absolute; left: 0; top: 0; width: 60px; height: 80px; background: rgb(0 128 255); }
    #group-yellow { position: absolute; left: 30px; top: 0; width: 60px; height: 80px; background: rgb(255 192 0); }
    #nested-outer { position: absolute; left: 300px; top: 48px; width: 64px; height: 64px; opacity: .5; }
    #nested-inner { position: absolute; left: 0; top: 0; width: 64px; height: 64px; opacity: .5; background: rgb(0 255 0); }
    #alpha-opacity { position: absolute; left: 400px; top: 48px; width: 64px; height: 64px; opacity: .5; background: rgb(255 0 0 / 50%); }
    #wide-gamut { position: absolute; left: 680px; top: 48px; width: 64px; height: 64px; background: oklch(60% 0.15 230deg); }
    .opacity-level { position: absolute; top: 208px; width: 80px; height: 80px; background: rgb(255 0 0); }
    .opacity-level::after { content: ""; position: absolute; left: 0; top: 0; width: 40px; height: 40px; background: rgb(0 0 255); }
    #opacity-zero { left: 32px; opacity: 0; }
    #opacity-half { left: 152px; opacity: .5; }
    #opacity-one { left: 272px; opacity: 1; }
    #clip-context { position: absolute; left: 400px; top: 208px; width: 64px; height: 64px; overflow: hidden; opacity: .5; }
    #clip-red { position: absolute; left: 40px; top: 0; width: 50px; height: 64px; z-index: 1; background: rgb(255 0 0); }
    #clip-blue { position: absolute; left: 20px; top: 20px; width: 30px; height: 30px; z-index: 2; background: rgb(0 0 255); }
    #current-color-border { position: absolute; left: 560px; top: 208px; width: 80px; height: 80px; color: rgb(24 192 128 / 50%); border: 8px solid currentColor; }
    #root-hit { position: absolute; left: 700px; top: 208px; width: 80px; height: 80px; background: rgb(255 255 255 / 10%); }
  </style>
</head>
<body>
  <main id="stage">
    <span class="label" id="label-alpha">source alpha over root surface</span>
    <span class="label" id="label-overlap">one opacity group / overlap</span>
    <span class="label" id="label-nested">nested opacity groups</span>
    <span class="label" id="label-alpha-opacity">color alpha × group opacity</span>
    <span class="label" id="label-wide-gamut">out-of-sRGB OKLCH</span>
    <span class="label" id="label-opacity-levels">opacity 0 / .5 / 1 with child overlap</span>
    <span class="label" id="label-clip-z">opacity group + clip + z-order</span>
    <span class="label" id="label-current-color-border">currentColor border alpha</span>
    <div id="alpha" data-node="alpha"></div>
    <div id="group" data-node="group">
      <div id="group-blue" data-node="group-blue"></div>
      <div id="group-yellow" data-node="group-yellow"></div>
    </div>
    <div id="nested-outer" data-node="nested-outer">
      <div id="nested-inner" data-node="nested-inner"></div>
    </div>
    <div id="alpha-opacity" data-node="alpha-opacity"></div>
    <div id="wide-gamut" data-node="wide-gamut"></div>
    <div id="opacity-zero" class="opacity-level" data-node="opacity-zero"></div>
    <div id="opacity-half" class="opacity-level" data-node="opacity-half"></div>
    <div id="opacity-one" class="opacity-level" data-node="opacity-one"></div>
    <div id="clip-context" data-node="clip-context">
      <div id="clip-red" data-node="clip-red"></div>
      <div id="clip-blue" data-node="clip-blue"></div>
    </div>
    <div id="current-color-border" data-node="current-color-border"></div>
    <div id="root-hit" data-node="root-hit"></div>
  </main>
  <script>
    window.c19Oracle = {
      version: 1,
      viewport: { width: innerWidth, height: innerHeight, dpr: devicePixelRatio },
      computed: Object.fromEntries([
        'alpha', 'group', 'nested-outer', 'nested-inner', 'alpha-opacity', 'wide-gamut',
        'opacity-zero', 'opacity-half', 'opacity-one', 'clip-context',
        'current-color-border'
      ].map(id => {
        const e = document.getElementById(id), s = getComputedStyle(e);
        return [id, {
          color: s.color,
          backgroundColor: s.backgroundColor,
          borderTopColor: s.borderTopColor,
          opacity: s.opacity,
          overflow: s.overflow,
          zIndex: s.zIndex,
          rect: [e.offsetLeft, e.offsetTop, e.offsetWidth, e.offsetHeight]
        }];
      })),
      hitTests: Object.fromEntries([
        ['alpha', 64, 80],
        ['group-blue', 170, 80],
        ['group-overlap', 205, 80],
        ['nested-inner', 332, 80],
        ['alpha-opacity', 432, 80],
        ['wide-gamut', 712, 80],
        ['opacity-zero', 48, 248],
        ['opacity-half-child', 168, 224],
        ['opacity-one', 312, 248],
        ['clip-z-overlap', 430, 240],
        ['clip-z-red', 455, 240],
        ['clip-outside', 470, 240],
        ['border', 600, 212],
        ['border-interior', 600, 248],
        ['root-hit', 740, 248]
      ].map(([name, x, y]) => {
        const e = document.elementFromPoint(x, y);
        return [name, { x, y, node: e?.getAttribute('data-node') ?? e?.id ?? e?.tagName ?? null }];
      })),
      samplePoints: {
        rootBackdrop: [800, 400],
        sourceAlpha: [64, 80],
        groupSingle: [170, 80],
        groupOverlap: [205, 80],
        nestedOpacity: [332, 80],
        alphaTimesGroupOpacity: [432, 80],
        wideGamutSrgb: [712, 80],
        opacityZero: [48, 248],
        opacityHalfSingle: [212, 260],
        opacityHalfOverlap: [168, 224],
        opacityOneOverlap: [288, 224],
        clippedZOverlap: [430, 240],
        clippedRed: [455, 240],
        clippedAway: [470, 240],
        currentColorBorder: [600, 212],
        borderInterior: [600, 248]
      }
    };
  </script>
</body>
</html>
