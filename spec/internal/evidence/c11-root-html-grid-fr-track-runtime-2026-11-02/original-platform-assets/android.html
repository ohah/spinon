<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Root HTML default rendering oracle</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; min-height: 100%; }
      body {
        color: #263342;
        background-color: #ffffff;
        font-family: system-ui, sans-serif;
        font-size: 16px;
        font-weight: 400;
      }
      main {
        box-sizing: border-box;
        width: 320px;
        min-height: 240px;
        padding: 16px;
        background-color: #f8fafc;
      }
      h1 {
        margin: 0 0 12px;
        color: #12345a;
        font-size: 24px;
        font-weight: 700;
      }
      p { margin: 0; }
      strong { font-weight: 700; }
      @media (prefers-color-scheme: dark) {
        body { color: #e4e7eb; background-color: #121212; }
        main { background-color: #1d2939; }
        h1 { color: #93c5fd; }
      }
    </style>
  </head>
  <body>
    <main id="content">
      <h1 id="heading">Spinon 문서</h1>
      <p id="paragraph">기본 HTML 텍스트와 <strong id="emphasis">강조</strong> 문장을 표시합니다.</p>
    </main>
  </body>
</html>
