[package]
name = "spinon-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[features]
c12-4-worker-stack-residency-test = []
c13-1-overflow-clip-worker-test = ["spinon-style-to-render/c13-1-overflow-clip-worker-test"]
c13-3-gesture-fixture-test = ["spinon-style-to-render/c13-3-gesture-fixture-test"]
c14-1-live-v8-fixture-test = []
c11-4-grid-track-sizing-fixture-test = [
    "spinon-style-to-layout/c11-4-grid-track-sizing-fixture-test",
    "spinon-style-to-render/c11-4-grid-track-sizing-fixture-test",
]
c04-12-root-html-block-paint-fixture-test = []
c04-12-root-html-text-paint-fixture-test = [
    "c04-12-root-html-block-paint-fixture-test",
    "spinon-style-to-layout/c04-12-root-html-text-paint-fixture-test",
]
c19-2-box-paint-opacity-fixture-test = []

[dependencies]
html5ever = "=0.40.1"
spinon-core = { path = "../spinon-core" }
spinon-layout = { path = "../spinon-layout" }
spinon-style = { path = "../spinon-style" }
spinon-style-to-layout = { path = "../spinon-style-to-layout" }
spinon-style-to-render = { path = "../spinon-style-to-render" }
spinon-render = { path = "../spinon-render" }
spinon-text-layout = { path = "../spinon-text-layout" }

[dev-dependencies]
serde_json = "=1.0.151"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
