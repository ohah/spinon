[package]
name = "spinon-ffi"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[features]
r10-experiment = ["dep:spinon-style-layout-spike"]
c04-runtime-gpu = ["dep:spinon-render-wgpu"]
c04-runtime-ua-cascade-fixture-test = []
c04-runtime-gpu-fixture-test = ["c04-runtime-gpu"]
c11-2-3-grid-fixture-test = ["c04-runtime-gpu-fixture-test"]
c04-runtime-gpu-test-hooks = ["c04-runtime-gpu-fixture-test", "spinon-render-wgpu/test-hooks"]
c12-4-metal-surface-readback-test = ["c04-runtime-gpu-fixture-test"]
c11-grid-metal-surface-pixels-test = ["c04-runtime-gpu-fixture-test"]
c12-4-worker-stack-residency-test = ["c04-runtime-gpu-fixture-test", "spinon-runtime/c12-4-worker-stack-residency-test"]
c13-1-overflow-clip-fixture-test = ["c04-runtime-gpu-fixture-test", "dep:sha2"]
c13-2-scroll-fixture-test = ["c04-runtime-gpu-fixture-test", "dep:spinon-core"]
c13-3-gesture-fixture-test = [
    "c04-runtime-gpu-fixture-test",
    "dep:spinon-core",
    "spinon-render/c13-3-gesture-fixture-test",
    "spinon-runtime/c13-3-gesture-fixture-test",
]
c14-1-app-fixture-test = [
    "dep:spinon-core",
    "dep:spinon-image",
    "dep:spinon-layout",
    "dep:sha2",
    "dep:spinon-style-to-layout",
    "spinon-runtime/c14-1-live-v8-fixture-test",
]
c14-2-app-fixture-test = [
    "dep:spinon-core",
    "dep:spinon-image",
    "dep:spinon-layout",
    "dep:sha2",
    "dep:spinon-style-to-layout",
    "spinon-runtime/c14-1-live-v8-fixture-test",
]
c14-3-app-fixture-test = [
    "dep:spinon-core",
    "dep:spinon-image",
    "dep:spinon-layout",
    "dep:sha2",
    "dep:spinon-style-to-layout",
    "spinon-runtime/c14-1-live-v8-fixture-test",
]
c18-1-image-paint-fixture-test = [
    "c04-runtime-gpu-fixture-test",
    "dep:spinon-core",
    "dep:spinon-image",
    "dep:spinon-layout",
    "dep:sha2",
    "spinon-runtime/c14-1-live-v8-fixture-test",
]
c18-2-alpha-image-compositing-fixture-test = ["c18-1-image-paint-fixture-test"]
c18-3-object-fit-position-fixture-test = [
    "c04-runtime-gpu-fixture-test",
    "dep:spinon-core",
    "dep:spinon-image",
    "dep:spinon-layout",
    "dep:sha2",
    "dep:spinon-style-to-layout",
    "spinon-runtime/c14-1-live-v8-fixture-test",
]
c18-4-image-fixture-test = [
    "c04-runtime-gpu-fixture-test",
    "dep:spinon-core",
    "dep:spinon-image",
    "dep:spinon-layout",
    "dep:spinon-style-to-layout",
    "dep:sha2",
    "spinon-runtime/c14-1-live-v8-fixture-test",
]
c19-2-box-paint-opacity-fixture-test = [
    "c04-runtime-gpu-fixture-test",
    "dep:spinon-core",
    "dep:spinon-layout",
    "dep:spinon-style-to-layout",
    "spinon-runtime/c14-1-live-v8-fixture-test",
    "spinon-runtime/c19-2-box-paint-opacity-fixture-test",
]
c15-3-wgpu-glyph-paint-fixture-test = [
    "c04-runtime-gpu-fixture-test",
    "dep:spinon-core",
    "dep:spinon-text-layout",
    "spinon-runtime/c19-2-box-paint-opacity-fixture-test",
]

[dependencies]
spinon-style = { path = "../spinon-style" }
spinon-runtime = { path = "../spinon-runtime" }
spinon-render = { path = "../spinon-render" }
spinon-render-wgpu = { path = "../spinon-render-wgpu", optional = true }
spinon-style-layout-spike = { path = "../../spikes/style-layout", optional = true }
serde_json = "1.0.151"
sha2 = { version = "0.11.1", optional = true }
spinon-core = { path = "../spinon-core", optional = true }
spinon-image = { path = "../spinon-image", optional = true }
spinon-layout = { path = "../spinon-layout", optional = true }
spinon-style-to-layout = { path = "../spinon-style-to-layout", optional = true }
spinon-text-layout = { path = "../spinon-text-layout", optional = true }

[dev-dependencies]
spinon-core = { path = "../spinon-core" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
