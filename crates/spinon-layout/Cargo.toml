[package]
name = "spinon-layout"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
spinon-core = { path = "../spinon-core" }
spinon-text-layout = { path = "../spinon-text-layout" }
taffy = { path = "../../vendor/taffy", version = "=0.15.0", default-features = false, features = ["std", "flexbox", "block_layout", "grid", "taffy_tree", "calc"] }

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
