[package]
name = "spinon-style-to-render"
version = "0.1.0"
edition = "2024"
publish = false

[features]
c12-5-sticky-fixture-test = ["spinon-render/c12-5-sticky-fixture-test"]
c11-3-3-grid-implicit-named-lines-fixture-test = []
c11-4-grid-track-sizing-fixture-test = ["spinon-style/c11-4-grid-track-sizing-fixture-test"]
c13-1-overflow-clip-worker-test = []
c13-3-gesture-fixture-test = ["spinon-render/c13-3-gesture-fixture-test"]

[dependencies]
spinon-core = { path = "../spinon-core" }
spinon-layout = { path = "../spinon-layout" }
spinon-render = { path = "../spinon-render" }
spinon-style = { path = "../spinon-style" }
spinon-style-to-layout = { path = "../spinon-style-to-layout" }

[dev-dependencies]
serde_json = "=1.0.151"
stylo = "=0.22.0"

[lints.rust]
unsafe_code = "deny"
